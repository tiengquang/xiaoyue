.cls table,.words table{border-collapse:collapse;width:100%;font-size:14px}

.cls th,.cls td,.words th,.words td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}

.tip{display:flex;gap:12px;align-items:flex-start;background:var(--jade-soft);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.tip img{width:34px;height:34px;flex:none}
.tip b{color:var(--jade)}
.words .w{font:700 16px var(--f-body);white-space:nowrap}
.words .py{color:var(--mute);font:13px var(--f-vi)}
.words .hv,.words .vi{font:14px var(--f-vi)}
.ty{display:inline-block;min-width:1.6em;text-align:center;font:700 12px var(--f-vi);color:#fff;border-radius:4px;padding:0 4px}
.ty-A{background:var(--tyA)}.ty-B{background:var(--tyB)}.ty-C{background:var(--tyC)}.ty-D{background:var(--tyD)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px;font-size:13px;color:var(--mute)}
.filters label{display:flex;gap:4px;align-items:center;cursor:pointer}
.btn{border:1px solid var(--jade);background:var(--jade);color:var(--card);font:600 14px var(--f-body);padding:8px 16px;border-radius:8px;cursor:pointer}
.btn.ghost{background:none;color:var(--jade)}
.btn:disabled{opacity:.5;cursor:default}
.quiz{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px}
.quiz .q{font:700 30px/1.3 var(--f-body);margin:6px 0}
.quiz .qsub{color:var(--mute);font:14px var(--f-vi);margin-bottom:14px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.opts button{text-align:left;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:15px var(--f-vi);padding:10px 12px;border-radius:8px;cursor:pointer}
.opts button.ok{border-color:var(--tyA);background:var(--jade-soft)}
.opts button.no{border-color:var(--seal)}
.fb{margin-top:12px;font-size:14px;min-height:1.5em}
.score{font:600 13px var(--f-vi);color:var(--mute)}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:78ch;padding:10px 14px;border-radius:10px;white-space:pre-wrap;font:15px/1.7 var(--f-body)}
.msg.me{align-self:flex-end;background:var(--jade);color:var(--card)}
.msg.ai{align-self:flex-start;background:var(--card);border:1px solid var(--line)}
.ask{display:flex;gap:8px;margin-top:10px}
.ask textarea{flex:1;min-width:0;font:15px var(--f-body);padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);resize:vertical;min-height:48px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chips button{border:1px solid var(--line);background:var(--card);color:var(--ink);font:13px var(--f-body);padding:4px 10px;border-radius:999px;cursor:pointer}
.note{font:13px/1.6 var(--f-vi);color:var(--mute)}
.results{margin-top:10px}
footer{margin-top:40px;padding-top:14px;border-top:1px solid var(--line);font:13px/1.6 var(--f-vi);color:var(--mute)}
@media (max-width:760px){
  .grid{grid-template-columns:minmax(0,1fr)}
  nav.rail{display:none}
  .picker{display:block;width:100%;font:15px var(--f-body);padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);margin-bottom:14px}
  .sechead h2{font-size:23px}
  .words .hide-s{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
const DATA = [{"si": 1, "ch": "第一章 宗教文化的词汇", "num": "第一节", "title": "佛教——慈悲智慧的灯塔", "words": [["佛陀", "Fótuó", "phật đà", "Phật Đà, Đức Phật", "A", "意为“觉者”，指释迦牟尼佛，是佛教的创始人。"], ["心经", "xīnjīng", "tâm kinh", "Tâm kinh (Bát-nhã Ba-la-mật-đa tâm kinh)", "A", "全称《般若波罗蜜多心经》，是大乘佛教中的一部重要经典，讲解了空性的智慧。"], ["六度", "liùdù", "lục độ", "lục độ (sáu ba-la-mật)", "A", "指布施、持戒、忍辱、精进、禅定、般若等六种修行法门，用以度化众生。"], ["报身", "bàoshēn", "báo thân", "báo thân", "A", "佛教“三身”之一，指佛经过长期修行、功德圆满而得的果报之身，如阿弥陀佛。（佛在人间示现的形象称“应身”或“化身”）"], ["律宗", "lǜzōng", "luật tông", "Luật tông", "A", "中国佛教的一个宗派，强调严格遵守戒律。"], ["法相宗", "fǎxiàngzōng", "pháp tướng tông", "Pháp Tướng tông (Duy Thức tông)", "A", "又称唯识宗，是研究和解释心识及其作用的佛教宗派。"], ["天台宗", "tiāntáizōng", "thiên đài tông", "Thiên Thai tông", "A", "中国佛教的一个宗派，以其对《法华经》的独特解释著称。"], ["华严宗", "huáyánzōng", "hoa nghiêm tông", "Hoa Nghiêm tông", "A", "又称贤首宗，是中国佛教的一个宗派，以《大方广佛华严经》为主要依据。"], ["密宗", "mìzōng", "mật tông", "Mật tông", "A", "也叫真言宗，强调通过咒语、手印等秘密仪式修行。"], ["净土宗", "jìngtǔzōng", "tịnh thổ tông", "Tịnh Độ tông", "A", "提倡通过念佛往生西方极乐世界的佛教宗派。"], ["行者", "xíngzhě", "hành giả", "hành giả", "A", "①〈书〉行人。②出家而未经剃度的佛教徒，也泛指修行的人。"], ["忏悔", "chànhuǐ", "sám hối", "sám hối", "A", "指对自己过去犯下的错误或罪业表示后悔，并立志改正的行为。"], ["菩萨", "púsà", "bồ tát", "Bồ Tát", "A", "意为“觉悟有情”，是指已经觉悟但为了救度所有众生而延迟成佛的圣者。"], ["金刚经", "jīngāngjīng", "kim cương kinh", "kinh Kim Cương", "A", "全称《金刚般若波罗蜜经》，是大乘佛教的重要经典之一，主要讲述空性和无我的道理。"], ["四谛", "sìdì", "tứ đế", "Tứ đế, Tứ diệu đế", "A", "即苦、集、灭、道四条真理，是佛教基础教义，阐述了人生痛苦的本质及解脱之道。"], ["应身", "yìngshēn", "ứng thân", "ứng thân", "A", "佛的三种身体之一，指的是佛为了适应不同众生的需求而变化出来的各种形象。"], ["比丘", "bǐqiū", "tỷ khâu", "tỳ kheo", "A", "出家男众僧侣，受过具足戒。"], ["比丘尼", "bǐqiūní", "tỷ khâu ni", "tỳ kheo ni", "A", "出家女众僧侣，同样受过具足戒。"], ["禅修", "chánxiū", "thiền tu", "tu thiền", "C", "通过打坐等方式进行冥想修行，以达到心灵净化的目的。"], ["阿罗汉", "āluóhàn", "a la hán", "A-la-hán", "A", "小乘佛教理想的成就者，达到了个人解脱的最高境界。"], ["法华经", "fǎhuájīng", "pháp hoa kinh", "kinh Pháp Hoa", "A", "全称《妙法莲华经》，是大乘佛教的重要经典之一，强调一切众生皆可成佛。"], ["中道", "zhōngdào", "trung đạo", "trung đạo", "A", "佛教教义中的一个重要概念，主张避免极端，保持平衡和谐。"], ["三宝", "sānbǎo", "tam bảo", "Tam bảo", "A", "指佛、法、僧三个方面的神圣对象，是佛教徒信仰的核心。"], ["打坐", "dǎzuò", "đả tọa", "ngồi thiền", "C", "一种静坐冥想的形式，用于集中注意力和平静心灵。"], ["因缘", "yīnyuán", "nhân duyên", "nhân duyên", "A", "指事物发生的原因和条件，是佛教因果论的基础。"], ["禅定", "chándìng", "thiền định", "thiền định", "A", "指专注一境而不散乱的状态，是佛教修行的重要方法之一。"], ["空性", "kōngxìng", "không tính", "tính không", "A", "指万物本质上的无自性，是大乘佛教核心教义之一。"], ["佛法僧", "fófǎsēng", "phật pháp tăng", "Phật – Pháp – Tăng", "A", "同“三宝”，指佛教中的三个神圣元素。"], ["居士", "jūshì", "cư sĩ", "cư sĩ", "A", "指在家修行的佛教信徒。"], ["念佛", "niànfó", "niệm phật", "niệm Phật", "A", "通过反复念诵佛号来积聚功德并求生净土的一种修行方式。"], ["果报", "guǒbào", "quả báo", "quả báo", "B", "根据因果法则，行为的结果或回报。"], ["戒律", "jièlǜ", "giới luật", "giới luật", "A", "佛教徒必须遵守的行为规范和道德准则。"], ["实相", "shíxiàng", "thực tướng", "thực tướng", "A", "指事物的真实状态或本质，超越了表象。"], ["禅宗", "chánzōng", "thiền tông", "Thiền tông", "A", "中国佛教的一个重要宗派，强调直接体验和悟入佛法。"], ["斋戒", "zhāijiè", "trai giới", "trai giới, ăn chay giữ giới", "A", "旧时祭祀鬼神时穿整洁衣服、戒除嗜欲（如不喝酒、不吃荤等），以表示虔诚；佛教指持守戒律、过午不食等。"], ["经行", "jīngxíng", "kinh hành", "kinh hành", "A", "一边行走一边念经或思考佛法，是一种动态的修行方式。"], ["涅槃", "nièpán", "niết bàn", "niết bàn", "A", "意为熄灭烦恼，指彻底解脱生死轮回后的状态。"], ["五戒", "wǔjiè", "ngũ giới", "ngũ giới", "A", "佛教给在家信徒制定的五个基本戒律：不杀生、不偷盗、不邪淫、不妄语、不饮酒。"], ["禅师", "chánshī", "thiền sư", "thiền sư", "A", "指精通禅法并指导他人修行的高僧。"], ["放生", "fàngshēng", "phóng sinh", "phóng sinh", "A", "释放被捕获的动物回自然环境，作为慈悲心的一种表达。"], ["塔寺", "tǎsì", "tháp tự", "chùa tháp", "C", "塔和寺的合称，泛指佛寺。"], ["舍利", "shèlì", "xá lợi", "xá lợi", "A", "指佛或高僧遗体火化后留下的结晶体或其他不易焚毁的物质。"], ["轮回", "lúnhuí", "luân hồi", "luân hồi", "A", "指生命在不同存在形式之间不断转世的过程。"], ["十善", "shíshàn", "thập thiện", "thập thiện", "A", "指十条善行准则，包括言语、行为和思想三个方面。"], ["法身", "fǎshēn", "pháp thân", "pháp thân", "A", "佛的三种身体之一，代表绝对真理或终极实在。"], ["上师", "shàngshī", "thượng sư", "thượng sư", "A", "藏传佛教中指具有高度精神成就并能引导弟子修行的导师。"], ["礼佛", "lǐfó", "lễ phật", "lễ Phật", "A", "向佛像礼拜致敬，表达敬意和信仰。"], ["法会", "fǎhuì", "pháp hội", "pháp hội", "A", "佛教徒聚集在一起举行的各种宗教仪式或集会。"], ["因果报应", "yīnguǒ-bàoyìng", "nhân quả báo ứng", "nhân quả báo ứng; ác giả ác báo", "A", "指人的行为会产生相应的结果，善因得善果，恶因得恶果。"], ["六根清净", "liùgēn-qīngjìng", "lục căn thanh tịnh", "lục căn thanh tịnh", "A", "眼、耳、鼻、舌、身、意六种感官不受外界干扰，内心清净。"], ["五体投地", "wǔtǐ-tóudì", "ngũ thể đầu địa", "phục sát đất", "C", "指两手、两膝和头着地，是佛教最恭敬的礼节；现多用来形容敬佩到了极点。"], ["回头是岸", "huítóu-shì'àn", "hồi đầu thị ngạn", "quay đầu là bờ", "A", "比喻犯错误的人只要改过自新，就能找到正确的道路。"], ["四大皆空", "sìdà-jiēkōng", "tứ đại giai không", "tứ đại giai không", "A", "佛教认为世界万物由地、水、火、风四种元素构成，最终都会归于虚无。"], ["苦海无边，回头是岸", "kǔ hǎi wú biān, huí tóu shì àn", "khổ hải vô biên, hồi đầu thị ngạn", "bể khổ mênh mông, quay đầu là bờ", "A", "比喻人生的苦难没有尽头，只有改过自新才能脱离困境。"], ["放下屠刀，立地成佛", "fàng xià tú dāo, lì dì chéng fó", "phóng hạ đồ đao, lập địa thành phật", "buông dao đồ tể, lập tức thành Phật", "A", "比喻坏人一旦悔改，立即可以成为好人。"], ["一叶障目，不见泰山", "yī yè zhàng mù, bù jiàn tài shān", "nhất diệp chướng mục, bất kiến thái sơn", "thấy cây mà không thấy rừng", "C", "一片叶子挡住了眼睛，连泰山都看不见，比喻被小事蒙蔽而忽略了大事。"], ["三生有幸", "sānshēng-yǒuxìng", "tam sinh hữu hạnh", "có phúc ba đời", "C", "形容非常幸运，前世修来的福分。"], ["心如止水", "xīnrú-zhǐshuǐ", "tâm như chỉ thủy", "lòng phẳng lặng như nước", "C", "形容心境平静，不受外界影响。（“止水”之喻源自《庄子·德充符》）"], ["普度众生", "pǔdù-zhòngshēng", "phổ độ chúng sinh", "phổ độ chúng sinh", "A", "广泛救度所有众生，使他们脱离苦海。"], ["不二法门", "bù'èr-fǎmén", "bất nhị pháp môn", "pháp môn bất nhị; con đường duy nhất", "B", "唯一的正确途径或方法，特指佛教的真理。"], ["色即是空", "sèjí-shìkōng", "sắc tức thị không", "sắc tức thị không", "A", "一切物质现象都是虚幻不实的。"], ["明心见性", "míngxīn-jiànxìng", "minh tâm kiến tính", "minh tâm kiến tính", "A", "明白自己的心性，达到觉悟的境界。"], ["出家修行", "chūjiā-xiūxíng", "xuất gia tu hành", "xuất gia tu hành, đi tu", "A", "离开世俗家庭，专心致志地修行佛法。"], ["功德无量", "gōngdé-wúliàng", "công đức vô lượng", "công đức vô lượng", "A", "形容所做的善事或功德非常大，无法衡量。"], ["阿弥陀佛", "Ēmítuófó", "a di đà phật", "A Di Đà Phật", "A", "佛教指西方极乐世界的教主，也译作无量寿佛或无量光佛；信佛的人常用作口头诵念的佛号，表示祈祷、感谢等意。"], ["五蕴皆空", "wǔyùn-jiēkōng", "ngũ uẩn giai không", "ngũ uẩn giai không", "A", "佛教认为人的色、受、想、行、识五种聚合物最终都是空的。"], ["慈悲为怀", "cíbēi-wéihuái", "từ bi vi hoài", "lấy từ bi làm gốc", "C", "以慈爱和怜悯之心对待他人。"], ["轮回转世", "lúnhuí-zhuǎnshì", "luân hồi chuyển thế", "luân hồi chuyển kiếp", "A", "指生命在生死之间不断循环，经历不同的转世。"], ["禅心似铁", "chánxīn-sìtiě", "thiền tâm tự thiết", "lòng thiền vững như sắt", "D", "形容禅定的心境像铁一样坚定不动摇。（习用语，非固定成语）"], ["洗心革面", "xǐxīn-gémiàn", "tẩy tâm cách diện", "cải tà quy chính, làm lại cuộc đời", "C", "彻底改变旧的思想和行为，重新做人。"], ["随缘不变", "suíyuán-bùbiàn", "tùy duyên bất biến", "tùy duyên bất biến", "A", "佛教术语，指真如随缘显现万法而本性不变；引申为适应环境而不失本心。"], ["心向菩提", "xīnxiàng-pútí", "tâm hướng bồ đề", "hướng về giác ngộ", "C", "心中向往觉悟和智慧。（习用语，非固定成语）"], ["无缘无故", "wúyuán-wúgù", "vô duyên vô cố", "vô duyên vô cớ", "A", "没有任何原因或理由。"], ["一尘不染", "yīchén-bùrǎn", "nhất trần bất nhiễm", "sạch không một hạt bụi; trong sạch", "C", "形容非常清洁，一点灰尘都没有；也比喻人心纯净，不受污染。（原为佛教用语，“尘”指色、声、香、味、触、法六尘）"], ["一花一世界", "yī huā yī shì jiè", "nhất hoa nhất thế giới", "nhất hoa nhất thế giới", "A", "一朵花就是一个世界，形容微观中蕴含着宏观的哲理。"], ["十方世界", "shífāng-shìjiè", "thập phương thế giới", "mười phương thế giới", "A", "佛教术语，指宇宙间的一切空间。"], ["金刚不坏之身", "jīn gāng bù huài zhī shēn", "kim cương bất hoại chi thân", "thân kim cương bất hoại; mình đồng da sắt", "C", "形容身体坚不可摧，比喻精神意志坚强。"], ["超凡入圣", "chāofán-rùshèng", "siêu phàm nhập thánh", "siêu phàm nhập thánh", "A", "超越平凡，进入神圣的境界。"], ["戒定慧", "jièdìnghuì", "giới định tuệ", "giới – định – tuệ", "A", "佛教修行的三个基本阶段，分别是持戒、禅定和智慧。"], ["道高一尺，魔高一丈", "dào gāo yī chǐ, mó gāo yī zhàng", "đạo cao nhất thước, ma cao nhất trượng", "đạo cao một thước, ma cao một trượng", "A", "原为佛家语，告诫修行者警惕外界诱惑；后比喻取得一定成就后，前进道路上可能遇到更大的障碍。"], ["得失随缘", "déshī-suíyuán", "đắc thất tùy duyên", "được mất tùy duyên", "A", "对于得失顺从缘分，不强求。（“随缘”为佛教用语）"], ["因果报应，循环不爽", "yīn guǒ bào yìng, xún huán bù shuǎng", "nhân quả báo ứng, tuần hoàn bất sảng", "gieo nhân nào gặt quả nấy", "C", "指人的行为会产生相应的结果，善因得善果，恶因得恶果，这个规律不会改变。"], ["心安即是福", "xīn ān jí shì fú", "tâm an tức thị phúc", "lòng an là phúc", "C", "内心平静安宁就是最大的幸福。（民间俗语，与佛教“安心”思想相通）"], ["种瓜得瓜，种豆得豆", "zhòng guā dé guā, zhòng dòu dé dòu", "chủng qua đắc qua, chủng đậu đắc đậu", "gieo nhân nào gặt quả nấy; trồng dưa được dưa, trồng đậu được đậu", "C", "做什么事情都会有相应的结果，强调因果关系。（原为佛教语，比喻因果报应）"], ["八风吹不动", "bā fēng chuī bù dòng", "bát phong xuy bất động", "tám gió thổi không động", "D", "形容一个人的心境非常稳定，不受外界的影响（八风指利、衰、毁、誉、称、讥、苦、乐）。"], ["诸恶莫作，众善奉行", "zhū è mò zuò, zhòng shàn fèng xíng", "chư ác mạc tác, chúng thiện phụng hành", "chư ác mạc tác, chúng thiện phụng hành", "A", "不做各种坏事，积极行善，这是佛教徒的基本行为准则。"], ["平时不烧香，临时抱佛脚", "píng shí bù shāo xiāng, lín shí bào fó jiǎo", "bình thời bất thiêu hương, lâm thời bão phật cước", "nước đến chân mới nhảy", "C", "比喻平时不做准备，事到临头才慌忙想办法。"], ["跑了和尚跑不了庙", "pǎo le hé shang pǎo bu liǎo miào", "bào liễu hòa thượng bào bất liễu miếu", "chạy đằng trời cũng không thoát", "C", "比喻人虽然一时躲开了，但他的住处和根底跑不掉，终究能够找到。"], ["救人一命，胜造七级浮屠", "jiù rén yī mìng, shèng zào qī jí fú tú", "cứu nhân nhất mệnh, thắng tạo thất cấp phù đồ", "cứu một người phúc đẳng hà sa", "C", "浮屠指佛塔。救人一条性命，比建造七层佛塔的功德还大；劝人救人于危难。"], ["做一天和尚撞一天钟", "zuò yī tiān hé shang zhuàng yī tiān zhōng", "tố nhất thiên hòa thượng tràng nhất thiên chung", "làm cho có; được ngày nào hay ngày ấy", "C", "比喻得过且过，敷衍了事，对工作不负责任。"], ["不看僧面看佛面", "bù kàn sēng miàn kàn fó miàn", "bất khán tăng diện khán phật diện", "không nể mặt người này cũng nể mặt người kia", "D", "不看和尚的情面，也要看佛祖的情面。比喻即使不考虑当事人，也要顾及与他有关的人的情面。"], ["远来的和尚会念经", "yuǎn lái de hé shang huì niàn jīng", "viễn lai đích hòa thượng hội niệm kinh", "bụt chùa nhà không thiêng", "C", "比喻人们往往看重外来的人，而轻视身边的人。"], ["人争一口气，佛争一炷香", "rén zhēng yī kǒu qì, fó zhēng yī zhù xiāng", "nhân tranh nhất khẩu khí, phật tranh nhất chú hương", "người sống vì danh dự, vì thể diện", "D", "炷指点燃的香。比喻人要有志气，争取荣誉，不甘落后。"], ["善有善报，恶有恶报", "shàn yǒu shàn bào, è yǒu è bào", "thiện hữu thiện báo, ác hữu ác báo", "ở hiền gặp lành, ác giả ác báo", "C", "做好事会得到好的报应，做坏事会得到坏的报应。体现了佛教因果报应的观念。"], ["一个和尚挑水吃，两个和尚抬水吃，三个和尚没水吃", "yī gè hé shang tiāo shuǐ chī, liǎng gè hé shang tái shuǐ chī, sān gè hé shang méi shuǐ chī", "nhất cá hòa thượng khiêu thủy cật, lưỡng cá hòa thượng đài thủy cật, tam cá hòa thượng một thủy cật", "lắm sãi không ai đóng cửa chùa", "C", "比喻人多了反而互相推诿、依赖，什么事也办不成。"], ["骑驴找驴——不识真身", "qí lǘ zhǎo lǘ — bù shí zhēn shēn", "kỵ lư trảo lư – bất thức chân thân", "cưỡi lừa tìm lừa – có mà không biết", "C", "比喻自己拥有的东西却在外面寻找，不知珍惜眼前的事物。（源自禅宗“骑驴觅驴”）"], ["观音菩萨的净瓶——清净", "guān yīn púsà de jìng píng — qīng jìng", "quan âm bồ tát đích tịnh bình – thanh tịnh", "bình tịnh thủy của Quan Âm – thanh tịnh", "D", "形容内心纯洁无暇，没有杂念。"], ["和尚打伞——无法（发）无天", "hé shang dǎ sǎn — wú fǎ wú tiān", "hòa thượng đả tản – vô pháp vô thiên", "sư che ô – vô pháp vô thiên", "C", "和尚头上无发，打伞又遮住了天；“发”谐音“法”。比喻毫无顾忌，胡作非为。"], ["丈二和尚——摸不着头脑", "zhàng èr hé shang — mō bu zháo tóu nǎo", "trượng nhị hòa thượng – mò bất trước đầu não", "chẳng hiểu đầu cua tai nheo ra sao", "C", "丈二指一丈二尺高，形容和尚个子很高，别人摸不到他的头。比喻弄不清是怎么回事。"], ["小和尚念经——有口无心", "xiǎo hé shang niàn jīng — yǒu kǒu wú xīn", "tiểu hòa thượng niệm kinh – hữu khẩu vô tâm", "nói như vẹt; miệng nói mà lòng không để ý", "C", "小和尚嘴里念着经文，心里却不明白其中的意思。比喻嘴上说说，心里并不在意。"], ["和尚的木鱼——想敲就敲", "hé shang de mù yú — xiǎng qiāo jiù qiāo", "hòa thượng đích mộc ngư – tưởng xao tựu xao", "cái mõ nhà chùa – ai muốn gõ thì gõ", "D", "木鱼是僧人念经时敲击的法器。比喻任人随意欺负。"], ["唐僧上西天——取经去", "Táng Sēng shàng xī tiān — qǔ jīng qù", "đường tăng thượng tây thiên – thủ kinh khứ", "Đường Tăng sang Tây Thiên – đi thỉnh kinh", "C", "唐僧即唐代高僧玄奘，曾西行到天竺（古印度）求取佛经。比喻到别处学习经验。"]], "obj": ["掌握佛教核心术语及其汉越读音", "理解佛教成语、谚语的来源与比喻义", "能对比汉越两种语言中佛教词语的异同"], "cls": {"title": "佛教词语的音译与意译", "paras": ["佛教词语多从梵语经汉语译入，分为两类：音译词，如“佛陀”（Buddha）、“菩萨”（Bodhisattva 的略称“菩提萨埵”）、“涅槃”（Nirvāṇa）；意译词，如“因果”“世界”“方便”“烦恼”。", "越南语通过汉语接受这些词，因此大多以汉越音出现：Phật、Bồ tát、Niết bàn、nhân quả。学习时可以利用汉越音快速记忆，但要注意意译词在汉语中往往已经世俗化，如“方便”“世界”。"], "rows": [["佛陀／佛", "音译", "Phật", "另有古借词 Bụt"], ["菩萨", "音译（略称）", "Bồ tát", "同形同义"], ["涅槃", "音译", "Niết bàn", "同形同义"], ["方便", "意译", "phương tiện", "越南语指“手段、工具”，形同义异"]]}, "egg": {"title": "Bụt 和 Phật：一个“佛”，两种读音", "teaser": "越南民间故事里帮助穷人的是 Bụt，寺庙里供奉的是 Phật。为什么同一个“佛”有两种读音？", "paras": ["越南语中的 Bụt 是很早就进入越南语的读音，一般认为它接近梵语 Buddha 的早期发音，可能早于汉越音系统形成之前传入；Phật 则是“佛”字的汉越音，随着汉文佛经的大量传播而通行。", "两种读音在今天有了分工：Phật 是宗教用语，用于寺庙、经典和正式场合；Bụt 则多出现在民间故事（如 Tấm Cám 中帮助阿甘的 ông Bụt）和俗语中，如“Bụt chùa nhà không thiêng”（自家寺庙的佛不灵，相当于“远来的和尚会念经”）。", "想一想：汉语中有没有类似“一个词、两种来源、两种分工”的现象？"]}, "tips": [{"w": "果报", "t": "越南语 quả báo 多用于“遭报应”的贬义，如 Quả báo nhãn tiền（现世报）；汉语“果报”是中性的佛教术语，指因果报应本身。"}, {"w": "不二法门", "t": "越南语 pháp môn bất nhị 基本只用于佛教语境；汉语“不二法门”早已泛化，常指“唯一的、最好的方法”，如“勤奋是成功的不二法门”。"}]}, {"si": 2, "ch": "第一章 宗教文化的词汇", "num": "第二节", "title": "道教——自然法则的追寻者", "words": [["道德", "dàodé", "đạo đức", "đạo đức", "B", "指行为准则和社会规范，也指《道德经》一书，是道家思想的重要经典。"], ["太极", "tàijí", "thái cực", "thái cực", "A", "代表宇宙万物变化的根本原理，通常以阴阳鱼图表示，象征着对立统一的关系。"], ["无为", "wúwéi", "vô vi", "vô vi", "A", "道家哲学中的一个重要概念，主张顺应自然规律，不做违背自然的事。"], ["自然", "zìrán", "tự nhiên", "tự nhiên", "A", "指自然而然的状态或过程，强调事物按照其本性发展，不加人为干预。"], ["清静", "qīngjìng", "thanh tĩnh", "thanh tĩnh", "A", "指心灵的纯净和平静，是道家追求的理想精神状态。"], ["虚无", "xūwú", "hư vô", "hư vô", "A", "道家用来指“道”的本体无所不在，但无形象可见；泛指空虚、什么都没有。"], ["玄学", "xuánxué", "huyền học", "huyền học", "A", "魏晋时期何晏、王弼等运用老庄思想糅合儒家经义而形成的哲学思潮，以《老子》《庄子》《周易》为“三玄”。"], ["阴阳", "yīnyáng", "âm dương", "âm dương", "A", "中国古代哲学的一对基本范畴，描述了自然界中相互对立又相互依存的两种力量。"], ["五行", "wǔxíng", "ngũ hành", "ngũ hành", "A", "即木、火、土、金、水五种元素及其相互关系，用来解释自然现象和社会变迁。"], ["八卦", "bāguà", "bát quái", "bát quái", "A", "由八个符号组成的系统，每个卦象代表不同的自然现象和人类活动。"], ["周易", "zhōuyì", "chu dịch", "Kinh Dịch, Chu Dịch", "A", "又称《易经》，是中国最古老的占卜书之一，也是儒家六经之一，包含了丰富的哲学思想。"], ["老子", "Lǎozǐ", "lão tử", "Lão Tử", "A", "传说中的道家创始人，著有《道德经》。"], ["庄子", "Zhuāngzǐ", "trang tử", "Trang Tử", "A", "战国时期的思想家，继承和发展了老子的思想，作品《庄子》充满哲理和寓言故事。"], ["道教", "Dàojiào", "đạo giáo", "Đạo giáo", "A", "起源于中国的宗教，以道家哲学为基础，重视个人修养和社会和谐。"], ["道观", "dàoguàn", "đạo quán", "đạo quán", "A", "道教信徒进行宗教活动的地方，类似于佛教的寺庙。"], ["道士", "dàoshi", "đạo sĩ", "đạo sĩ", "A", "男性道教徒，专门从事道教仪式和修炼的人。"], ["道姑", "dàogū", "đạo cô", "đạo cô", "A", "女性道教徒，同样负责宗教仪式和修炼。（亦称“女冠”，全真道称“坤道”）"], ["道童", "dàotóng", "đạo đồng", "đạo đồng", "A", "年轻的小道士或道姑，通常在道观中学习和服务。"], ["法器", "fǎqì", "pháp khí", "pháp khí", "A", "和尚、道士等举行宗教仪式时所用的器物，道教常见的有铃、剑、令牌、法印等。"], ["符箓", "fúlù", "phù lục", "bùa chú, phù lục", "C", "道教用来驱邪避灾的文字或图案，书写在纸上或布上。"], ["丹药", "dānyào", "đan dược", "đan dược, thuốc tiên", "A", "道教炼丹术中制作的药物，据说可以延年益寿甚至使人成仙。"], ["内丹", "nèidān", "nội đan", "nội đan", "A", "以人体为炉鼎、精气神为药物，通过内炼使之凝结成“丹”的修炼方法，与“外丹”相对。"], ["外丹", "wàidān", "ngoại đan", "ngoại đan", "A", "用炉鼎烧炼铅、汞等矿物，制成服食以求长生不死的金丹，与“内丹”相对。"], ["炼丹", "liàndān", "luyện đan", "luyện đan", "A", "指用矿物和其他材料通过特定程序炼制丹药的过程。"], ["修真", "xiūzhēn", "tu chân", "tu chân", "A", "指道教徒追求真理和个人完善的过程。"], ["修行", "xiūxíng", "tu hành", "tu hành", "A", "泛指任何宗教或哲学体系下的自我提升和心灵净化活动。"], ["养生", "yǎngshēng", "dưỡng sinh", "dưỡng sinh", "A", "指通过调节饮食、运动等方式保持身体健康和长寿。"], ["气功", "qìgōng", "khí công", "khí công", "A", "一种中国传统健身方法，结合呼吸控制、姿势调整和冥想。"], ["针灸", "zhēnjiǔ", "châm cứu", "châm cứu", "A", "针法和灸法的合称，属传统中医技术。（道教重养生，但针灸本身不属道教用语）"], ["神仙", "shénxiān", "thần tiên", "thần tiên", "A", "指已经达到了超凡脱俗境界的存在，具有长生不老和神通广大的特性。"], ["真人", "zhēnrén", "chân nhân", "chân nhân", "A", "指实现了真正自我的人，通常是指得道高人。"], ["神通", "shéntōng", "thần thông", "thần thông", "A", "指超自然的能力，如预知未来、飞行等。"], ["飞升", "fēishēng", "phi thăng", "phi thăng", "A", "指肉体离开地面升天成仙的现象。"], ["成仙", "chéngxiān", "thành tiên", "thành tiên", "A", "指通过修炼最终成为神仙。"], ["道法", "dàofǎ", "đạo pháp", "đạo pháp", "A", "道教的法则或规则，指导信徒如何生活和修行。"], ["道术", "dàoshù", "đạo thuật", "đạo thuật", "A", "指道教的各种技艺和方法，包括炼丹、占卜等。"], ["神咒", "shénzhòu", "thần chú", "thần chú", "A", "道教指具有神秘力量的咒语，据说可以召请神灵或驱除邪祟。"], ["道乐", "dàoyuè", "đạo nhạc", "nhạc lễ Đạo giáo", "D", "道教仪式中演奏的音乐，具有特殊的宗教意义。"], ["羽化", "yǔhuà", "vũ hóa", "vũ hóa", "A", "①道教称成仙（如生羽翼而飞升），也说“羽化登仙”。②婉辞，称道士去世。"], ["道经", "dàojīng", "đạo kinh", "đạo kinh, kinh sách Đạo giáo", "A", "道教的经典文献，记载了教义、历史和修行方法。"], ["道历", "dàolì", "đạo lịch", "lịch Đạo giáo", "D", "道教的纪年法，以黄帝纪元起算，比公元纪年多2697年。"], ["吕洞宾", "Lǚ Dòngbīn", "lữ động tân", "Lã Động Tân", "A", "名岩，字洞宾，号纯阳子，唐代道士，八仙之一；能诗，全真道奉为“北五祖”之一。"], ["张道陵", "Zhāng Dàolíng", "trương đạo lăng", "Trương Đạo Lăng", "A", "东汉道士，原名张陵，五斗米道（天师道）的创始人，后世尊为“张天师”；其道派后来发展为正一道。"], ["太上老君", "Tàishàng Lǎojūn", "thái thượng lão quân", "Thái Thượng Lão Quân", "A", "道教最高神祇之一，被认为是老子的化身。"], ["元始天尊", "Yuánshǐ Tiānzūn", "nguyên thủy thiên tôn", "Nguyên Thủy Thiên Tôn", "A", "道教“三清”之首，居玉清境，被奉为最高神。"], ["灵宝天尊", "Língbǎo Tiānzūn", "linh bảo thiên tôn", "Linh Bảo Thiên Tôn", "A", "道教“三清”之一，即上清灵宝天尊，亦称“太上道君”，居上清境。"], ["真武大帝", "Zhēnwǔ Dàdì", "chân võ đại đế", "Huyền Thiên Trấn Vũ (Chân Vũ Đại Đế)", "A", "道教的重要神祇，守护北方，象征水德。"], ["紫阳真人", "Zǐyáng Zhēnrén", "tử dương chân nhân", "Tử Dương chân nhân (Trương Bá Đoan)", "A", "北宋道士张伯端的号，著有《悟真篇》，被尊为道教内丹南宗祖师。"], ["道法自然", "dàofǎ-zìrán", "đạo pháp tự nhiên", "đạo pháp tự nhiên", "A", "道效法自然，强调顺应自然规律。"], ["无为而治", "wúwéi-érzhì", "vô vi nhi trị", "vô vi nhi trị", "A", "通过不干预、不强求的方式治理国家或事物。（语出《论语·卫灵公》；道家对应表述见《老子》第三章“为无为，则无不治”）"], ["清心寡欲", "qīngxīn-guǎyù", "thanh tâm quả dục", "thanh tâm quả dục", "A", "保持心灵清净，减少欲望。（化用《老子》第十九章“少私寡欲”）"], ["返璞归真", "fǎnpú-guīzhēn", "phản phác quy chân", "phản phác quy chân; trở về chất phác", "A", "返回到原始的纯真状态，远离世俗的纷扰。（语出《战国策·齐策》“归真反璞”）"], ["天人合一", "tiānrén-héyī", "thiên nhân hợp nhất", "thiên nhân hợp nhất", "A", "人与自然和谐统一的思想。（宋代张载明确提出，儒道两家皆有此思想）"], ["上善若水", "shàngshàn-ruòshuǐ", "thượng thiện nhược thủy", "thượng thiện nhược thủy", "A", "最高的善行就像水一样，滋润万物而不争。"], ["以柔克刚", "yǐróu-kègāng", "dĩ nhu khắc cương", "lấy nhu thắng cương; mềm nắn rắn buông", "C", "用柔软的方法克服强硬的力量。（化用《老子》“柔之胜刚，弱之胜强”）"], ["大象无形", "dàxiàng-wúxíng", "đại tượng vô hình", "đại tượng vô hình", "A", "最大的形象是没有具体形状的，形容伟大事物的不可捉摸。"], ["知足常乐", "zhīzú-chánglè", "tri túc thường lạc", "tri túc thường lạc; biết đủ là vui", "A", "懂得满足的人常常感到快乐。（化用《老子》第四十六章“知足之足，常足矣”）"], ["逍遥自在", "xiāoyáo-zìzài", "tiêu dao tự tại", "tiêu dao tự tại; thong dong", "A", "自由自在，不受拘束。（“逍遥”出自《庄子·逍遥游》）"], ["齐同慈爱", "qítóng-cí'ài", "tề đồng từ ái", "đối xử bình đẳng, thương yêu muôn loài", "D", "对所有生物都平等看待，充满慈爱。（道教教义用语，非固定成语）"], ["返老还童", "fǎnlǎo-huántóng", "phản lão hoàn đồng", "cải lão hoàn đồng", "C", "形容人恢复青春活力，精神焕发。（原指道教传说中使老年返回童年的却老术）"], ["修身养性", "xiūshēn-yǎngxìng", "tu thân dưỡng tính", "tu thân dưỡng tính", "A", "修养身心，提升个人品德和精神境界。"], ["顺其自然", "shùnqí-zìrán", "thuận kỳ tự nhiên", "thuận theo tự nhiên", "C", "按照事物发展的自然规律行事，不强行改变。"], ["因势利导", "yīnshì-lìdǎo", "nhân thế lợi đạo", "thuận thế mà dẫn dắt", "C", "根据形势的发展趋势加以引导。"], ["随遇而安", "suíyù'ér'ān", "tùy ngộ nhi an", "ở đâu yên đó; an phận tùy cảnh", "C", "能够适应任何环境，安心生活。"], ["抱一守中", "bàoyī-shǒuzhōng", "bão nhất thủ trung", "bão nhất thủ trung", "A", "保持内心的专注和平衡。（合《老子》“抱一”与“守中”而成，非固定成语）"], ["不欺暗室", "bùqī-ànshì", "bất khi ám thất", "không làm điều khuất tất dù ở nơi khuất", "D", "即使在无人看见的地方也不做坏事。"], ["出尘不染", "chūchén-bùrǎn", "xuất trần bất nhiễm", "gần bùn mà chẳng hôi tanh mùi bùn", "C", "虽身处尘世，但不被世俗污染。（规范说法多作“一尘不染”或“出淤泥而不染”）"], ["宠辱不惊", "chǒngrǔ-bùjīng", "sủng nhục bất kinh", "vinh nhục không màng", "C", "面对荣辱都能保持平静的心态。（《老子》第十三章原文为“宠辱若惊”，“宠辱不惊”为后世说法）"], ["超凡脱俗", "chāofán-tuōsú", "siêu phàm thoát tục", "siêu phàm thoát tục", "A", "超越平凡，脱离世俗的束缚。"], ["明镜止水", "míngjìng-zhǐshuǐ", "minh kính chỉ thủy", "lòng sáng như gương, lặng như nước", "C", "像明镜和静水一样清澈透明，形容人心境纯净。（源自《庄子·德充符》“人莫鉴于流水而鉴于止水”）"], ["返本归元", "fǎnběn-guīyuán", "phản bản quy nguyên", "trở về cội nguồn", "C", "回归事物的根本和源头。"], ["与世无争", "yǔshì-wúzhēng", "dữ thế vô tranh", "không tranh giành với đời", "C", "不与世人争夺，过着平静的生活。"], ["朝三暮四", "zhāosān-mùsì", "triêu tam mộ tứ", "sớm nắng chiều mưa; tráo trở (triêu tam mộ tứ)", "B", "原指用诈术欺骗人，后比喻反复无常。（语出《庄子·齐物论》）"], ["黄粱一梦", "huángliáng-yīmèng", "hoàng lương nhất mộng", "giấc mộng hoàng lương; giấc kê vàng", "A", "唐代沈既济《枕中记》载：卢生在邯郸客店遇道士吕翁，借其青瓷枕入梦，享尽荣华富贵，醒来时店主蒸的黄粱饭还没有熟。比喻虚幻的梦想破灭，荣华富贵转眼成空。"], ["腾云驾雾", "téngyún-jiàwù", "đằng vân giá vụ", "cưỡi mây đạp gió", "C", "原指神话传说中神仙乘云雾飞行的法术，后形容奔驰迅速，或形容头脑昏沉、飘飘然的感觉。"], ["呼风唤雨", "hūfēng-huànyǔ", "hô phong hoán vũ", "hô phong hoán vũ", "A", "原指神仙道士能召唤风雨的法力，现比喻能够支配自然或左右某种局势（有时含贬义）。"], ["神通广大", "shéntōng-guǎngdà", "thần thông quảng đại", "thần thông quảng đại", "A", "神通原为佛教、道教用语，指无所不能的法力。形容本领高超，办法很多。"], ["道家炼丹——点石成金", "dào jiā liàn dān — diǎn shí chéng jīn", "đạo gia luyện đan – điểm thạch thành kim", "luyện đan – hóa đá thành vàng", "D", "形容道士通过修炼能够化腐朽为神奇，比喻技艺高超。"], ["老君炉里炼仙丹——十拿九稳", "lǎo jūn lú lǐ liàn xiān dān — shí ná jiǔ wěn", "lão quân lô lý luyện tiên đan – thập nã cửu ổn", "lò tiên luyện đan – chắc chín phần mười", "D", "形容事情非常有把握，几乎不会失败。"], ["八仙过海——各显神通", "bā xiān guò hǎi — gè xiǎn shén tōng", "bát tiên quá hải – các hiển thần thông", "Bát Tiên qua biển – mỗi người một tài", "C", "比喻每个人都有自己的本领，在适当的机会下都能发挥出来。"], ["太上老君八卦炉——热气腾腾", "Tàishàng Lǎojūn bā guà lú — rè qì téng téng", "thái thượng lão quân bát quái lô – nhiệt khí đằng đằng", "lò bát quái của Thái Thượng Lão Quân – nóng hừng hực", "D", "形容场面热闹非凡，气氛热烈。"], ["老子出关——一去不返", "Lǎozǐ chū guān — yī qù bù fǎn", "lão tử xuất quan – nhất khứ bất phản", "Lão Tử xuất quan – một đi không trở lại", "D", "比喻人一旦 离开某个地方或环境，就不再回来。"], ["黄大仙的鸡毛——能飞", "huáng dà xiān de jī máo — néngfēi", "hoàng đại tiên đích kê mao – năng phi", "lông gà Hoàng Đại Tiên – biết bay", "D", "形容事物虽小但有特殊功能，比喻不起眼的东西也可能有大用处。"], ["王母娘娘的蟠桃——千年一熟", "wáng mǔ niáng niáng de pán táo — qiān nián yī shú", "vương mẫu nương nương đích bàn đào – thiên niên nhất thục", "bàn đào Vương Mẫu – nghìn năm mới chín", "D", "形容事物难得一见或很难得到。"], ["狗咬吕洞宾——不识好人心", "gǒu yǎo Lǚ Dòngbīn — bù shí hǎo rén xīn", "cẩu giảo lữ động tân – bất thức hảo nhân tâm", "chó cắn Lã Động Tân – không biết lòng tốt của người", "D", "比喻不识好歹，把别人的好心当成恶意。"], ["张果老倒骑驴——往后看", "zhāng guǒ lǎo dào qí lǘ — wǎnghòukàn", "trương quả lão đáo kỵ lư – vãng hậu khán", "Trương Quả Lão cưỡi lừa ngược – nhìn về phía sau", "D", "比喻做事要回顾过去的经验教训。"], ["铁拐李的葫芦——不知卖的什么药", "tiě guǎi lǐ de hú lu — bù zhī mài de shén me yào", "thiết quải lý đích hồ lô – bất tri mại đích thập ma dược", "hồ lô Thiết Quải Lý – chẳng biết bán thuốc gì", "D", "比喻不知道对方心里打的什么主意，或暗中搞什么名堂。（铁拐李常背药葫芦行医）"], ["韩湘子吹笛——不同凡响", "Hán Xiāngzǐ chuī dí — bù tóng fán xiǎng", "hàn tương tử xuy địch – bất đồng phàm hưởng", "Hàn Tương Tử thổi sáo – khác hẳn người thường", "D", "韩湘子是传说中的八仙之一，以善吹笛著称。比喻非同一般，水平高超。"], ["钟馗捉鬼——手到擒来", "zhōng kuí zhuō guǐ — shǒu dào qín lái", "chung quỳ tróc quỷ – thủ đáo cầm lai", "Chung Quỳ bắt quỷ – dễ như trở bàn tay", "C", "形容办事效率高，一下子就成功了。"], ["太上老君叫蛇咬——法尽了", "Tàishàng Lǎojūn jiào shé yǎo — fǎ jìn le", "thái thượng lão quân khiếu xà giảo – pháp tận liễu", "Thái Thượng Lão Quân bị rắn cắn – hết phép", "D", "太上老君被蛇咬，说明法力已经用尽；“法”借指办法，比喻办法使尽，无可奈何。"], ["太上老君的扇子——一吹一个准", "Tàishàng Lǎojūn de shàn zi — yī chuī yī gè zhǔn", "thái thượng lão quân đích phiến tử – nhất xuy nhất cá chuẩn", "quạt của Thái Thượng Lão Quân – thổi đâu trúng đó", "D", "形容说话或做事每次都准确无误。"], ["张天师的咒符——灵验", "zhāng tiān shī de zhòu fú — língyàn", "trương thiên sư đích chú phù – linh nghiệm", "bùa chú Trương Thiên Sư – linh nghiệm", "D", "形容某种方法或手段非常有效，每次都能成功。"], ["和尚训道士——管得宽", "hé shang xùn dào shi — guǎn de kuān", "hòa thượng huấn đạo sĩ – quản đắc khoan", "sư dạy đạo sĩ – lo chuyện bao đồng", "C", "和尚是佛教徒，道士是道教徒，两者各不相干。比喻管了不该管的事，多管闲事。"], ["一人得道，鸡犬升天", "yī rén dé dào, jī quǎn shēng tiān", "nhất nhân đắc đạo, kê khuyển thăng thiên", "một người làm quan, cả họ được nhờ", "C", "传说汉代淮南王刘安修炼成仙，全家升天，连鸡狗吃了剩下的仙药也都升了天。比喻一个人得势，和他有关系的人也跟着沾光（多含贬义）。（典出汉王充《论衡·道虚》）"], ["天机不可泄露", "tiān jī bù kě xiè lòu", "thiên cơ bất khả tiết lộ", "thiên cơ bất khả lộ", "A", "天机原指上天的机密、玄机，方士、道士认为不可向人透露；后泛指机密之事不能事先泄露。"], ["天下尽多意外事，天师亦有鬼迷时", "tiān xià jǐn duō yì wài shì, tiān shī yì yǒu guǐ mí shí", "thiên hạ tận đa ý ngoại sự, thiên sư diệc hữu quỷ mê thời", "khôn ba năm dại một giờ", "C", "天师指东汉张道陵，道教奉为创教祖师，传说能捉鬼。天下出人意料的事很多，连捉鬼的张天师也有被鬼迷住的时候；指要提防意想不到的事。"], ["三个不开口，神仙难下手", "sān gè bù kāi kǒu, shén xiān nán xià shǒu", "tam cá bất khai khẩu, thần tiên nan hạ thủ", "ba người không mở miệng, thần tiên cũng bó tay", "D", "对拿定主意不肯开口的人，即使神仙也没有办法。"], ["识破人情便是仙", "shí pò rén qíng biàn shì xiān", "thức phá nhân tình tiện thị tiên", "hiểu thấu lòng người là bậc thần tiên", "D", "能洞察人心世情的，就是像神仙那样了不起的人。"], ["狗肉滚三滚，神仙站不稳", "gǒu ròu gǔn sān gǔn, shén xiān zhàn bù wěn", "cẩu nhục cổn tam cổn, thần tiên trạm bất ổn", "thịt chó sôi ba dạo, thần tiên cũng xiêu lòng", "D", "狗肉煮开几滚，香得连神仙也站不稳。形容美食的诱惑力极大，也比喻吃喝能使人放弃原则。"]], "obj": ["掌握道教基本概念与神祇名称", "理解道教成语和歇后语的文化内涵", "能说出常用道教词语的越南语对应说法"], "cls": {"title": "歇后语的结构与翻译", "paras": ["歇后语由前后两部分构成：前半部分像谜面，后半部分像谜底，中间用破折号连接。可分为喻意型（狗咬吕洞宾——不识好人心）和谐音型（和尚打伞——无法（发）无天）两类。", "越南语没有歇后语这一形式。翻译时一般采用“直译前半＋意译后半”，或直接找越南语中意义相近的俗语，如“八仙过海——各显神通”可对应 mỗi người một vẻ。谐音型歇后语的双关意义很难保留，应加注说明。"], "rows": null}, "egg": {"title": "八仙是谁？", "teaser": "“八仙过海，各显神通”，你能说出八位神仙的名字和越南语读法吗？", "paras": ["八仙通常指：汉钟离（Hán Chung Ly）、张果老（Trương Quả Lão）、韩湘子（Hàn Tương Tử）、铁拐李（Thiết Quải Lý）、吕洞宾（Lã Động Tân）、何仙姑（Hà Tiên Cô）、蓝采和（Lam Thái Hòa）、曹国舅（Tào Quốc Cữu）。", "每位神仙都有标志性的法器：铁拐李的葫芦、韩湘子的笛子、何仙姑的荷花、吕洞宾的宝剑、张果老倒骑的毛驴……这些法器也成了许多歇后语的来源，如“张果老倒骑驴——往后看”“韩湘子吹笛——不同凡响”。", "在越南，八仙形象常见于年画、木雕、瓷器和寺观装饰，越南语称 Bát tiên。"]}, "tips": [{"w": "道德", "t": "“道德”本是道家概念（《道德经》），现代汉语指社会伦理规范。越南语 đạo đức 还可直接作形容词（anh ấy rất đạo đức），汉语要说“他很有道德”或“他品德很好”。"}, {"w": "朝三暮四", "t": "越南语 triêu tam mộ tứ 多指“反复无常、用情不专”。汉语原义出自《庄子·齐物论》“狙公赋芧”，指用诈术欺骗人，后来才引申为反复无常。"}]}, {"si": 3, "ch": "第一章 宗教文化的词汇", "num": "第三节", "title": "儒教——伦理道德的基石", "words": [["仁爱", "rén'ài", "nhân ái", "nhân ái", "A", "指对他人的关怀与爱护，是儒家思想的核心价值观之一。"], ["礼仪", "lǐyí", "lễ nghi", "lễ nghi", "A", "指社会交往中的行为规范和仪式，用以维护秩序和社会和谐。"], ["孝道", "xiàodào", "hiếu đạo", "đạo hiếu", "A", "强调子女对父母的尊敬和奉养，被视为家庭伦理的基础。"], ["忠义", "zhōngyì", "trung nghĩa", "trung nghĩa", "A", "忠诚和正义，指对国家、君主或朋友保持忠诚，并坚持正直的行为。"], ["诚信", "chéngxìn", "thành tín", "thành tín, chữ tín", "A", "诚实守信，是个人品德和社会信任的重要组成部分。"], ["君子", "jūnzǐ", "quân tử", "quân tử", "A", "指有德行的人，具有高尚品质和社会责任感的理想人格。"], ["小人", "xiǎorén", "tiểu nhân", "tiểu nhân", "B", "与“君子”相对，指缺乏道德修养、自私自利的人。"], ["修身", "xiūshēn", "tu thân", "tu thân", "A", "指通过自我反省和实践来提高个人品德和能力。"], ["齐家", "qíjiā", "tề gia", "tề gia", "A", "管理好家庭事务，使家庭成员和睦相处，是治国平天下的基础。"], ["治国", "zhìguó", "trị quốc", "trị quốc", "A", "治理国家，强调统治者应以民为本，实行仁政。"], ["平天下", "píngtiānxià", "bình thiên hạ", "bình thiên hạ", "A", "使天下太平，是《大学》“八目”的最高一环，体现儒家的政治理想。"], ["德行", "déxíng", "đức hạnh", "đức hạnh", "B", "指良好的品德和行为，是个人和社会发展的根本。"], ["教化", "jiàohuà", "giáo hóa", "giáo hóa", "A", "通过教育和引导来提升民众的道德水平和社会风气。"], ["知行合一", "zhīxíng-héyī", "tri hành hợp nhất", "tri hành hợp nhất", "A", "强调知识和行动的一致性，认为理论必须付诸实践才能真正有效。"], ["天命", "tiānmìng", "thiên mệnh", "thiên mệnh", "A", "指上天赋予的命运或使命，常用来形容历史趋势和个人责任。"], ["中庸", "zhōngyōng", "trung dung", "trung dung", "A", "儒家的一种主张，待人接物采取不偏不倚、调和折中的态度；也是《礼记》篇名，后为“四书”之一。"], ["礼乐", "lǐyuè", "lễ nhạc", "lễ nhạc", "A", "指礼仪和音乐，在古代中国不仅是艺术形式，也是社会治理工具。"], ["君臣父子", "jūnchén-fùzǐ", "quân thần phụ tử", "quân thần phụ tử", "A", "描述了封建社会中最基本的人际关系模式及其相应的权利义务。"], ["仁政", "rénzhèng", "nhân chính", "nhân chính", "A", "以仁爱之心治理国家，关注民生疾苦，实施温和政策。"], ["和谐", "héxié", "hòa hài", "hài hòa", "C", "指人际关系及社会各方面的协调一致，是理想的社会治理状态。"], ["心安", "xīn'ān", "tâm an", "tâm an, yên lòng", "A", "内心平静无愧，是道德修养达到一定境界的表现。"], ["守信", "shǒuxìn", "thủ tín", "giữ chữ tín", "C", "遵守承诺，言出必行，是建立信任关系的关键。"], ["谦让", "qiānràng", "khiêm nhượng", "khiêm nhường", "A", "谦虚礼让，表现出对他人的尊重和宽容。"], ["五常", "wǔcháng", "ngũ thường", "ngũ thường", "A", "即仁、义、礼、智、信，是儒家提倡的基本道德准则。"], ["四德", "sìdé", "tứ đức", "tứ đức (công, dung, ngôn, hạnh)", "A", "封建礼教要求妇女具备的四种德行：妇德、妇言、妇容、妇功（语出《周礼》）。"], ["八目", "bāmù", "bát mục", "bát mục", "A", "出自《大学》，包括格物、致知、诚意、正心、修身、齐家、治国、平天下八个步骤。"], ["三纲", "sāngāng", "tam cương", "tam cương", "A", "指君为臣纲、父为子纲、夫为妻纲，规定了封建社会中主要的人际关系原则。"], ["五伦", "wǔlún", "ngũ luân", "ngũ luân", "A", "指君臣、父子、兄弟、夫妇、朋友之间的伦理关系。"], ["德治", "dézhì", "đức trị", "đức trị", "A", "通过道德教育和榜样力量来治理国家，强调统治者的个人修养和道德领导力。"], ["法治", "fǎzhì", "pháp trị", "pháp trị", "A", "依靠法律制度来维持社会秩序，确保公平正义。"], ["正名", "zhèngmíng", "chính danh", "chính danh", "A", "孔子提出的思想，主张恢复正确的名称和地位，以纠正混乱的社会秩序。"], ["明德", "míngdé", "minh đức", "minh đức", "A", "发扬光明的品德，是个人修养和社会进步的目标。"], ["新民", "xīnmín", "tân dân", "tân dân", "A", "《大学》“三纲领”之一，指使民众去旧图新、革新自我（朱熹释“亲民”为“新民”）。"], ["至善", "zhìshàn", "chí thiện", "chí thiện", "A", "最高的善，是个人道德追求的终极目标。"], ["诚意", "chéngyì", "thành ý", "thành ý", "A", "使意念真诚、不自欺，是《大学》“八目”之一：“欲正其心者，先诚其意。”"], ["正心", "zhèngxīn", "chính tâm", "chính tâm", "A", "端正内心，不为情绪偏私所左右，是《大学》“八目”之一。"], ["修身齐家", "xiūshēn-qíjiā", "tu thân tề gia", "tu thân tề gia", "A", "综合了“修身”和“齐家”的概念，指个人修养与家庭管理相结合。"], ["治国安邦", "zhìguó-ānbāng", "trị quốc an bang", "trị quốc an bang", "A", "治理国家并使其安定繁荣。"], ["仁者爱人", "rénzhě-àirén", "nhân giả ái nhân", "nhân giả ái nhân", "A", "仁慈的人会关爱他人，体现了儒家的仁爱精神。"], ["己所不欲，勿施于人", "jǐ suǒ bù yù, wù shī yú rén", "kỷ sở bất dục, vật thi ư nhân", "kỷ sở bất dục, vật thi ư nhân; điều mình không muốn chớ làm cho người", "A", "不要将自己不愿意接受的事情强加给别人，这是儒家黄金法则。"], ["见贤思齐", "jiànxián-sīqí", "kiến hiền tư tề", "kiến hiền tư tề; thấy người hiền thì noi theo", "A", "见到有德行的人就想着向他们看齐，鼓励人们不断改进自己。"], ["仁至义尽", "rénzhì-yìjìn", "nhân chí nghĩa tận", "tận tình tận nghĩa", "C", "对人做到最大的仁爱和道义。"], ["礼贤下士", "lǐxián-xiàshì", "lễ hiền hạ sĩ", "chiêu hiền đãi sĩ", "C", "尊重并谦逊对待有德行的人。"], ["孝悌忠信", "xiàotì-zhōngxìn", "hiếu đễ trung tín", "hiếu đễ trung tín", "A", "强调孝顺父母、尊敬兄长、忠诚和守信。"], ["君子不器", "jūnzǐ-bùqì", "quân tử bất khí", "quân tử bất khí", "A", "君子不应局限于某一技能或职业。"], ["朝闻道，夕死可矣", "zhāowéndào, xī sǐ kě yǐ", "triêu văn đạo, tịch tử khả hĩ", "sớm nghe đạo, chiều chết cũng cam", "C", "早上听到真理，即使晚上死去也无憾。"], ["诲人不倦", "huìrén-bùjuàn", "hối nhân bất quyện", "dạy người không biết mỏi", "C", "教导别人而不感到厌倦。"], ["温故知新", "wēngù-zhīxīn", "ôn cố tri tân", "ôn cố tri tân", "A", "复习旧知识从而获得新的理解。"], ["一言既出，驷马难追", "yī yán jì chū, sì mǎ nán zhuī", "nhất ngôn ký xuất, tứ mã nan truy", "một lời nói ra, bốn ngựa khó theo; lời nói như đinh đóng cột", "C", "说过的话就要负责，不能反悔。"], ["有教无类", "yǒujiào-wúlèi", "hữu giáo vô loại", "hữu giáo vô loại", "A", "教育不应分贵贱，人人都有受教育的权利。"], ["因材施教", "yīncái-shījiào", "nhân tài thi giáo", "dạy học theo năng lực (nhân tài thi giáo)", "A", "根据学生的才能进行教学。"], ["文质彬彬", "wénzhì-bīnbīn", "văn chất bân bân", "văn chất bân bân; nho nhã lịch sự", "A", "形容人文雅而有礼貌。"], ["不耻下问", "bùchǐ-xiàwèn", "bất sỉ hạ vấn", "không ngại học hỏi người dưới", "C", "不以向地位比自己低、学问比自己差的人请教为耻。"], ["己欲立而立人", "jǐ yù lì ér lì rén", "kỷ dục lập nhi lập nhân", "mình muốn lập thân thì giúp người lập thân", "C", "自己想要成功也要帮助他人成功。"], ["己欲达而达人", "jǐ yù dá ér dá rén", "kỷ dục đạt nhi đạt nhân", "mình muốn thành đạt thì giúp người thành đạt", "C", "自己想要通达也要帮助他人通达。"], ["过犹不及", "guòyóubùjí", "quá do bất cập", "quá do bất cập; thái quá cũng như bất cập", "A", "过头和不够一样不好。"], ["中庸之道", "zhōngyōng-zhīdào", "trung dung chi đạo", "đạo trung dung", "A", "中正平和的态度和行为方式。"], ["举一反三", "jǔyī-fǎnsān", "cử nhất phản tam", "học một biết mười", "C", "从一件事情类推而了解其他类似的事情。"], ["敏而好学", "mǐn'ér-hàoxué", "mẫn nhi hiếu học", "thông minh mà ham học", "C", "聪明而且喜好学习。"], ["朽木不可雕也", "xiǔ mù bù kě diāo yě", "hủ mộc bất khả điêu dã", "gỗ mục không thể chạm khắc", "C", "比喻人不可造就或事物无可救药。"], ["任重道远", "rènzhòng-dàoyuǎn", "nhiệm trọng đạo viễn", "gánh nặng đường xa", "C", "责任重大，路途遥远。"], ["死而后已", "sǐ'ér-hòuyǐ", "tử nhi hậu dĩ", "cúc cung tận tụy đến chết mới thôi", "C", "至死方休，形容奋斗到底的精神。"], ["以德报怨", "yǐdé-bàoyuàn", "dĩ đức báo oán", "lấy ân báo oán", "C", "用恩惠回报别人的仇怨。（语见《论语·宪问》，孔子主张“以直报怨，以德报德”，并不赞成以德报怨）"], ["克己复礼", "kèjǐ-fùlǐ", "khắc kỷ phục lễ", "khắc kỷ phục lễ", "A", "克制自己的欲望，恢复礼仪。"], ["见不贤而内自省", "jiàn bù xián ér nèi zì xǐng", "kiến bất hiền nhi nội tự tỉnh", "thấy người không hiền thì tự xét mình", "C", "见到不好的人或事应该反省自己。"], ["闻过则喜", "wénguòzéxǐ", "văn quá tắc hỷ", "nghe lỗi thì mừng", "C", "听到批评意见反而高兴。"], ["临事而惧，好谋而成", "lín shì ér jù, hào móu ér chéng", "lâm sự nhi cụ, hiếu mưu nhi thành", "gặp việc thì thận trọng, khéo mưu thì thành", "C", "面对事情时谨慎小心，善于谋划就能成功。"], ["志士仁人", "zhìshì-rénrén", "chí sĩ nhân nhân", "chí sĩ nhân nhân", "A", "志向远大的人士和有仁德的人。"], ["知其不可而为之", "zhī qí bù kě ér wéi zhī", "tri kỳ bất khả nhi vi chi", "biết không thể mà vẫn làm", "C", "明知不可能成功，但仍然尽力去做。"], ["得道者多助", "dé dào zhě duō zhù", "đắc đạo giả đa trợ", "đắc đạo đa trợ (người chính nghĩa được nhiều người giúp)", "A", "遵循正道的人会得到很多人的帮助和支持。（语出《孟子·公孙丑下》，属儒家语，此处“道”指正义）"], ["道不同，不相为谋", "dàobùtóng, bù xiāng wéi móu", "đạo bất đồng, bất tương vi mưu", "khác đạo không chung đường; bất đồng chí hướng", "C", "志向不同的人很难在一起共事。（语出《论语·卫灵公》，属儒家语）"], ["安贫乐道", "ānpín-lèdào", "an bần lạc đạo", "an bần lạc đạo", "A", "安于贫困的生活，专心追求道德。（儒家语，典出颜回安贫乐道的故事）"], ["厚德载物", "hòudé-zàiwù", "hậu đức tải vật", "hậu đức tải vật", "A", "拥有深厚的品德可以承载一切。（语出《周易·坤卦·象传》）"], ["宁静致远", "níngjìng-zhìyuǎn", "ninh tĩnh trí viễn", "tĩnh lặng để đi xa", "C", "心境平和才能走得更远。（语出诸葛亮《诫子书》）"], ["独善其身", "dúshàn-qíshēn", "độc thiện kỳ thân", "độc thiện kỳ thân", "A", "只注重自身的修养，不关心外界事务。（语出《孟子·尽心上》，属儒家语）"], ["无欲则刚", "wúyù-zégāng", "vô dục tắc cương", "vô dục tắc cương", "A", "没有欲望的人更加坚强，不易被外界影响。（化用《论语·公冶长》“枨也欲，焉得刚”，属儒家语）"], ["人无远虑，必有近忧", "rén wú yuǎn lǜ, bì yǒu jìn yōu", "nhân vô viễn lự, tất hữu cận ưu", "người không lo xa ắt có buồn gần", "C", "人如果没有长远的考虑，必然会遇到眼前的忧患。（语出《论语·卫灵公》）"], ["君子爱财，取之有道", "jūn zǐ ài cái, qǔ zhī yǒu dào", "quân tử ái tài, thủ chi hữu đạo", "quân tử ái tài, thủ chi hữu đạo; làm giàu chính đáng", "C", "君子也喜欢财富，但会通过正当的方法获取。（源自《增广贤文》，非《论语》原文）"], ["三人行，必有我师", "sānrénxíng, bì yǒu wǒ shī", "tam nhân hành, tất hữu ngã sư", "ba người cùng đi ắt có thầy ta", "C", "三个人同行，其中必定有人可以作为我的老师。（语出《论语·述而》“三人行，必有我师焉”）"], ["德不孤，必有邻", "débùgū, bìyǒulín", "đức bất cô, tất hữu lân", "đức bất cô, tất hữu lân", "A", "有道德的人不会孤单，一定会有志同道合者。（语出《论语·里仁》）"], ["言必信，行必果", "yánbìxìn, xíngbìguǒ", "ngôn tất tín, hành tất quả", "nói được làm được", "C", "说话一定守信，做事一定坚决实行（果：坚决）。（语出《论语·子路》，孔子原用以评价“小人”，后转为褒义）"], ["见贤思齐焉，见不贤而内自省也", "jiàn xián sī qí yān, jiàn bù xián ér nèi zì xǐng yě", "kiến hiền tư tề yên, kiến bất hiền nhi nội tự tỉnh dã", "thấy người hiền thì noi theo, thấy người không hiền thì tự xét mình", "C", "看到贤能的人就想着向他看齐；见到不贤的人就反省自己是否有类似的缺点。（语出《论语·里仁》）"], ["仁者爱人，有礼者敬人", "rén zhě ài rén, yǒu lǐ zhě jìng rén", "nhân giả ái nhân, hữu lễ giả kính nhân", "người nhân thương người, người có lễ kính người", "C", "仁慈的人热爱他人，有礼貌的人尊敬他人。（语出《孟子·离娄下》）"], ["学而不厌，诲人不倦", "xué ér bù yàn, huì rén bù juàn", "học nhi bất yếm, hối nhân bất quyện", "học không biết chán, dạy không biết mỏi", "C", "学习不会感到厌烦，教导别人也不会感到疲倦。（语出《论语·述而》）"], ["礼之用，和为贵", "lǐzhīyòng, héwéiguì", "lễ chi dụng, hòa vi qúy", "dĩ hòa vi quý", "C", "礼仪的运用，以和谐最为重要。（语出《论语·学而》，为孔子弟子有子之言）"], ["不患寡而患不均", "bù huàn guǎ ér huàn bù jūn", "bất hoạn quả nhi hoạn bất quân", "không lo thiếu mà lo không đều", "C", "不是担心东西少，而是担心分配不均匀。（语出《论语·季氏》）"], ["三思而行", "sānsī-érxíng", "tam tư nhi hành", "uốn lưỡi bảy lần trước khi nói; nghĩ kỹ rồi hãy làm", "C", "做事之前要仔细思考三次再行动，强调慎重决策的重要性。（语出《论语·公冶长》，后泛用于劝诫）"], ["静坐常思己过，闲谈莫论人非", "jìng zuò cháng sī jǐ guò, xián tán mò lùn rén fēi", "tĩnh tọa thường tư kỷ quá, nhàn đàm mạc luận nhân phi", "ngồi yên nghĩ lỗi mình, chuyện phiếm chớ bàn lỗi người", "D", "安静时多反省自己的过错，闲聊时不批评他人的不是。（源自《增广贤文》）"], ["人生如逆水行舟，不进则退", "rén shēng rú nì shuǐ xíng zhōu, bù jìn zé tuì", "nhân sinh như nghịch thủy hành chu, bất tiến tắc thoái", "học như thuyền đi ngược nước, không tiến ắt lùi", "C", "人生就像在逆水中划船，不前进就会后退，强调不断进步的重要性。（源自《增广贤文》“学如逆水行舟，不进则退”）"], ["百善孝为先", "bǎi shàn xiào wéi xiān", "bách thiện hiếu vi tiên", "trăm nết lấy hiếu làm đầu", "C", "在各种美德之中，孝敬父母是第一位的。体现了儒家以孝为本的伦理观念。（俗语）"], ["万般皆下品，唯有读书高", "wàn bān jiē xià pǐn, wéi yǒu dú shū gāo", "vạn ban giai hạ phẩm, duy hữu độc thư cao", "nhất sĩ nhì nông", "C", "旧时认为其他行业都是低贱的，只有读书做官才是最高尚的（语出宋代汪洙《神童诗》）。反映了科举时代重视读书的观念。"], ["君子不记小人过", "jūn zǐ bù jì xiǎo rén guò", "quân tử bất ký tiểu nhân quá", "người quân tử không chấp kẻ tiểu nhân", "C", "品德高尚的人不计较品行卑劣之人的过错。形容待人宽宏大量。"], ["观棋不语真君子，把酒多言是小人", "guān qí bù yǔ zhēn jūn zǐ, bǎ jiǔ duō yán shì xiǎo rén", "quan kỳ bất ngữ chân quân tử, bả tửu đa ngôn thị tiểu nhân", "xem cờ không nói mới là quân tử", "D", "看别人下棋时不随便插嘴，才是真正有修养的君子；喝了酒就话多的是小人。"], ["读书百遍，其义自见", "dú shū bǎi biàn, qí yì zì xiàn", "độc thư bách biến, kỳ nghĩa tự kiến", "đọc đi đọc lại ắt tự hiểu; văn ôn võ luyện", "C", "见同“现”。书读得熟了，它的意义自然就会显现出来。（语出《三国志·魏书·王肃传》裴松之注引《魏略》）"], ["秀才遇见兵，有理说不清", "xiù cái yù jiàn bīng, yǒu lǐ shuō bù qīng", "tú tài ngộ kiến binh, hữu lý thuyết bất thanh", "lý lẽ gặp kẻ cục cằn cũng đành chịu", "D", "秀才指读书人。比喻讲道理的人遇到不讲理的人，即使有理也说不清楚。"], ["孔夫子搬家——净是书（输）", "Kǒng fūzǐ bān jiā — jìng shì shū", "khổng phu tử ban gia – tịnh thị thư", "Khổng Tử dọn nhà – toàn là sách (thua)", "D", "孔夫子是对孔子的尊称，家中多书；“书”谐音“输”。比喻总是失败，每次都输。"]], "obj": ["掌握儒家核心概念（五常、三纲、八目等）", "理解出自儒家经典的成语和谚语", "能分析儒家词语在越南语中的保留与变化"], "cls": {"title": "儒家语录如何变成成语和谚语", "paras": ["许多成语、谚语直接来自儒家经典：“温故知新”出自《论语·为政》“温故而知新”，“三人行，必有我师”出自《论语·述而》。从语录到成语，往往经过“截取、压缩、固定”三个步骤。", "越南语接受这些语录有两种方式：一是保留汉越音整句引用，如 Tam nhân đồng hành, tất hữu ngã sư；二是用越南语改写，如“三人行，必有我师”在意义上接近 Học thầy không tày học bạn。前者多见于书面语，后者多见于口语。"], "rows": null}, "egg": {"title": "河内文庙的82块进士碑", "teaser": "河内文庙—国子监里立着82块石碑，上面刻着什么？", "paras": ["河内文庙建于1070年（李朝），1076年在旁边设立国子监（Quốc Tử Giám），被视为越南最早的大学。", "文庙内现存82块进士题名碑，记录了1442年至1779年间黎朝、莫朝科举考试中进士的姓名、籍贯。石碑立在石龟背上，2011年被联合国教科文组织列入“世界记忆名录”。", "每逢考试季，越南学生会到文庙祈求考试顺利，这与中国学生拜孔子、拜文昌的习俗相似，体现了两国共同的“尊师重道”传统。"]}, "tips": [{"w": "小人", "t": "汉语“小人”与“君子”相对，指品德低下的人；古代也用作谦称（“小人不敢”）。越南语 tiểu nhân 只保留贬义，不作谦称。"}, {"w": "德行", "t": "注意声调：书面语“德行”读 déxíng，指品德；北方口语“德行”读 déxing，是骂人话（“瞧你那德行！”）。"}]}, {"si": 4, "ch": "第一章 宗教文化的词汇", "num": "第四节", "title": "影响到越南的词汇", "words": [["佛教", "", "佛教", "Phật giáo", "", "汉越词；表示佛教信仰体系，在越南语中广泛用于指代佛教活动和场所。"], ["佛子", "", "佛子", "Phật tử", "", "汉越词；指佛教信徒，通常用来称呼那些参与佛教仪式或修行的人。"], ["寺/庙", "", "寺/庙", "Chùa", "", "古汉越词（来源有争议）；源自汉语的“寺”，现在用来泛指佛教寺庙。"], ["佛诞", "", "佛诞", "Phật đản", "", "汉越词（佛诞）；佛教节日，庆祝释迦牟尼的生日，是越南重要的宗教节日之一。"], ["菩萨", "", "菩萨", "Bồ tát", "", "汉越词；指大乘佛教中发愿成佛、在成佛之前留在世间救度众生的人物。"], ["尼师", "", "尼师", "Ni sư", "", "汉越词；指女性僧侣，即出家修行的女性佛教徒。"], ["供佛", "", "cúng 佛", "Cúng Phật", "", "越“cúng” + 汉“Phật 佛”；表示向佛像献祭品或进行祈祷的行为。"], ["禅定", "", "禅定", "Thiền định", "", "汉越词；来源于汉语“禅”，表示冥想和静思的状态。"], ["法会", "", "法会", "Pháp hội", "", "汉越词；指佛教举行的大型宗教集会或庆典。"], ["经典", "", "经典", "Kinh điển", "", "汉越词；指佛教的经典著作，如《金刚经》、《心经》等。"], ["和尚", "", "和尚", "Hòa thượng", "", "汉越词（形同义异）；越南语中是对高僧的尊称（僧阶中最高一级）；汉语“和尚”泛指一般男性出家人。"], ["僧人、出家人", "", "nhà 师", "Nhà sư", "", "混合词（纯越 nhà＋汉越 sư 师）；越南语对僧人的通称，也说 sư、thầy chùa；汉语则称“师父”“法师”。"], ["涅槃", "", "涅槃", "Niết bàn", "", "汉越词；佛教指熄灭一切烦恼、超脱生死轮回的境界。"], ["轮回", "", "轮回", "Luân hồi", "", "汉越词；佛教指众生在六道中生死相续、循环不已。"], ["慈悲", "", "慈悲", "Từ bi", "", "汉越词；佛教指给人快乐、拔除痛苦；越南语常说 từ bi hỉ xả（慈悲喜舍）。"], ["业、业障", "", "业", "Nghiệp", "", "汉越词；佛教指身、口、意的行为及其果报；越南语口语中也指“自作自受的后果”。"], ["缘、缘分", "", "缘", "Duyên", "", "汉越词（词义扩大）；越南语 duyên 除“因缘、缘分”外，还指人的魅力（có duyên 有魅力），汉语无此义。"], ["念经、诵经", "", "诵经", "Tụng kinh", "", "汉越词；僧人或信徒朗读、背诵佛经。"], ["吃素、吃斋", "", "ăn 斋", "Ăn chay", "", "混合词（纯越 ăn＋古汉越 chay 斋）；chay 是“斋”的古汉越读音（汉越音为 trai）。"], ["阿弥陀佛", "", "阿弥陀佛", "A Di Đà Phật", "", "汉越词；佛号，越南佛教徒见面、致谢时也常念诵。"], ["观音菩萨", "", "佛婆观音", "Phật Bà Quan Âm", "", "混合词（Phật 佛＋纯越 Bà＋汉越 Quan Âm）；越南民间对观音菩萨的尊称，直译为“佛婆观音”。"], ["道教", "", "道教", "Đạo giáo", "", "汉越词；表示道教信仰体系，在越南语中用于描述道教相关的内容。"], ["道士", "", "道士", "Đạo sĩ", "", "汉越词；指道教的修行者或祭司，他们负责主持宗教仪式和传授道术。"], ["道观", "", "道观", "Đạo quán", "", "汉越词；指道教的庙宇或修道院，类似于佛教的寺庙。"], ["牌位", "", "牌位", "Bài vị", "", "汉越词；用以纪念祖先或神灵的小牌子，常见于家庭祭坛或道观中。"], ["驱鬼", "", "除魔", "Trừ ma", "", "汉越词；描述道教仪式中的一种做法，旨在驱除邪灵或不祥之气。"], ["道法", "", "道法", "Đạo pháp", "", "汉越词；泛指道教的教义、戒律和修行方法。"], ["三清", "", "三清", "Tam thanh", "", "汉越词；指道教最高三位神祇——玉清、上清、太清。"], ["炼丹", "", "炼丹", "Luyện đan", "", "汉越词；指道教中追求长生不老的炼制仙药的实践。"], ["神仙、仙女", "", "仙", "Tiên", "", "汉越词；越南语 tiên 多指仙女、仙人；越南民族起源传说称“con Rồng cháu Tiên”（龙子仙孙）。"], ["玉皇大帝", "", "玉皇", "Ngọc Hoàng", "", "汉越词；道教最高神之一，越南民间也称 Ông Trời（天公）。"], ["八仙", "", "八仙", "Bát tiên", "", "汉越词；道教传说中的八位神仙，常见于越南的年画、雕刻和瓷器装饰。"], ["阴阳", "", "阴阳", "Âm dương", "", "汉越词；道家、阴阳家用来解释万物对立统一的概念。"], ["五行", "", "五行", "Ngũ hành", "", "汉越词；金、木、水、火、土；越南的命理、风水、医药中广泛使用。"], ["风水", "", "风水", "Phong thủy", "", "汉越词；选择住宅、坟地的方位与环境的术数，在越南影响很大。"], ["符、符箓、护身符", "", "符", "Bùa", "", "古汉越词（符）；bùa 是“符”的古汉越读音，汉越音为 phù。"], ["巫师、法师", "", "符水", "Phù thủy", "", "汉越词（形同义异）；原指道士画符所用的符水，越南语转指施行法术的人（巫师），属形同义异。"], ["城隍", "", "城隍", "Thành hoàng", "", "汉越词；越南村社的守护神，供奉于村亭（đình）中，与中国的城隍神有所不同。"], ["（无对应词）", "", "道母", "Đạo Mẫu", "", "汉越词；越南本土的母神信仰，吸收了道教的神灵体系和仪式，属文化空缺。"], ["儒教", "", "儒教", "Nho giáo", "", "汉越词；指儒家学说或孔子的思想体系，在越南语中用来描述儒家教育和伦理观念。"], ["儒学", "", "儒学", "Nho học", "", "汉越词；指儒家的学术研究，包括经典的解读和哲学探讨。"], ["儒士", "", "儒士", "Nho sĩ", "", "汉越词；指受过良好教育的知识分子，通常是儒家学者或官员。"], ["文庙", "", "文庙", "Văn miếu", "", "汉越词；祭祀孔子及其他儒家先贤的地方，类似中国各地的孔庙。"], ["科举", "", "科举", "Khoa cử", "", "汉越词；指古代通过考试选拔官员的制度，深受儒家思想影响。"], ["五常", "", "五常", "Ngũ thường", "", "汉越词；指仁、义、礼、智、信五大美德，是儒家伦理道德的核心。"], ["仁义", "", "仁义", "Nhân nghĩa", "", "汉越词；强调人与人之间的关爱和正义感，是儒家思想的重要组成部分。"], ["礼教", "", "礼教", "Lễ giáo", "", "汉越词；指礼仪教育，教导人们如何遵循社会规范和行为准则。"], ["忠诚", "", "忠诚", "Trung thành", "", "汉越词；强调个人对国家、家庭或朋友的忠诚，是儒家伦理的重要方面。"], ["学问", "", "学问", "Học vấn", "", "汉越词；指学习和知识积累的过程，反映了儒家重视教育的传统。"], ["三纲", "", "三纲", "Tam cương", "", "汉越词；君为臣纲、父为子纲、夫为妻纲，常与 ngũ thường（五常）并称。"], ["孝、孝顺", "", "孝", "Hiếu", "", "汉越词；越南语常说 hiếu thảo、có hiếu（孝顺）；báo hiếu 指报答父母养育之恩。"], ["君子", "", "君子", "Quân tử", "", "汉越词；儒家理想人格，越南语中与 tiểu nhân（小人）相对。"], ["四书五经", "", "四书五经", "Tứ thư ngũ kinh", "", "汉越词；儒家的基本经典，是越南古代科举考试的主要内容。"], ["进士；博士", "", "进士", "Tiến sĩ", "", "汉越词（形同义异）；古代指殿试及第者；现代越南语指博士学位，属形同义异。"], ["状元", "", "状元", "Trạng nguyên", "", "汉越词；科举殿试第一名；越南第一位状元是1075年的黎文盛（Lê Văn Thịnh）。"], ["国子监", "", "国子监", "Quốc Tử Giám", "", "汉越词；1076年李朝在升龙（今河内）文庙旁设立，被视为越南最早的大学。"], ["私塾先生", "", "—", "Thầy đồ", "", "混合词（thầy 师＋纯越 đồ）；旧时教授汉字和儒家经典的乡村教师。"], ["尊师重道", "", "尊师重道", "Tôn sư trọng đạo", "", "汉越词；越南教育中最常用的口号之一，越南教师节（11月20日）时常被引用。"]], "obj": ["区分汉越词、纯越词与混合词", "掌握宗教词语进入越南语的途径", "能辨析形同义异的宗教词语"], "cls": {"title": "怎样判断一个越南语词是不是汉越词", "paras": ["一看读音：汉越词按汉越音系统读，如“佛”Phật、“寺”tự；比汉越音更早的读法称古汉越音，如 Bụt、chùa（来源有争议）。", "二看结构：汉越词多为汉字语素组合，可以拆出对应汉字（Thiền định＝禅定）；混合词由纯越语素和汉越语素组成（Cúng Phật＝cúng＋佛）。", "三看语义：同一个汉字词在越南语中的意义可能扩大、缩小或转移，所以“能写出汉字”不等于“意义相同”，判断后还要查对用法。"], "rows": null}, "egg": {"title": "喃字：越南人自己造的汉字", "teaser": "越南语的 trời（天）用汉字怎么写？古代越南人用“天”加“上”造了一个新字。", "paras": ["喃字（chữ Nôm）是古代越南人借用汉字及其构字方法来记录越南语的文字。常见的造字方法有两种：一是假借汉字的读音，如用“沒”记 một（一）；二是形声或会意组合，如“𡗶”（trời，天）由“天”和“上”组成。", "越南文学名著《金云翘传》（Truyện Kiều）就是用喃字写成的。20世纪以后，拉丁字母拼写的国语字（chữ Quốc ngữ）取代了汉字和喃字。", "了解喃字，有助于理解为什么越南语中既有汉越词，又有大量带汉字背景的纯越词和混合词。"]}, "tips": []}, {"si": 5, "ch": "第二章 称谓的词汇", "num": "第一节", "title": "家庭成员间的称谓", "words": [["曾祖父（太爷爷）", "zēngzǔfù (tàiyéye)", "tằng tổ phụ", "cụ ông (cố nội), cụ", "C", "父亲的父亲的父亲，比自己长三辈的男性祖先。"], ["曾祖母（太奶奶）", "zēngzǔmǔ (tàinǎinai)", "tằng tổ mẫu", "cụ bà (cố nội)", "C", "父亲的父亲的母亲，比自己长三辈的女性祖先。"], ["祖父（爷爷）", "zǔfù (yéye)", "tổ phụ", "ông nội", "C", "父亲的父亲，比自己长两辈的男性祖先。"], ["祖母（奶奶）", "zǔmǔ (nǎinai)", "tổ mẫu", "bà nội", "C", "父亲的母亲，比自己长两辈的女性祖先。"], ["父亲（爸爸）", "fùqīn (bàba)", "phụ thân", "cha, bố, ba", "C", "有子女的男子是子女的父亲。“爸爸”是口语中的称呼。"], ["母亲（妈妈）", "mǔqīn (māma)", "mẫu thân", "mẹ, má", "C", "有子女的女子是子女的母亲。“妈妈”是口语中的称呼。"], ["兄（哥哥）", "xiōng (gēge)", "huynh", "anh, anh trai", "C", "同父母（或只同父、只同母）而年纪比自己大的男子；也称同族同辈而年纪比自己大的男子。"], ["弟（弟弟）", "dì (dìdi)", "đệ", "em trai", "C", "同父母（或只同父、只同母）而年纪比自己小的男子；也称同族同辈而年纪比自己小的男子。"], ["姊（姐姐）", "zǐ (jiějie)", "tỷ", "chị, chị gái", "C", "同父母（或只同父、只同母）而年纪比自己大的女子；也称同族同辈而年纪比自己大的女子。"], ["妹（妹妹）", "mèi (mèimei)", "muội", "em gái", "C", "同父母（或只同父、只同母）而年纪比自己小的女子；也称同族同辈而年纪比自己小的女子。"], ["儿子", "érzi", "nhi tử", "con trai", "C", "男孩子（对父母而言）。"], ["女儿", "nǚ'ér", "nữ nhi", "con gái", "C", "女孩子（对父母而言）。"], ["孙子", "sūnzi", "tôn tử", "cháu nội (trai)", "C", "儿子的儿子。"], ["孙女", "sūnnü", "tôn nữ", "cháu nội (gái)", "C", "儿子的女儿。"], ["曾孙", "zēngsūn", "tằng tôn", "chắt (trai)", "C", "孙子的儿子。"], ["曾孙女", "zēngsūnnü", "tằng tôn nữ", "chắt (gái)", "C", "孙子的女儿。"], ["伯父（大伯）", "bófù (dàbó)", "bá phụ", "bác (anh của cha)", "C", "父亲的兄长，即父亲的大哥。\"大伯\"是较为口语化的称呼。"], ["叔父（叔叔）", "shūfù (shūshu)", "thúc phụ", "chú", "C", "父亲的弟弟。\"叔叔\"是日常生活中常用的亲切称呼。"], ["姑母（姑姑）", "gūmǔ (gūgu)", "cô mẫu", "cô", "A", "父亲的姐妹。\"姑姑\"是常用的亲切称呼。"], ["堂兄", "tángxiōng", "đường huynh", "anh họ (bên nội)", "C", "伯父或叔父（父亲的兄弟）的儿子中比自己年长者。"], ["堂弟", "tángdì", "đường đệ", "em họ (bên nội, trai)", "C", "伯父或叔父（父亲的兄弟）的儿子中比自己年幼者。"], ["堂姐", "tángjiě", "đường tỷ", "chị họ (bên nội)", "C", "伯父或叔父（父亲的兄弟）的女儿中比自己年长者。"], ["堂妹", "tángmèi", "đường muội", "em họ (bên nội, gái)", "C", "伯父或叔 , ["天伦之乐", "tiānlúnzhīlè", "thiên luân chi lạc", "thiên luân chi lạc; niềm vui sum họp", "A", "指家庭成员之间享受的天然乐趣。"], ["手足情深", "shǒuzú-qíngshēn", "thủ túc tình thâm", "tình thủ túc; anh em ruột thịt gắn bó", "C", "手足比喻兄弟。形容兄弟之间感情深厚。"], ["打虎亲兄弟，上阵父子兵", "dǎ hǔ qīn xiōng dì, shàng zhèn fù zǐ bīng", "đả hổ thân huynh đệ, thượng trận phụ tử binh", "anh em như thể tay chân", "C", "打老虎要靠亲兄弟，上战场要靠父子兵。比喻关键时刻还是骨肉至亲最可靠、最能齐心协力。（俗语）"], ["家家有本难念的经", "jiā jiā yǒu běn nán niàn de jīng", "gia gia hữu bản nan niệm đích kinh", "nhà nào cũng có nỗi khổ riêng", "C", "比喻每个家庭都有自己的难处。"], ["清官难断家务事", "qīng guān nán duàn jiā wù shì", "thanh quan nan đoạn gia vụ sự", "chuyện nhà người ngoài khó phân xử", "C", "家庭内部的纠纷错综复杂，即使是公正廉明的官员也难以判断是非。"], ["嫁出去的女儿，泼出去的水", "jià chū qù de nǚ ér, pō chū qù de shuǐ", "giá xuất khứ đích nữ nhi, bát xuất khứ đích thủy", "con gái là con người ta", "C", "旧时认为女儿出嫁以后就是别人家的人，不再属于娘家。（反映旧时的观念）"], ["大水冲了龙王庙——一家人不认识一家人", "dà shuǐ chōng le lóng wáng miào — yī jiā rén bù rèn shí yī jiā rén", "đại thủy xung liễu long vương miếu – nhất gia nhân bất nhận thức nhất gia nhân", "người nhà không nhận ra người nhà", "C", "龙王是传说中管水的神，大水冲了龙王庙，等于自家人冲撞自家人。比喻自己人因误会而发生冲突。"], ["外甥打灯笼——照旧（舅）", "wài sheng dǎ dēng long — zhào jiù", "ngoại sinh đả đăng lồng – chiếu cựu", "cháu cầm đèn lồng – vẫn như cũ", "D", "外甥打着灯笼给舅舅照路，即“照舅”；“舅”谐音“旧”。比喻跟原来一样，没有变化。"]], "obj": ["掌握直系、旁系、外亲和姻亲称谓", "理解称谓所反映的宗法观念", "能对比汉越家庭称谓体系的差异"], "cls": {"title": "汉越亲属称谓体系的差异", "paras": ["汉语亲属称谓分得很细：父亲的兄弟分“伯”“叔”，母亲的兄弟称“舅”，父亲的姐妹称“姑”，母亲的姐妹称“姨”，同辈亲属还要分“堂”与“表”。", "越南语北方的 bác 不分父系母系、不分男女，只要比父母年长即可；chú、cô 用于父系，cậu、dì 用于母系。越南语更看重“比父母年长还是年幼”，汉语更看重“父系还是母系”。"], "rows": [["父亲的哥哥", "伯父", "bác", "北方 bác 也可指母亲的哥哥、姐姐"], ["父亲的弟弟", "叔叔", "chú", "对应较整齐"], ["母亲的兄弟", "舅舅", "cậu（南方年长者也称 bác）", "南北有差异"], ["母亲的姐妹", "姨妈", "dì（北方年长者称 bác）", "南北有差异"]]}, "egg": {"title": "称谓的南北差异", "teaser": "同样叫父亲，有人说“爸爸”，有人说“爹”；越南有人说 bố，有人说 ba。", "paras": ["汉语称谓有明显的南北差异：外祖母北方多称“姥姥”，南方多称“外婆”；父亲北方口语还可称“爹”。", "越南语也一样：北方称父亲 bố、母亲 mẹ，南方称 ba、má。南方还有独特的排行习惯——家中长子称 anh Hai（二哥），从“二”开始排，而北方长子称 anh Cả（大哥）。", "学习称谓时，既要掌握标准说法，也要了解地区差异，才能听懂不同地方的人说话。"]}, "tips": [{"w": "伯父（大伯）", "t": "越南北方 bác 指父母的哥哥或姐姐，不分男女、不分父系母系；汉语“伯父”只指父亲的哥哥，“大姨”“大舅”等要分别称呼。"}, {"w": "外甥", "t": "汉语用“堂”（父系同姓）和“表”（异姓）区分两类同辈亲属，越南语都说 anh họ／chị họ／em họ；“外甥”与“侄子”在越南语中也都可以说 cháu。"}]}, {"si": 6, "ch": "第二章 称谓的词汇", "num": "第二节", "title": "社会关系中的称谓", "words": [["先生", "xiānshēng", "tiên sinh", "ông, anh, ngài; thầy (tiên sinh: cổ)", "B", "对成年男性的尊称，也可用于指教师或医生等专业人士，在正式场合中使用；也用来称别人的丈夫或对人称自己的丈夫。"], ["女士", "nǚshì", "nữ sĩ", "bà, chị, quý bà", "B", "对成年女性的尊称，在正式或非正式场合都可以使用，表示礼貌和尊重。"], ["夫人", "fūrén", "phu nhân", "phu nhân", "A", "用于称呼他人的妻子，尤其是在正式场合；也可以用来尊称已婚女性。"], ["小姐", "xiǎojiě", "tiểu thư", "cô, chị (tiểu thư: nghĩa hẹp hơn)", "B", "传统上用于称呼未婚年轻女性，但在现代汉语中有时可能带有不恰当的含义，因此在正式场合使用时需谨慎。"], ["先生们", "xiānshēngmen", "tiên sinh môn", "các ông, quý ông", "C", "对多个成年男性的集体尊称，通常用于正式场合。"], ["女士们", "nǚshìmen", "nữ sĩ môn", "các bà, quý bà", "C", "对多个成年女性的集体尊称，适用于正式或非正式场合。"], ["主持人", "zhǔchírén", "chủ trì nhân", "người dẫn chương trình, MC", "C", "指负责组织、引导会议、晚会等活动的人，确保活动顺利进行。"], ["来宾", "láibīn", "lai tân", "khách mời, quan khách", "C", "泛指参加某种活动的所有客人，包括嘉宾和普通参与者。"], ["嘉宾", "jiābīn", "gia tân", "khách quý, khách mời danh dự", "C", "特别邀请来参加活动的重要人物或贵宾，具有一定的社会地位或影响力。"], ["东道主", "dōngdàozhǔ", "đông đạo chủ", "chủ nhà", "C", "举办活动的一方，负责接待宾客的人或机构，也指宴请者的主人。"], ["座上宾", "zuòshàngbīn", "tọa thượng tân", "thượng khách", "C", "指受到特别优待、坐在显要位置上的贵宾。"], ["伙伴", "huǒbàn", "hỏa bạn", "bạn đồng hành, đối tác", "C", "朋友或同事之间的互称，强调平等和亲密的关系。"], ["上级", "shàngjí", "thượng cấp", "cấp trên", "C", "指职位较高、权力较大的人，相对于自己而言处于领导地位。"], ["下级", "xiàjí", "hạ cấp", "cấp dưới", "C", "指职位较低、接受指挥的人，相对于自己而言处于被领导地位。"], ["平辈", "píngbèi", "bình bối", "ngang hàng, cùng vai vế", "C", "指与自己同一代、年龄相近且无明显等级差异的人。"], ["领导", "lǐngdǎo", "lãnh đạo", "lãnh đạo", "A", "指在组织中担任管理职责的人，拥有决策权和指挥权。"], ["顾问", "gùwèn", "cố vấn", "cố vấn", "A", "为特定领域提供咨询建议的专业人士，通常具有丰富的经验和知识。"], ["专家", "zhuānjiā", "chuyên gia", "chuyên gia", "A", "在某一专业领域内拥有深厚学识和技术能力的人。"], ["学者", "xué ca sĩ", "C", "以歌唱为主要职业的艺术工作者，通过演唱歌曲来表达情感并与观众交流。"], ["导演", "dǎoyǎn", "đạo diễn", "đạo diễn", "A", "指导影视作品创作的核心人物，负责整体创意规划、演员指导及拍摄安排等重要工作。"], ["摄影师", "shèyǐngshī", "nhiếp ảnh sư", "nhiếp ảnh gia, thợ ảnh", "C", "使用相机捕捉影像的专业人士，可以是摄影记者、商业摄影师或艺术家，专注于记录生活瞬间或创造视觉艺术品。"], ["模特", "mótè", "mô đặc", "người mẫu", "C", "展示服装、饰品或其他商品的专业人士，通常出现在时装秀、广告宣传及杂志封面等场合。"], ["运动员", "yùndòngyuán", "vận động viên", "vận động viên", "A", "参加体育竞赛的专业人士，经过系统训练，在各种体育赛事中竞争并争取优异成绩。"], ["教练", "jiàoliàn", "giáo luyện", "huấn luyện viên", "C", "指导运动员训练和比赛策略的专业人士，帮助运动员提高竞技水平，实现最佳表现。"], ["一箭双雕", "yījiàn-shuāngdiāo", "nhất tiễn song điêu", "một mũi tên trúng hai đích", "C", "做一件事达到两个目的，形容一举两得。"], ["百闻不如一见", "bǎi wén bù rú yī jiàn", "bách văn bất như nhất kiến", "trăm nghe không bằng một thấy", "C", "听别人说一百次，也不如自己亲眼见一次。"], ["不计前嫌", "bùjì-qiánxián", "bất kế tiền hiềm", "bỏ qua hiềm khích cũ", "C", "不再计较过去的嫌隙或矛盾，表示和解。"], ["唇齿相依", "chúnchǐ-xiāngyī", "thần xỉ tương y", "môi hở răng lạnh", "C", "形容两国或两人之间关系密切，互相依靠。"], ["道不同，不相为谋", "dàobùtóng, bù xiāng wéi móu", "đạo bất đồng, bất tương vi mưu", "khác chí hướng thì không cùng mưu sự", "C", "志向不同的人很难在一起共事。"], ["德高望重", "dégāo-wàngzhòng", "đức cao vọng trọng", "đức cao vọng trọng", "A", "道德高尚，受人尊敬。"], ["风雨同舟", "fēngyǔ-tóngzhōu", "phong vũ đồng chu", "chung thuyền trong mưa gió; đồng cam cộng khổ", "C", "在困难中共同奋斗，彼此支持。"], ["肝胆相照", "gāndǎn-xiāngzhào", "can đảm tương chiếu", "can đảm tương chiếu; chân thành với nhau", "C", "形容朋友之间真诚相见，毫无保留。"], ["顾此失彼", "gùcǐ-shībǐ", "cố thử thất bỉ", "được cái này mất cái kia", "C", "照顾了这一方面，却忽视了另一方面，形容不能兼顾。"], ["患难与共", "huànnàn-yǔgòng", "hoạn nạn dữ cộng", "hoạn nạn có nhau", "C", "在困境中相互扶持，共享艰难。"], ["鸡犬相闻", "jīquǎn-xiāngwén", "kê khuyển tương văn", "gà gáy chó sủa nghe tiếng nhau (xóm giềng gần gũi)", "D", "形容村落间距离近，生活安详和谐。"], ["举足轻重", "jǔzú-qīngzhòng", "cử túc khinh trọng", "có vai trò then chốt", "C", "指人的地位重要，一举一动都影响重大。"], ["礼尚往来", "lǐshàngwǎnglái", "lễ thượng vãng lai", "có đi có lại (mới toại lòng nhau)", "C", "指礼物或情谊应该相互赠送，表示友好交往。"], ["朋比为奸", "péngbǐ-wéijiān", "bằng tỷ vi gian", "cấu kết làm điều xấu", "C", "坏人勾结在一起做坏事。"], ["齐心协力", "qíxīn-xiélì", "tề tâm hiệp lực", "đồng tâm hiệp lực", "C", "大家一条心，共同努力。"], ["情投意合", "qíngtóu-yìhé", "tình đầu ý hợp", "tâm đầu ý hợp", "C", "感情融洽，思想一致，形容关系亲密。"], ["上下其手", "shàngxià-qíshǒu", "thượng hạ kỳ thủ", "giở trò gian lận, thông đồng", "C", "暗中作弊，玩弄手段。"], ["生死之交", "shēngsǐ-zhījiāo", "sinh tử chi giao", "bạn sinh tử; bạn vào sinh ra tử", "C", "可以共生死的朋友，形容友谊非常深厚。"], ["水落石出", "shuǐluò-shíchū", "thủy lạc thạch xuất", "cháy nhà ra mặt chuột; sự thật phơi bày", "C", "事情的真相终于显露出来。"], ["同舟共济", "tóngzhōu-gòngjì", "đồng chu cộng tế", "đồng chu cộng tế; cùng hội cùng thuyền", "A", "比喻团结一致，共同克服困难。"], ["推心置腹", "tuīxīn-zhìfù", "suy tâm trí phúc", "thật lòng thật dạ, lấy lòng thành đối đãi", "C", "形容真心诚意地对待对方，无所隐瞒。"], ["无微不至", "wúwēi-bùzhì", "vô vi bất chí", "chăm sóc từng li từng tí", "C", "形容关怀备至，体贴入微。"], ["息息相关", "xīxī-xiāngguān", "tức tức tương quan", "liên quan mật thiết", "C", "形容事物之间关系非常密切。"], ["相辅相成", "xiāngfǔ-xiāngchéng", "tương phụ tương thành", "bổ trợ cho nhau", "C", "两者互相辅助，缺一不可。"], ["相得益彰", "xiāngdé-yìzhāng", "tương đắc ích chương", "tương đắc ích chương; càng tôn nhau lên", "C", "双方互相帮助，使各自的优势更加明显。"], ["休戚相关", "xiūqī-xiāngguān", "hưu thích tương quan", "vui buồn có nhau, cùng chung số phận", "C", "形容彼此之间的利害关系非常密切。"], ["言而有信", "yán'ér-yǒuxìn", "ngôn nhi hữu tín", "nói lời giữ lời; nói được làm được", "C", "说话算数，值得信赖。"], ["一诺千金", "yīnuò-qiānjīn", "nhất nặc thiên kim", "nhất ngôn cửu đỉnh; lời hứa đáng ngàn vàng", "C", "许下的一个承诺价值千金，形容信用极好。"], ["远亲不如近邻", "yuǎn qīn bù rú jìn lín", "viễn thân bất như cận lân", "bán anh em xa, mua láng giềng gần", "C", "远方的亲戚不如近旁的邻居能及时给予帮助。"], ["在家靠父母，出门靠朋友", "zài jiā kào fù mǔ, chū mén kào péng yǒu", "tại gia kháo phụ mẫu, xuất môn kháo bằng hữu", "ở nhà nhờ cha mẹ, ra ngoài nhờ bạn bè", "D", "在家里依靠父母，出门在外就要依靠朋友。强调朋友的重要。"], ["多个朋友多条路", "duō gè péng yǒu duō tiáo lù", "đa cá bằng hữu đa điều lộ", "thêm bạn bớt thù", "C", "多结交一个朋友，就多一条出路。"], ["礼多人不怪", "lǐ duō rén bù guài", "lễ đa nhân bất quái", "lời chào cao hơn mâm cỗ", "C", "对人多讲礼节，别人不会责怪。"], ["君子之交淡如水", "jūn zǐ zhī jiāo dàn rú shuǐ", "quân tử chi giao đạm như thủy", "tình quân tử thanh đạm như nước", "D", "君子之间的交往不重物质利益，像水一样清淡而长久。（语本《庄子·山木》“君子之交淡若水，小人之交甘若醴”）"], ["千里送鹅毛——礼轻情意重", "qiān lǐ sòng é máo — lǐ qīng qíng yì zhòng", "thiên lý tống nga mao – lễ khinh tình ý trọng", "của ít lòng nhiều", "C", "从千里之外送来一根鹅毛，礼物虽轻，情意却很深厚。"], ["黄鼠狼给鸡拜年——没安好心", "huáng shǔ láng gěi jī bài nián — méi ān hǎo xīn", "hoàng thử lang cấp kê bái niên – một an hảo tâm", "mèo khóc chuột", "C", "黄鼠狼喜欢吃鸡，它给鸡拜年绝不是好意。比喻假意友好，实则包藏祸心。"]], "obj": ["掌握社交场合常用称谓及其使用条件", "理解称谓的礼貌功能", "能在汉越两种语言中选择得体的称谓"], "cls": {"title": "“姓＋职衔”与“职衔＋名”", "paras": ["汉语社交称谓常用“姓＋职衔”：王老师、李医生、张经理。越南语则用“职衔＋名”，并且称名不称姓：thầy Minh、bác sĩ Lan、giám đốc Hùng。", "越南学生说汉语时常误用“名＋职衔”（“明老师”），或直接称对方的名字。正确的做法是：初次见面用“姓＋职衔／先生／女士”，关系熟悉后再根据对方的意愿改称“小王”“老李”或名字。"], "rows": null}, "egg": {"title": "“吃了吗？”和“Đi đâu đấy？”", "teaser": "中国人见面问“吃了吗？”，越南人见面问“Đi đâu đấy？”——它们都不是真的在提问。", "paras": ["“吃了吗？”“去哪儿啊？”是汉语传统的寒暄语，表达关心，并不需要对方具体回答。越南语的“Đi đâu đấy？”（去哪儿啊？）、“Ăn cơm chưa？”（吃饭了吗？）功能完全相同。", "但在跨文化交际中，这类问候可能被误解为打听隐私。和其他国家的人交流时，用“你好”“早上好”等更中性的问候语更稳妥。", "练一练：用汉语和越南语分别写出三种熟人之间的寒暄方式。"]}, "tips": [{"w": "先生", "t": "汉语“先生”还可以称别人的丈夫（“您先生在家吗？”），也可以对人称自己的丈夫（“我先生”）。越南语 tiên sinh 已很少使用，不能这样理解。"}, {"w": "小姐", "t": "“小姐”在部分语境中有不雅的含义，餐馆里招呼女服务员多说“服务员”，正式场合称“女士”。越南语 tiểu thư 指千金小姐，二者都不宜随意套用。"}]}, {"si": 7, "ch": "第二章 称谓的词汇", "num": "第三节", "title": "年龄和社会地位的影响", "words": [["长辈", "zhǎngbèi", "trưởng bối", "bề trên, người lớn tuổi", "C", "指家庭或社交圈中年龄较大、辈分较高的人，通常带有尊敬之意。"], ["晚辈", "wǎnbèi", "vãn bối", "con cháu, người bề dưới, hậu bối", "C", "相对于长辈而言，指家庭或社交圈中较年轻、辈分较低的人。"], ["老人", "lǎorén", "lão nhân", "người già, cụ già", "C", "泛指年纪较大的人，通常用于描述老年人群体，有时也表示尊重。"], ["长者", "zhǎngzhě", "trưởng giả", "bậc trưởng thượng, người lớn tuổi (trưởng giả: nhà giàu)", "B", "指年长且受人尊敬的人，不仅限于家庭成员，也可以是社区中的德高望重者。"], ["小孩", "xiǎohái", "tiểu hài", "trẻ con, đứa bé", "C", "指年龄较小的孩子，通常用来泛指儿童和幼儿。"], ["儿童", "értóng", "nhi đồng", "nhi đồng, trẻ em", "A", "指未成年的孩子，一般指从婴儿到青少年之间的年龄段。"], ["幼儿", "yòu'ér", "ấu nhi", "trẻ nhỏ, ấu nhi", "A", "指年龄非常小的孩子，通常是指还在幼儿园阶段的孩子（大约0-6岁）。"], ["少年", "shàonián", "thiếu niên", "thiếu niên", "A", "指青春期前后的年轻人，通常指的是十多岁的青少年。"], ["青年", "qīngnián", "thanh niên", "thanh niên", "A", "指大约二十至三十多岁之间的成年人，正处于成年早期阶段。"], ["中年", "zhōngnián", "trung niên", "trung niên", "A", "指大约四十岁至六十岁之间的人，处于人生中期阶段。"], ["老年", "lǎonián", "lão niên", "tuổi già, lão niên", "A", "指六十岁以上的人，进入人生的晚年阶段。"], ["未成年", "wèichéngnián", "vị thành niên", "vị thành niên", "A", "指未达到法定成年年龄的人，通常指18 岁以下（根据不同国家和地区法律可能有所差异）。"], ["成年", "chéngnián", "thành niên", "thành niên, người trưởng thành", "A", "指达到了法定成年年龄的人，通常指18 岁以上（根据不同国家和地区法律可能有所差异）。"], ["老前辈", "lǎoqiánbèi", "lão tiền bối", "bậc tiền bối, bậc lão thành", "A", "指在某个领域或组织中有多年经验和资历的年长者，常用于表达尊敬。"], ["小朋友", "xiǎopéngyou", "tiểu bằng hữu", "bạn nhỏ, các cháu", "C", "一种亲切地称呼儿童的方式，尤其在与不熟悉的孩子交流时使用。"], ["小兄弟", "xiǎoxiōngdì", "tiểu huynh đệ", "em, chú em, anh bạn trẻ", "C", "用于称呼年轻男性，可以是对同龄但较年轻者的友好称呼，也可以用于跨辈分的亲切称呼。"], ["小姐妹", "xiǎojiěmèi", "tiểu tỷ muội", "em gái, cô em", "C", "用于称呼年轻女性，同样可以是对同龄但较年轻者的友好称呼，也可以用于跨辈分的亲切称呼。"], ["老先生", "lǎoxiānshēng", "lão tiên sinh", "cụ, bác, ông", "C", "尊称年长男性，通常用于表达对他人的敬意，尤其是在正式场合或对有学问、有地位的男性。"], ["老太太", "lǎotàitai", "lão thái thái", "cụ bà, bà cụ", "C", "尊称年长女性，类似于“老先生”，用于表达对他人的敬意。"], ["小伙子", "xiǎohuǒzi", "tiểu hỏa tử", "chàng trai, cậu thanh niên", "C", "指年轻的男性，通常用来形容充满活力的年轻人，也可以用作对年轻男性的友好称呼。"], ["总裁", "zǒngcái", "tổng tài", "chủ tịch tập đoàn, tổng giám đốc", "B", "企业或组织的最高行政负责人，通常负责整体战略规划和重大决策。"], ["经理", "jīnglǐ", "kinh lý", "giám đốc, quản lý (kinh lý: cổ)", "B", "管理特定部门或业务单元的高级管理人员，负责日常运营和团队领导。"], ["主任", "zhǔrèn", "chủ nhiệm", "chủ nhiệm, trưởng phòng", "A", "负责某一具体部门或项目的主要管理者，通常在政府机构、学校或企业中使用。"], ["部长", "bùzhǎng", "bộ trưởng", "bộ trưởng", "A", "中央政府各部的最高行政负责人，负责整个部门的工作指导和管理。"], ["主席", "zhǔxí", "chủ tịch", "chủ tịch", "A", "国家元首或大型组织（如政党、协会）的最高领导人，具有最高的决策权。"], ["副主席", "fùzhǔxí",  ngày nên kim", "C", "形容成功的背后需要长期的努力和训练。（由两句俗语拼合而成）"]], "obj": ["掌握网络时代的新兴称谓", "理解新词产生的社会原因", "能说明新称谓在越南语中的对应形式"], "cls": {"title": "网络新称谓的构词方式", "paras": ["新称谓大多由“词根＋类词缀”构成：“-客”（创客、黑客）、“-族”（上班族、月光族）、“-主”（博主、群主）、“-者”（创业者），以及“-霸”“-控”等。", "越南语对应的方式有三种：借英语（influencer、streamer、freelancer）、意译（người khởi nghiệp）、借汉越读音（học bá、đại gia）。翻译时要考虑读者年龄和语体，正式文本优先用意译。"], "rows": null}, "egg": {"title": "“打工人”和“X人”格式", "teaser": "“打工人”曾入选年度十大流行语。“干饭人”“尾款人”又是什么意思？", "paras": ["“打工人”原指受雇工作的人，2020年前后在网络上流行，成为上班族自嘲又自我鼓励的称呼，并入选《咬文嚼字》编辑部发布的2020年十大流行语。", "随后出现了一系列“X人”格式的新词：“干饭人”（爱吃饭的人）、“尾款人”（网购后要付尾款的人）等。这种格式能产性很强，但大多寿命较短。", "越南语年轻人也有类似的自嘲说法，如 dân văn phòng（上班族）、hội độc thân（单身族）。你还知道哪些？"]}, "tips": [{"w": "网红", "t": "网络称谓多带调侃色彩，正式场合不宜使用。翻译时越南语或借用英语（influencer、streamer），或直接借用汉越读音，如“学霸” học bá。"}, {"w": "斜杠青年", "t": "“斜杠”来自英语 slash，指同时拥有多重职业身份的人（如“律师／作家／摄影师”）。越南语多意译为 người đa nghề。"}]}, {"si": 9, "ch": "第二章 称谓的词汇", "num": "第五节", "title": "影响到越南的词汇", "words": [["父亲", "", "phụ thân", "cha", "", "纯越词；用于指代男性的家长或长辈男性亲属"], ["母亲", "", "mẫu thân", "mẹ", "", "纯越词；用来称呼女性家长或长辈女性亲属"], ["哥哥", "", "ca ca", "anh trai", "", "纯越词；指比自己年长的兄弟"], ["妹妹", "", "muội muội", "em gái", "", "纯越词；比自己年轻的姐妹"], ["姊姊（姐姐）", "", "tỉ tỉ", "chị gái", "", "纯越词；比自己年长的姐妹"], ["弟弟", "", "đệ đệ", "em trai", "", "纯越词；比自己年轻的兄弟"], ["祖父", "", "tổ phụ", "ông nội", "", "混合词（纯越＋汉越）；父亲的父亲"], ["外祖母", "", "ngoại tổ mẫu", "bà ngoại", "", "混合词（纯越＋汉越）；母亲的母亲"], ["姑姑", "", "cô cô", "cô", "", "汉越词（姑）；父亲的姐妹"], ["叔叔", "", "thúc thúc", "chú", "", "古汉越词（叔，一说）；父亲的弟弟"], ["外祖父", "", "ngoại tổ phụ", "ông ngoại", "", "混合词（纯越＋汉越）；母亲的父亲"], ["祖母", "", "tổ mẫu", "bà nội", "", "混合词（纯越＋汉越）；父亲的母亲"], ["伯父、伯母", "", "bá phụ", "bác", "", "汉越词（伯）；越南北方指父母的哥哥或姐姐（不分男女）；汉语“伯”只指父亲的哥哥"], ["姨妈", "", "di mẫu", "dì", "", "古汉越词（姨）；母亲的姐妹（北方多指母亲的妹妹）"], ["舅舅", "", "cữu phụ", "cậu", "", "古汉越词（舅，一说）；母亲的兄弟"], ["婶婶", "", "thẩm", "thím", "", "古汉越词（婶，一说）；叔叔（chú）的妻子"], ["舅妈", "", "cữu mẫu", "mợ", "", "纯越词；舅舅（cậu）的妻子"], ["儿媳", "", "tức phụ", "con dâu", "", "纯越词；儿子的妻子"], ["女婿", "", "nữ tế",
