"汉越词；对在场众人的尊称，常用于致辞开头"], ["夫人", "", "phu nhân", "phu nhân", "", "汉越词；对有地位者妻子的尊称"], ["小姐", "", "tiểu thư", "tiểu thư", "", "汉越词；越南语指千金小姐、大家闺秀（书面或调侃色彩）；汉语“小姐”曾广泛用作称呼，现多被“女士”等替代"], ["先生", "", "tiên sinh", "tiên sinh", "", "汉越词；越南语中已少用，多见于文学作品，指有学问的老先生"], ["老大爷、老大娘", "", "—", "cụ", "", "纯越词；对高龄老人的尊称，不分男女"], ["贵公司", "", "quý công ty", "quý công ty", "", "汉越词；商务信函中对对方公司的敬称"], ["敬启、致", "", "—", "kính gửi", "", "混合词（汉越 kính 敬＋纯越 gửi）；用于公文或信函开头，相当于“致……”"]], "obj": ["掌握汉越称谓词的对应关系", "理解越南语以亲属词作人称代词的特点", "能避免称谓使用中的母语负迁移"], "cls": {"title": "越南语以亲属词作人称代词", "paras": ["越南语没有与汉语“你／您”完全对应的中性代词，日常交际主要用亲属词作人称：anh、chị、em、cô、chú、bác、ông、bà，并根据双方年龄和关系选择。", "因此越南学生说汉语时容易出现两类偏误：一是该用“您”时用“你”；二是把越南语的亲属称呼直接搬入汉语，如对陌生人称“哥哥”“姐姐”。汉语对陌生人多用“您”或“先生／女士”，对亲近的人才用亲属称谓。"], "rows": null}, "egg": {"title": "书信里的称谓", "teaser": "汉语书信开头写“尊敬的……”“亲爱的……”，越南语书信又怎么写？", "paras": ["汉语书信的称谓常用“尊敬的王教授：”“亲爱的妈妈：”，结尾用“此致　敬礼”。", "越南语正式书信开头常用 Kính gửi（敬致）或 Kính thưa，亲友之间用 Thân gửi；结尾常用 Trân trọng（珍重）。注意：越南语 trân trọng 表示“谨致敬意”，而汉语“珍重”意为“保重身体”，属形同义异。", "试一试：分别用汉语和越南语给老师写一封简短的感谢信的开头和结尾。"]}, "tips": []}, {"si": 10, "ch": "第三章 传统节日的词汇", "num": "第一节", "title": "春节——辞旧迎新的盛大庆典", "words": [["春节", "Chūnjié", "xuân tiết", "Tết Nguyên đán, Tết", "C", "中国最重要的传统节日，标志着农历新年的开始。"], ["新年", "xīnnián", "tân niên", "năm mới", "C", "元旦和元旦以后的几天，也指春节（农历新年）。"], ["过年", "guònián", "quá niên", "ăn Tết, đón Tết", "C", "泛指庆祝农历新年的活动和过程。"], ["年夜饭", "niányèfàn", "niên dạ phạn", "bữa cơm tất niên, cơm chiều ba mươi", "C", "除夕夜全家人团聚一起吃的一顿丰盛晚餐，象征着团圆和幸福。"], ["守岁", "shǒusuì", "thủ tuế", "đón giao thừa", "C", "除夕之夜家人围坐在一起熬夜迎接新的一年到来的传统习俗。"], ["拜年", "bàinián", "bái niên", "chúc Tết", "C", "在春节期间走亲访友互相祝贺新年的传统活动。"], ["红包", "hóngbāo", "hồng bao", "bao lì xì", "C", "装有现金的小红纸袋，通常由长辈给晚辈作为新年礼物。"], ["鞭炮", "biānpào", "tiên pháo", "pháo", "C", "用于庆祝节日或喜事时燃放的小型爆竹，以驱邪避灾、增添喜庆气氛。"], ["烟花", "yānhuā", "yên hoa", "pháo hoa", "C", "一种烟火制品，点燃后会产生绚丽多彩的效果，常用于庆祝节日。"], ["对联", "duìlián", "đối liên", "câu đối", "C", "贴在门两侧的文字条幅，内容多为吉祥话，表达美好愿望。"], ["福字", "fúzì", "phúc tự", "chữ Phúc", "C", "汉字“福”，代表幸福、好运，常被倒贴在家门口以示迎福纳祥。"], ["倒福", "dàofú", "đáo phúc", "dán ngược chữ Phúc", "D", "将“福”字倒过来贴，寓意“福到了”。"], ["灯笼", "dēnglong", "đăng lồng", "đèn lồng", "C", "一种装饰性的灯具，常用作节日装饰，尤其在元宵节期间。"], ["春联", "chūnlián", "xuân liên", "câu đối Tết", "C", "特指春节期间张贴的对联，内容多与新春祝福相关。"], ["年画", "niánhuà", "niên họa", "tranh Tết (tranh Đông Hồ)", "C", "春节期间张贴的一种民间艺术形式，画面多为吉祥图案；多为木版印制，源于门神画。"], ["窗花", "chuānghuā", "song hoa", "hoa giấy dán cửa sổ", "D", "用纸剪成的各种花纹图案，贴在窗户玻璃上作为装饰。"], ["剪纸", "jiǎnzhǐ", "tiễn chỉ", "cắt giấy, tranh cắt giấy", "C", "中国传统手工艺之一，通过剪刀或刻刀在纸上创作出各种图案。"], ["舞龙", "wǔlóng", "vũ long", "múa rồng", "C", "一种表演艺术，人们手持长杆操纵一条彩色布制巨龙游行。"], ["舞狮", "wǔshī", "vũ sư", "múa lân, múa sư tử", "C", "另一种表演艺术，模拟狮子的动作进行舞蹈，象征驱邪避灾。"], ["元宵", "yuánxiāo", "nguyên tiêu", "Tết Nguyên tiêu, rằm tháng Giêng", "A", "①农历正月十五日夜晚，这一天称元宵节（也称上元节、灯节），有赏花灯、吃元宵等活动。②用糯米粉做成的球形有馅食品（南方多称“汤圆”）。"], ["灯谜", "dēngmí", "đăng mê", "câu đố đèn lồng", "D", "写在纸条上的谜语，悬挂在灯笼上供人猜解，是元宵节的传统活动之一。"], ["团圆", "tuányuán", "đoàn viên", "đoàn viên, đoàn tụ", "A", "家庭成员聚集在一起，特别是指在重要节日时的家庭聚会。"], ["吉祥", "jíxiáng", "cát tường", "cát tường, may mắn", "A", "形容事物带来好运和美好的预兆。"], ["祝福", "zhùfú", "chúc phúc", "chúc phúc, chúc", "A", "表达良好祝愿的行为或言语。"], ["平安", "píng'ān", "bình an", "bình an", "A", "没有危险或困扰的状态，常用于祝福语中。"], ["快乐", "kuàilè", "khoái lạc", "vui vẻ (khoái lạc: nghĩa xấu)", "B", "感到高兴和满足的情感状态。"], ["除夕", "chúxī", "trừ tịch", "đêm giao thừa, đêm ba mươi (trừ tịch)", "C", "农历十二月最后一天晚上，即新旧年之交的时间点。"], ["初一", "chūyī", "sơ nhất", "mồng một", "C", "农历每月的第一天，特别是在春节期间特别重要。"], ["破五", "pòwǔ", "phá ngũ", "mồng năm Tết", "D", "农历正月初五，传统上有破除禁忌、开市营业等习俗。"], ["元旦", "Yuándàn", "nguyên đán", "Tết dương lịch (Nguyên đán: Tết âm lịch)", "B", "公历1月1日，现代中国的法定新年。"], ["腊八", "Làbā", "lạp bát", "ngày mồng tám tháng Chạp", "D", "农历十二月初八。源于古代岁末的腊祭（腊日后定于十二月初八）；后与佛教释迦牟尼成道日相结合，佛寺于此日煮粥供佛，演变为民间喝腊八粥的习俗。"], ["腊月", "làyuè", "lạp nguyệt", "tháng Chạp", "C", "农历十二月。"], ["祭祖", "jìzǔ", "tế tổ", "cúng tổ tiên (tế tổ)", "C", "祭祀祖先的仪式，表示对先人的尊敬和缅怀。"], ["香烛", "xiāngzhú", "hương chúc", "hương đèn, nhang đèn", "C", "焚香和蜡烛，常用于宗教仪式或祭祀活动中。"], ["祭祀", "jìsì", "tế tự", "cúng tế, tế tự", "A", "向神灵或祖先献祭品并举行仪式，祈求庇佑或表达敬意。"], ["祈福", "qífú", "kỳ phúc", "cầu phúc, cầu may", "A", "祈祷获得好运和幸福。"], ["祝愿", "zhùyuàn", "chúc nguyện", "chúc, cầu chúc", "C", "表达美好愿望的行为或言语。"], ["幸福", "xìngfú", "hạnh phúc", "hạnh phúc", "A", "感受到满足和愉悦的生活状态。"], ["和谐", "héxié", "hòa hài", "hài hòa, hòa thuận", "C", "指人际关系融洽、社会秩序稳定的状态。"], ["盛宴", "shèngyàn", "thịnh yến", "yến tiệc, bữa tiệc thịnh soạn", "C", "非常丰盛的宴会，通常是庆祝特殊场合而设。"], ["礼物", "lǐwù", "lễ vật", "quà, quà tặng (lễ vật: đồ dâng lễ)", "B", "赠送给他人的物品，用来表达心意或祝贺。"], ["招待", "zhāodài", "chiêu đãi", "chiêu đãi, tiếp đãi", "A", "接待客人，提供食宿或其他服务，体现热情好客的精神。"], ["万象更新", "wànxiàng-gēngxīn", "vạn tượng canh tân", "vạn vật đổi mới", "C", "一切景象都变得焕然一新，形容新年伊始，世界充满希望。"], ["辞旧迎新", "cíjiù-yíngxīn", "từ cựu nghênh tân", "tiễn năm cũ, đón năm mới", "C", "告别旧的一年，迎接新的一年，常用于春节期间表达对新年的期待。"], ["张灯结彩", "zhāngdēng-jiécǎi", "trương đăng kết thái", "giăng đèn kết hoa", "C", "挂起灯笼，系上彩带，形容节日的喜庆装饰。"], ["阖家欢乐", "héjiā-huānlè", "hạp gia hoan lạc", "cả nhà vui vẻ", "C", "全家人都很快乐，常用作祝福语，特别是在节日期间。"], ["新春快乐", "xīnchūn-kuàilè", "tân xuân khoái lạc", "chúc mừng năm mới", "C", "祝对方新年快乐，是春节期间常用的祝福语。"], ["龙腾虎跃", "lóngténg-hǔyuè", "long đằng hổ dược", "rồng bay hổ nhảy; khí thế sôi nổi", "C", "形容气势雄伟，场面热烈，常用于形容节日庆典的气氛。"], ["欢天喜地", "huāntiān-xǐdì", "hoan thiên hỷ địa", "vui mừng hớn hở", "C", "形容非常高兴和喜悦的心情，适用于庆祝活动。"], ["喜气洋洋", "xǐqì-yángyáng", "hỷ khí dương dương", "tưng bừng hân hoan", "C", "充满喜庆和欢快的氛围，适合描述节日的热闹场景。"], ["吉星高照", "jíxīng-gāozhào", "cát tinh cao chiếu", "sao tốt chiếu mệnh", "C", "吉祥之星高悬天空，寓意新的一年好运连连。"], ["万事如意", "wànshì-rúyì", "vạn sự như ý", "vạn sự như ý", "A", "所有事情都按照自己的意愿发展，表示美好的祝愿。"], ["岁岁平安", "suìsuì-píng'ān", "tuế tuế bình an", "năm năm bình an", "C", "每年都能平平安安，是春节期间常用的祝福语之一。"], ["年年有余", "niánnián-yǒuyú", "niên niên hữu dư", "năm nào cũng dư dả", "C", "每年都有盈余，象征着富足和繁荣。"], ["五福临门", "wǔfú-línmén", "ngũ phúc lâm môn", "ngũ phúc lâm môn", "A", "五种福运降临家中，寓意家庭幸福美满。"], ["财源广进", "cáiyuán-guǎngjìn", "tài nguyên quảng tiến", "tiền vào như nước", "C", "财富来源广泛，事业兴旺发达。"], ["恭喜发财", "gōngxǐ-fācái", "cung hỷ phát tài", "cung hỷ phát tài; chúc phát tài", "A", "祝贺对方新年财运亨通，事业成功。"], ["迎春接福", "yíngchūn-jiēfú", "nghênh xuân tiếp phúc", "đón xuân đón phúc", "C", "迎接春天的到来，接纳幸福，表达了对新年的美好期望。"], ["红红火火", "hónghóng-huǒhuǒ", "hồng hồng hỏa hỏa", "rộn ràng, đỏ rực", "C", "形容生活繁荣昌盛，事业蒸蒸日上。"], ["花好月圆", "huāhǎo-yuèyuán", "hoa hảo nguyệt viên", "hoa thơm trăng tròn", "C", "花儿美丽，月亮圆满，象征着美好生活和团圆。"], ["福寿安康", "fúshòu-ānkāng", "phúc thọ an khang", "phúc thọ an khang", "A", "祝福对方福气多、寿命长、身体健康。"], ["春风得意", "chūnfēng-déyì", "xuân phong đắc ý", "xuân phong đắc ý", "A", "形容心情愉快，事业顺利，特别适合在新年时使用。"], ["事事顺心", "shìshì-shùnxīn", "sự sự thuận tâm", "mọi việc thuận lợi", "C", "每件事情都按照心意进行，表示对未来的美好祝愿。"], ["大展宏图", "dàzhǎn-hóngtú", "đại triển hoành đồ", "mở mang sự nghiệp, đại triển hồng đồ", "C", "指大规模地施展宏伟计划，事业取得巨大成就。"], ["步步高升", "bùbù-gāoshēng", "bộ bộ cao thăng", "thăng tiến không ngừng", "C", "形容职位或地位逐渐升高，事业不断进步。"], ["招财进宝", "zhāocái-jìnbǎo", "chiêu tài tiến bảo", "chiêu tài tiến bảo", "A", "吸引财富和宝贝进门，寓意新年财运亨通。"], ["阖家团圆", "héjiā-tuányuán", "hạp gia đoàn viên", "cả nhà đoàn tụ", "C", "全家人团聚在一起，享受天伦之乐，是春节的重要主题。"], ["喜出望外", "xǐchūwàngwài", "hỷ xuất vọng ngoại", "mừng ngoài mong đợi", "C", "遇到意外的好事而感到非常高兴，适用于春节期间意想不到的惊喜。"], ["春暖花开", "chūnnuǎn-huākāi", "xuân noãn hoa khai", "xuân về hoa nở", "C", "春天气候温暖，花朵盛开，可用来表达新春的美好氛围。"], ["一年之计在于春", "yī nián zhī jì zài yú chūn", "nhất niên chi kế tại ư xuân", "kế cả năm bắt đầu từ mùa xuân", "C", "一年的计划要在春天就安排好。比喻凡事要早作打算，开头就要抓紧。"], ["过了腊八就是年", "guò le là bā jiù shì nián", "quá liễu lạp bát tựu thị niên", "qua mồng tám tháng Chạp là Tết đến", "D", "腊八（农历十二月初八）一过，人们就开始忙着准备过年，年味渐浓。"], ["糖瓜祭灶，新年来到；闺女要花，小子要炮", "táng guā jì zào, xīn nián lái dào; guī nǚ yào huā, xiǎo zi yào pào", "đường qua tế táo, tân niên lai đáo, khuê nữ yếu hoa, tiểu tử yếu pháo", "cúng ông Táo xong là Tết đến", "D", "糖瓜是用麦芽糖制成的瓜状食品。旧俗腊月二十三（或二十四）用糖瓜祭送灶神，祭灶之后新年就要来到，女孩子想要花，男孩子想放鞭炮。"], ["打了一冬柴，煮锅腊八粥", "dǎ le yī dōng chái, zhǔ guō là bā zhōu", "đả liễu nhất đông sài, chử oa lạp bát chúc", "đốn củi cả mùa đông chỉ để nấu nồi cháo", "D", "腊八粥是腊月初八熬煮的粥。辛苦打了一冬的柴，只用来煮一锅腊八粥；比喻做事过于浪费，得不偿失。"], ["王小二过年——一年不如一年", "Wáng Xiǎo'èr guò nián — yī nián bù rú yī nián", "vương tiểu nhị quá niên – nhất niên bất như nhất niên", "năm sau tệ hơn năm trước", "C", "比喻境况越来越差。"], ["大年初一吃饺子——没外人", "dà nián chū yī chī jiǎo zi — méi wài rén", "đại niên sơ nhất cật cảo tử – một ngoại nhân", "mồng một Tết ăn sủi cảo – toàn người nhà", "D", "北方风俗，正月初一合家团聚吃饺子，在场的都是自家人。比喻都是自己人，不必见外。"], ["反贴门神——不对脸", "fǎn tiē mén shén — bù duì liǎn", "phản thiếp môn thần – bất đối kiểm", "dán ngược môn thần – không nhìn mặt nhau", "D", "门神应左右相对张贴，贴反了就互不相对。比喻彼此不和，见面互不理睬。"], ["灶王爷伸手——稳拿糖瓜儿", "Zàowángyé shēn shǒu — wěn ná táng guār", "táo vương gia thân thủ – ổn nã đường qua nhi", "chắc như đinh đóng cột", "C", "旧俗腊月二十三用糖瓜供灶王爷，认为灶王爷吃了嘴被粘住，上天不说坏话。比喻办事很有把握。"], ["腊月里的萝卜——冻（动）了心", "là yuè li de luó bo — dòng le xīn", "lạp nguyệt lý đích la bặc – đống liễu tâm", "củ cải tháng Chạp – động lòng", "D", "腊月天寒，萝卜被冻透了心；“冻”谐音“动”。比喻动了心思或动了感情。"]], "obj": ["掌握春节习俗词语及吉祥语", "理解谐音文化与节日饮食的寓意", "能比较中越春节习俗与词汇"], "cls": {"title": "春节吉祥语的结构", "paras": ["春节吉祥语大多是四字格，讲究平仄和对仗，常两两成对使用：“一帆风顺，二龙腾飞”“年年有余，岁岁平安”。", "很多吉祥语利用谐音：“鱼”谐“余”，“福”字倒贴谐“福到”，“橘”谐“吉”。越南语的祝福语多为 Chúc mừng năm mới、An khang thịnh vượng（安康兴旺）、Vạn sự như ý（万事如意），其中后两者正是汉越词。"], "rows": null}, "egg": {"title": "越南南方的“五果盘”谐音", "teaser": "越南南方人过年摆 mãng cầu、dừa、đu đủ、xoài，合起来是一句吉祥话。", "paras": ["越南春节的供桌上要摆放五果盘（mâm ngũ quả）。南方人常选番荔枝（mãng cầu）、椰子（dừa）、木瓜（đu đủ）、芒果（xoài），连读谐音为“cầu vừa đủ xài”，意思是“求够用就好”。", "这与中国春节的谐音文化如出一辙：年夜饭要有鱼，取“年年有余”；把“福”字倒贴，取“福到了”。", "想一想：中越两国的谐音吉祥话，在表达的愿望上有什么不同？"]}, "tips": [{"w": "快乐", "t": "越南语 khoái lạc 多指感官享乐，带贬义；祝福时汉语说“新年快乐”，越南语要说 Chúc mừng năm mới，不能译成 khoái lạc。"}, {"w": "元旦", "t": "汉语“元旦”指公历1月1日，越南语 Tết Nguyên đán 指农历新年（春节），二者形同义异，是翻译中的高频错误。"}]}, {"si": 11, "ch": "第三章 传统节日的词汇", "num": "第二节", "title": "清明节——缅怀先人的情感纽带", "words": [["清明节", "Qīngmíng Jié", "thanh minh tiết", "Tết Thanh minh", "A", "中国传统节日之一，通常在公历4 月4日至6 日之间，用于纪念祖先，扫墓祭祖。"], ["扫墓", "sǎomù", "tảo mộ", "tảo mộ, đi tảo mộ", "A", "清明节期间到祖先坟前清理杂草、修整墓地，并进行祭拜仪式的行为。"], ["祭祖", "jìzǔ", "tế tổ", "cúng tổ tiên", "C", "祭祀祖先的活动，表达对先人的尊敬和缅怀，常在清明节或其他重要节日进行。"], ["祭祀", "jìsì", "tế tự", "cúng tế, tế tự", "A", "向神灵或祖先献祭品并举行仪式，祈求庇佑或表达敬意。"], ["上坟", "shàngfén", "thượng phần", "đi thăm mộ", "C", "前往祖先坟墓进行清扫和祭拜的行为，类似于“扫墓”。"], ["祖先", "zǔxiān", "tổ tiên", "tổ tiên", "A", "指家族中已故的长辈，通常是几代之前的亲人。"], ["香烛", "xiāngzhú", "hương chúc", "hương đèn, nhang đèn", "C", "焚香和蜡烛，常用于宗教仪式或祭祀活动中以示虔诚。"], ["纸钱", "zhǐqián", "chỉ tiền", "vàng mã, tiền giấy", "C", "用纸制成的钱币形状物品，在祭祀时焚烧给祖先使用。"], ["祭品", "jìpǐn", "tế phẩm", "đồ cúng, lễ vật", "C", "供奉给神灵或祖先的食物、酒水等物品，表达敬意和感恩之情。"], ["祭坛", "jìtán", "tế đàn", "bàn thờ, đàn tế", "C", "用于放置祭品、香烛和其他祭祀用品的平台或地点。"], ["祭拜", "jìbài", "tế bái", "cúng bái, khấn vái", "C", "通过跪拜、鞠躬等形式向神灵或祖先表示敬意的仪式。"], ["祖坟", "zǔfén", "tổ phần", "mộ tổ", "C", "家族中祖先的墓地，是后人祭祖的重要场所。"], ["家谱", "jiāpǔ", "gia phả", "gia phả", "A", "记录一个家庭历代成员姓名、事迹等内容的文献，有助于传承家族历史。"], ["族谱", "zúpǔ", "tộc phả", "tộc phả", "A", "与家谱类似，但涵盖范围更广，包括整个宗族的历史和发展情况。"], ["祖祠", "zǔcí", "tổ từ", "nhà thờ họ, từ đường", "C", "供奉祖先牌位的地方，家族成员在此进行祭祀活动。"], ["祖庙", "zǔmiào", "tổ miếu", "miếu thờ tổ, nhà thờ tổ", "C", "供奉祖先的庙；古代特指帝王、诸侯祭祀祖先的宗庙。"], ["祖茔", "zǔyíng", "tổ doanh", "khu mộ tổ tiên", "C", "家族中所有祖先的墓地总称，有时也指祖坟所在的区域。"], ["墓碑", "mùbēi", "mộ bi", "bia mộ", "C", "竖立在坟前的石碑，刻有逝者的名字、生卒年月等信息。"], ["碑文", "bēiwén", "bi văn", "văn bia", "C", "刻在墓碑上的文字，通常记载逝者的事迹、功德及子孙后代的怀念之词。"], ["祭文", "jìwén", "tế văn", "văn tế", "C", "专门用来表达对逝者的哀思和敬意的文章，常在祭祀仪式上宣读。"], ["祭礼", "jìlǐ", "tế lễ", "tế lễ", "A", "指祭祀过程中遵循的一系列礼仪规范和程序。"], ["祭奠", "jìdiàn", "tế điện", "tế điện; cúng viếng", "A", "为死者举行的纪念仪式，包括献花、烧香、供奉祭品等活动。"], ["清明时节", "qīngmíng-shíjié", "thanh minh thời tiết", "tiết Thanh minh", "A", "指清明节期间，是春季祭祖扫墓的重要节日。"], ["慎终追远", "shènzhōng-zhuīyuǎn", "thận chung truy viễn", "thận chung truy viễn; uống nước nhớ nguồn", "C", "谨慎地对待亲人的去世，并追念祖先，表达对逝者的敬重和怀念。"], ["祭如在", "jìrúzài", "tế như tại", "cúng như có mặt", "D", "祭祀时如同祖先就在眼前一样虔诚，形容对祖先的尊敬。"], ["缅怀先烈", "miǎnhuái-xiānliè", "miến hoài tiên liệt", "tưởng nhớ các anh hùng liệt sĩ", "C", "表示对已故英雄烈士的怀念和敬意。"], ["追根溯源", "zhuīgēn-sùyuán", "truy căn tố nguyên", "truy tìm nguồn gốc", "C", "追溯事物的根源，比喻探寻历史、文化或家族的起源。"], ["承前启后", "chéngqián-qǐhòu", "thừa tiền khởi hậu", "nối tiếp truyền thống", "C", "继承前人的事业并为后代开辟道路，适用于描述文化的传承。"], ["继往开来", "jìwǎng-kāilái", "kế vãng khai lai", "kế thừa quá khứ, mở lối tương lai", "C", "继承过去的经验教训，开创未来的新局面。"], ["薪火相传", "xīnhuǒ-xiāngchuán", "tân hỏa tương truyền", "ngọn lửa được truyền nối", "C", "前一根柴刚烧完，后一根柴已经烧着，火永远不熄，比喻师生传授，学问和技艺一代代地继承下去，绵延不绝。"], ["衣钵相传", "yībō-xiāngchuán", "y bát tương truyền", "truyền y bát", "A", "比喻技能、学问等由师傅传授给徒弟或后代。"], ["世代相传", "shìdài-xiāngchuán", "thế đại tương truyền", "đời đời truyền nối", "C", "一代接一代地传承下来，通常用于文化和传统。"], ["血浓于水", "xuènóng-yúshuǐ", "huyết nồng ư thủy", "một giọt máu đào hơn ao nước lã", "C", "血缘关系比水更浓厚，强调亲情的重要性。"], ["骨肉相连", "gǔròu-xiānglián", "cốt nhục tương liên", "máu chảy ruột mềm", "C", "形容亲人之间亲密无间的关系，适用于家庭祭祀活动中。"], ["一脉相承", "yīmài-xiāngchéng", "nhất mạch tương thừa", "nhất mạch tương thừa", "A", "家族传统或文化代代相传，没有中断。"], ["含辛茹苦", "hánxīn-rúkǔ", "hàm tân như khổ", "ngậm đắng nuốt cay", "C", "形容经历艰辛困苦，多用来形容父母养育子女的不易，在祭祖时表达感恩之情。"], ["饮水思源", "yǐnshuǐ-sīyuán", "ẩm thủy tư nguyên", "uống nước nhớ nguồn", "C", "喝水时想到水源，比喻不忘本，感恩祖先。"], ["慎终如始", "shènzhōng-rúshǐ", "thận chung như thủy", "trước sau như một", "C", "到最后仍像开始时一样谨慎（语出《老子》六十四章“慎终如始，则无败事”）。"], ["礼尚往来", "lǐshàngwǎnglái", "lễ thượng vãng lai", "có đi có lại", "C", "在礼节上讲究有来有往，也指你对我怎样，我就对你怎样。"], ["德高望重", "dégāo-wàngzhòng", "đức cao vọng trọng", "đức cao vọng trọng", "A", "道德高尚，受人尊敬，可用于描述被祭祀的先辈。"], ["骨肉至亲", "gǔròu-zhìqīn", "cốt nhục chí thân", "ruột thịt máu mủ", "C", "最亲近的亲属，形容血缘关系密切的人。"], ["生死契阔", "shēngsǐ-qìkuò", "sinh tử khế khoát", "sống chết có nhau", "C", "常作“死生契阔”，语出《诗经·邶风·击鼓》“死生契阔，与子成说”，意为无论生死离合都相守不渝，多表达亲人、夫妻间的深情盟约。"], ["永垂不朽", "yǒngchuí-bùxiǔ", "vĩnh thùy bất hủ", "vĩnh viễn bất diệt, đời đời bất hủ", "C", "永远流传而不磨灭，常用于赞美英雄事迹或纪念逝者的精神。"], ["千古流芳", "qiāngǔ-liúfāng", "thiên cổ lưu phương", "tiếng thơm muôn thuở", "C", "美好的名声永远流传，适用于赞扬先辈的美德。"], ["奉若神明", "fèngruòshénmíng", "phụng nhược thần minh", "tôn sùng như thần thánh", "C", "像崇拜神灵一样地信奉或尊崇某人某物（多含贬义，指盲目崇拜）。"], ["有心拜节，寒食未迟", "yǒu xīn bài jié, hán shí wèi chí", "hữu tâm bái tiết, hàn thực vị trì", "có lòng thì muộn mấy cũng chưa muộn", "C", "寒食在清明前一二日。对不按时拜年的人的戏谑语：真有心去拜节，到寒食节也不算晚。（见清代顾禄《清嘉录》）"], ["上坟船里造祠堂", "shàng fén chuán lǐ zào cí táng", "thượng phần thuyền lý tạo từ đường", "nói cho có, chẳng thật lòng", "D", "上坟指清明扫墓，祠堂是祭祀祖先的家庙。在去扫墓的船上才想到要为祖先建造祠堂；比喻某个念头只是说说而已，并无诚意去做。"], ["新坟不过社", "xīn fén bù guò shè", "tân phần bất quá xã", "mộ mới phải tảo trước ngày xã", "D", "社指春社日（立春后第五个戊日）。新葬的坟要在社日之前祭扫。（见清代顾禄《清嘉录》）"]], "obj": ["掌握清明祭扫相关词语", "理解慎终追远的伦理观念", "能比较中越清明习俗的异同"], "cls": {"title": "“死”的委婉表达", "paras": ["汉语在祭扫场合避免直接说“死”，常用“去世”“逝世”“过世”“走了”“不在了”，书面语还有“仙逝”“作古”“长眠”。", "越南语同样有大量委婉语：qua đời、mất、tạ thế（谢世）、về với tổ tiên（回到祖先身边）。其中 tạ thế 是汉越词，但汉语“谢世”已较少使用，翻译时要注意语体差异。"], "rows": null}, "egg": {"title": "越南的寒食节：吃 bánh trôi 和 bánh chay", "teaser": "越南也过寒食节，但时间在农历三月初三，而且不吃冷食，而是吃汤圆。", "paras": ["中国寒食节在清明前一两天，相传为纪念春秋时期的介子推，古人这一天禁火、吃冷食。后来寒食与清明逐渐合二为一。", "越南的 Tết Hàn thực 定在农历三月初三。人们做 bánh trôi（糯米小汤圆，内包红糖）和 bánh chay（带汤汁的汤圆）祭祖。民间也把它与雄王时代的传说联系在一起。", "同一个节日名称，到了越南，时间、食物和传说都发生了变化——这正是文化词汇“本土化”的典型例子。"]}, "tips": [{"w": "扫墓", "t": "越南语 tảo mộ 是汉越词，口语多说 đi tảo mộ、viếng mộ 或 sửa mộ。越南许多地方在腊月底扫墓“请祖先回家过年”，不一定在清明。"}, {"w": "慎终追远", "t": "语出《论语·学而》“慎终追远，民德归厚矣”。“终”指父母去世，“远”指远祖；越南语可译为 thận chung truy viễn，意译为 nhớ ơn tổ tiên。"}]}, {"si": 12, "ch": "第三章 传统节日的词汇", "num": "第三节", "title": "端午节——纪念屈原的文化符号", "words": [["端午节", "Duānwǔ Jié", "đoan ngọ tiết", "Tết Đoan ngọ (Tết diệt sâu bọ)", "B", "中国传统节日之一，在农历五月初五，相传为纪念屈原，有赛龙舟、吃粽子等习俗。"], ["诗人节", "Shīrén Jié", "thi nhân tiết", "ngày hội nhà thơ", "D", "端午节也被称为诗人节，因为这一天是为了纪念伟大的诗人屈原。"], ["龙舟节", "Lóngzhōu Jié", "long chu tiết", "hội đua thuyền rồng", "D", "端午节的别称，强调了赛龙舟这一重要活动。"], ["天中节", "Tiānzhōng Jié", "thiên trung tiết", "Thiên Trung tiết (tên khác của Tết Đoan ngọ)", "D", "端午节的别称（宋代吴自牧《梦粱录》：“五月五日天中节”）。"], ["龙舟", "lóngzhōu", "long chu", "thuyền rồng", "C", "一种狭长而轻巧的船，船头和船尾装饰成龙形，用于赛龙舟比赛。"], ["赛龙舟", "sàilóngzhōu", "tái long chu", "đua thuyền rồng", "C", "端午节期间的一项传统水上竞技活动，参赛队伍划着龙舟竞速。"], ["粽子", "zòngzi", "tống tử", "bánh ú, bánh tro (gần với zòngzi)", "C", "用粽叶包裹糯米和其他馅料（如豆沙、肉等）制成的食物，是端午节的传统食品。"], ["香囊", "xiāngnáng", "hương nang", "túi thơm", "C", "装有香料的小袋子，佩戴或挂在身上以驱邪避瘟，也是端午节的一种装饰品。"], ["菖蒲", "chāngpú", "xương bồ", "cây xương bồ", "A", "一种水生植物，叶子呈剑状，端午节时人们常用它来悬挂门口以驱邪。"], ["艾草", "àicǎo", "ngải thảo", "cây ngải cứu", "C", "一种具有特殊香气的草本植物，端午节时用来插门上或制作香囊，有辟邪驱蚊的作用。"], ["雄黄酒", "xiónghuángjiǔ", "hùng hoàng tửu", "rượu hùng hoàng", "D", "由雄黄粉配制而成的药酒，传统上用于端午节洒地驱虫或涂抹于儿童额头以避邪。"], ["硫黄", "liúhuáng", "lưu hoàng", "lưu huỳnh", "A", "化学元素，旧也作“硫磺”。并非端午节特有物品，常与雄黄混淆；雄黄是一种含砷的矿物。"], ["五彩线", "wǔcǎixiàn", "ngũ thái tuyến", "chỉ ngũ sắc", "C", "五种颜色的丝线编成的绳子，端午节时系在手腕或脚踝上，象征驱邪保平安。"], ["招魂", "zhāohún", "chiêu hồn", "gọi hồn, chiêu hồn", "A", "古代丧礼，人刚死时登上屋顶呼唤，招回其灵魂；《招魂》也是《楚辞》中的篇名（王逸认为是宋玉所作，一说屈原所作）。"], ["屈原", "Qū Yuán", "khuất nguyên", "Khuất Nguyên", "A", "战国时期的楚国诗人，因爱国情怀投江自尽，相传端午节即为纪念他而设立。"], ["离骚", "Lí Sāo", "ly tao", "Ly Tao", "A", "屈原所著的一首长诗，表达了他对国家命运和个人遭遇的深切忧虑，是中国文学史上的经典之作。"], ["九歌", "Jiǔ Gē", "cửu ca", "Cửu Ca", "A", "屈原创作的一组诗歌，共有十一篇，内容多为祭祀神灵的歌词。"], ["悬蒲", "xuánpú", "huyền bồ", "treo xương bồ", "C", "指将菖蒲悬挂在家门口，以驱邪避灾，是端午节的传统习俗之一。"], ["插艾", "chā'ài", "sáp ngải", "cắm ngải cứu", "C", "端午节时将艾草插在家门口，同样具有驱邪避瘟的意义。"], ["系绳", "jì shéng", "hệ thằng", "buộc chỉ ngũ sắc", "C", "端午节时用五彩线系在手腕或脚踝上，寓意驱邪保平安。"], ["粽叶", "zòngyè", "tống diệp", "lá gói bánh", "C", "用于包裹粽子的叶子，通常是竹叶或芦苇叶。"], ["糯米", "nuòmǐ", "nọa mễ", "gạo nếp", "C", "粘性较强的稻米品种，是制作粽子的主要原料之一。"], ["龙舟竞渡", "lóngzhōu-jìngdù", "long chu cạnh độ", "đua thuyền rồng", "C", "即赛龙舟，端午节期间举行的龙舟比赛，是一项重要的民俗活动。"], ["龙腾虎跃", "lóngténg-hǔyuè", "long đằng hổ dược", "rồng bay hổ nhảy; khí thế sôi nổi", "C", "形容气势雄伟，场面热烈，常用于形容端午节的龙舟竞渡。"], ["悬蒲挂艾", "xuánpú-guà'ài", "huyền bồ quải ngải", "treo xương bồ, cắm ngải", "C", "在端午节悬挂菖蒲和艾草于门口，以驱邪避瘟。"], ["投江殉国", "tóujiāng-xùnguó", "đầu giang tuẫn quốc", "gieo mình xuống sông tuẫn quốc", "C", "指屈原投汨罗江自杀，表达对国家忠诚的决心，是端午节纪念屈原的重要原因。"], ["粽叶飘香", "zòngyè-piāoxiāng", "tống diệp phiêu hương", "bánh ú thơm lừng", "D", "形容粽子的香气四溢，反映了端午节包粽子这一重要习俗。"], ["楚辞遗风", "chǔcí-yífēng", "sở từ di phong", "di phong Sở từ", "A", "指源自楚地的文化风格，尤其是《楚辞》的影响，端午节纪念的诗人屈原正是楚国人。"], ["百舸争流", "bǎigě-zhēngliú", "bách khả tranh lưu", "trăm thuyền đua sóng", "C", "众多船只争相行驶，形象描绘了端午节龙舟竞渡的壮观场景。"], ["系五彩线", "jì wǔcǎixiàn", "hệ ngũ thái tuyến", "buộc chỉ ngũ sắc", "C", "端午节为儿童手腕上系上五色彩线，传说可以避邪保平安。"], ["驱邪避灾", "qūxié-bìzāi", "khu tà tị tai", "trừ tà tránh họa", "C", "通过各种仪式和习俗来驱除邪恶，避免灾难，是端午节的重要主题。"], ["饮雄黄酒", "yǐn xiónghuángjiǔ", "ẩm hùng hoàng tửu", "uống rượu hùng hoàng", "D", "饮用含有雄黄成分的酒，据说可以驱虫解毒，也是端午节的传统习俗之一。"], ["百般无奈", "bǎibān-wúnài", "bách ban vô nại", "trăm bề bất lực, đành chịu", "C", "虽然有很多办法但都无济于事，形容屈原面对国家衰败时的心情。"], ["怀瑾握瑜", "huáijǐn-wòyú", "hoài cẩn ác du", "hoài cẩn ác du; mang phẩm chất ngọc ngà", "D", "形容人具有美好的品德和才能，正如屈原所代表的理想人格。"], ["忠贞不渝", "zhōngzhēn-bùyú", "trung trinh bất du", "trung trinh bất biến; một lòng một dạ", "C", "忠诚坚定，永不改变，是对屈原爱国精神的高度评价。"], ["披肝沥胆", "pīgān-lìdǎn", "phi can lịch đảm", "dốc hết gan ruột, hết lòng trung thành", "C", "比喻竭尽忠诚，真诚待人，反映了屈原对国家的深情厚谊。"], ["含辛茹苦", "hánxīn-rúkǔ", "hàm tân như khổ", "ngậm đắng nuốt cay", "C", "形容经历艰辛困苦，可用于描述屈原一生的经历。"], ["悲愤填膺", "bēifèn-tiányīng", "bi phẫn điền ưng", "uất hận đầy lòng", "C", "心中充满了悲伤和愤怒，形容屈原面对国家命运时的情感状态。"], ["忧国忧民", "yōuguó-yōumín", "ưu quốc ưu dân", "ưu quốc ưu dân; lo nước thương dân", "A", "关心国家大事和人民疾苦，体现了屈原的精神风貌。"], ["一腔热血", "yīqiāng-rèxuè", "nhất khoang nhiệt huyết", "bầu nhiệt huyết", "C", "充满热情和勇气，表达了人们对端午节所蕴含的爱国主义情怀的理解。"], ["千古流芳", "qiāngǔ-liúfāng", "thiên cổ lưu phương", "tiếng thơm muôn thuở", "C", "美好的名声永远流传，适用于赞扬像屈原这样的历史人物。"], ["未吃端午粽，寒衣不可送", "wèi chī duān wǔ zòng, hán yī bù kě sòng", "vị cật đoan ngọ tống, hàn y bất khả tống", "chưa qua Tết Đoan ngọ, chớ cất áo rét", "D", "没过端午节，天气还会忽冷忽热，御寒的衣服不能收起来。"], ["吃了端午粽，还要冻三冻", "chī le duān wǔ zòng, hái yào dòng sān dòng", "cật liễu đoan ngọ tống, hoàn yếu đống tam đống", "ăn bánh Đoan ngọ rồi vẫn còn rét", "D", "吃过端午节的粽子，天气还可能多次转冷。（见清代范寅《越谚》）"], ["端午晴干，农夫喜欢", "duān wǔ qíng gān, nóng fū xǐ huān", "đoan ngọ tình can, nông phu hỷ hoan", "Đoan ngọ nắng ráo, nhà nông vui", "D", "端午节天晴，预示着农田丰收。（农谚）"], ["夏至端午前，坐了种田年", "xià zhì duān wǔ qián, zuò le zhòng tián nián", "hạ chí đoan ngọ tiền, tọa liễu chủng điền niên", "Hạ chí trước Đoan ngọ, năm ấy được mùa", "D", "夏至若在端午节之前，当年雨水调匀，种田轻松，可获丰收。（农谚，见明代王象晋《群芳谱》）"], ["打得船来，过了端午", "dǎ de chuán lái, guò le duān wǔ", "đả đắc thuyền lai, quá liễu đoan ngọ", "đợi được vạ thì má đã sưng", "C", "端午节有赛龙舟的习俗，等把龙船修造好，端午节已经过去了。比喻行动迟缓，错过时机。"], ["癞蛤蟆躲端午——躲得了初一，躲不了十五", "lài há ma duǒ duān wǔ — duǒ de liǎo chū yī, duǒ bu liǎo shí wǔ", "lại cáp mô đóa đoan ngọ – đóa đắc liễu sơ nhất, đóa bất liễu thập ngũ", "chạy trời không khỏi nắng", "C", "旧时有在端午节早晨捉癞蛤蟆制药的习俗。比喻无论如何也躲不过去。"]], "obj": ["掌握端午节习俗与屈原相关词语", "理解端午节的起源与演变", "能比较中国端午节与越南 Tết Đoan ngọ"], "cls": {"title": "同一节日，不同的起源叙事", "paras": ["中国端午节最流行的起源说是纪念屈原，此外还有纪念伍子胥、曹娥等说法，学界也认为它与古代夏季驱瘟避邪的习俗有关。", "越南的 Tết Đoan ngọ 保留了驱邪避疫的一面，发展为“杀虫节”：清晨吃酸果、糯米酒和 bánh ú，以“杀死”体内的害虫。比较两国节日时，要区分“节日名称相同”与“文化内涵相同”。"], "rows": null}, "egg": {"title": "越南的“杀虫节”", "teaser": "越南人在端午节清晨空腹吃酸果，是为了“杀死”肚子里的虫子。", "paras": ["越南的 Tết Đoan ngọ 俗称 Tết diệt sâu bọ。清晨起床后，大人孩子空腹吃李子、荔枝等酸果，喝糯米酒（rượu nếp），据说可以杀死体内的寄生虫。", "这一天越南人也吃 bánh ú（三角形粽子），并在孩子手腕上系五色线，与中国端午的习俗相近；但赛龙舟和纪念屈原的说法在越南并不普遍。", "这说明节日在传播过程中会保留某些习俗、舍弃另一些习俗，形成各自的文化特色。"]}, "tips": [{"w": "端午节", "t": "“端”是“初”的意思，“午”通“五”，“端午”即五月初五。越南俗称 Tết diệt sâu bọ（杀虫节），早晨吃酸果、喝糯米酒，与屈原传说关系不大。"}]}, {"si": 13, "ch": "第三章 传统节日的词汇", "num": "第四节", "title": "中秋节——阖家团圆的美好时刻", "words": [["中秋节", "Zhōngqiū Jié", "trung thu tiết", "Tết Trung thu", "A", "中国传统节日之一，通常在农历八月十五日，庆祝丰收并观赏满月。"], ["月饼", "yuèbing", "nguyệt bính", "bánh Trung thu", "C", "中秋节期间食用的传统糕点，通常为圆形，象征团圆。"], ["月亮", "yuèliang", "nguyệt lượng", "mặt trăng, trăng", "C", "夜空中明亮的天体，中秋节时特别受到关注，象征团圆和美好。"], ["月光", "yuèguāng", "nguyệt quang", "ánh trăng, nguyệt quang", "A", "月亮发出的光线，中秋之夜月光明亮，常用来表达思念之情。"], ["月圆", "yuèyuán", "nguyệt viên", "trăng tròn", "C", "指满月的状态，中秋节正值月圆之时，象征团圆和圆满。"], ["月宫", "yuègōng", "nguyệt cung", "cung trăng, cung Quảng", "C", "传说中嫦娥居住的地方，位于月亮之上。"], ["蟾宫", "chángōng", "thiềm cung", "cung Thiềm, cung trăng", "A", "同“月宫”，因古代传说中月亮上有蟾蜍而得名。"], ["广寒宫", "guǎnghángōng", "quảng hàn cung", "cung Quảng Hàn", "A", "又称“月宫”，是嫦娥在月亮上的居所，寓意寒冷孤寂之地。"], ["桂树", "guìshù", "quế thụ", "cây quế (cây đa trong truyện chú Cuội)", "B", "传说中生长在月宫中的树木，吴刚被罚砍伐这棵永不倒下的桂树。"], ["桂花", "guìhuā", "quế hoa", "hoa quế", "A", "桂树开的花，香气扑鼻，常用于制作月饼和其他美食。"], ["桂枝", "guìzhī", "quế chi", "cành quế", "A", "桂树的树枝，有时用作装饰或象征吉祥。"], ["吴刚", "Wú Gāng", "ngô cương", "Ngô Cương (tương ứng chú Cuội)", "B", "中国古代神话中的人物，因犯错被罚在月宫砍伐桂树。"], ["嫦娥", "Cháng'é", "thường nga", "Hằng Nga, chị Hằng", "A", "中国古代神话中的仙女，因食长生不老药飞升至月宫。"], ["后羿", "Hòuyì", "hậu nghệ", "Hậu Nghệ", "A", "中国古代神话中的英雄，擅长射箭，曾射下九个太阳为民除害。（古籍中射日者原称“羿”，民间常与有穷国君后羿混同）"], ["玉兔", "yùtù", "ngọc thỏ", "thỏ ngọc", "C", "传说中陪伴嫦娥住在月宫的小白兔，常常捣制长生不老药。"], ["蟾蜍", "chánchú", "thiềm thừ", "con cóc (thiềm thừ)", "C", "传说中生活在月宫中的动物，因此月亮也称“蟾宫”。"], ["团圆", "tuányuán", "đoàn viên", "đoàn viên, sum họp", "A", "家庭成员聚集在一起，特别是指在重要节日时的家庭聚会。"], ["祝福", "zhùfú", "chúc phúc", "chúc phúc", "A", "表达良好祝愿的行为或言语。"], ["祭月", "jìyuè", "tế nguyệt", "cúng trăng", "C", "中秋节期间向月亮献祭品以示尊敬和祈求平安幸福的仪式。"], ["灯笼", "dēnglong", "đăng lồng", "đèn lồng (đèn ông sao, đèn kéo quân)", "C", "一种装饰性的灯具，常用作节日装饰，特别是在中秋节期间。"], ["丰收", "fēngshōu", "phong thu", "được mùa, bội thu", "C", "农作物收成丰富，中秋节也是庆祝丰收的时刻。"], ["祈福", "qífú", "kỳ phúc", "cầu phúc", "A", "祈祷获得好运和幸福。"], ["亲情", "qīnqíng", "thân tình", "tình thân", "B", "家庭成员之间的深厚感情。"], ["和谐", "héxié", "hòa hài", "hài hòa", "C", "人际关系融洽、社会秩序稳定的状态。"], ["祝愿", "zhùyuàn", "chúc nguyện", "cầu chúc", "C", "表达美好愿望的行为或言语。"], ["庆祝", "qìngzhù", "khánh chúc", "chúc mừng, ăn mừng (khánh chúc: trang trọng)", "C", "通过各种活动表达喜悦和纪念。"], ["神话", "shénhuà", "thần thoại", "thần thoại", "A", "关于神灵、英雄和自然现象的故事，常带有教育意义。"], ["传说", "chuánshuō", "truyền thuyết", "truyền thuyết", "A", "口耳相传的故事，虽不一定真实但具有文化价值。"], ["花好月圆", "huāhǎo-yuèyuán", "hoa hảo nguyệt viên", "hoa thơm trăng tròn; trăng tròn hoa nở", "C", "形容美好的时光和圆满的情景，适合用于描述中秋佳节。"], ["阖家欢乐", "héjiā-huānlè", "hạp gia hoan lạc", "cả nhà vui vẻ", "C", "全家人都很快乐，常用作节日祝福语。"], ["举杯共庆", "jǔbēi-gòngqìng", "cử bôi cộng khánh", "nâng ly chúc mừng", "C", "大家一起举杯庆祝，表达节日的欢乐氛围。"], ["天伦之乐", "tiānlúnzhīlè", "thiên luân chi lạc", "thiên luân chi lạc; niềm vui sum vầy", "A", "指家庭成员之间享受的天然乐趣，适用于家庭团聚的中秋夜。"], ["金秋送爽", "jīnqiū-sòngshuǎng", "kim thu tống sảng", "thu vàng mát dịu", "C", "金色秋天带来凉爽的天气，描绘中秋时节的美好气候。"], ["共赏明月", "gòngshǎng-míngyuè", "cộng thưởng minh nguyệt", "cùng ngắm trăng sáng", "C", "一起欣赏明亮的月亮，是中秋节的重要活动之一。"], ["合家团圆", "héjiā-tuányuán", "hợp gia đoàn viên", "cả nhà đoàn viên", "C", "全家人团聚在一起，是中秋节的核心主题。"], ["美满幸福", "měimǎn-xìngfú", "mỹ mãn hạnh phúc", "hạnh phúc mỹ mãn", "A", "生活完美而充满幸福，常用来祝愿他人。"], ["良辰美景", "liángchén-měijǐng", "lương thần mỹ cảnh", "lương thần mỹ cảnh; cảnh đẹp giờ lành", "A", "美好的时光和景物，可用来形容中秋佳节。（语出南朝宋谢灵运“天下良辰、美景、赏心、乐事，四者难并”）"], ["人月两团圆", "rén yuè liǎng tuán yuán", "nhân nguyệt lưỡng đoàn viên", "người sum họp, trăng tròn đầy", "C", "人和月亮都团圆了，寓意着家人团聚、万事如意。"], ["万事如意", "wànshì-rúyì", "vạn sự như ý", "vạn sự như ý", "A", "所有事情都按照自己的意愿发展，表示美好的祝愿。"], ["八月十五的月亮——正大光明", "bā yuè shí wǔ de yuè liang — zhèng dà guāng míng", "bát nguyệt thập ngũ đích nguyệt lượng – chính đại quang minh", "trăng rằm tháng Tám – quang minh chính đại", "D", "八月十五是中秋节，这一天的月亮特别圆特别亮，“正大光明”既形容月亮的明亮，也寓意行事正当、公开透明。"], ["中秋月饼——馅儿不少", "zhōng qiū yuèbing — xiànr bù shǎo", "trung thu nguyệt bính – hãm nhi bất thiểu", "bánh Trung thu – nhân nhiều", "D", "月饼内通常含有丰富的馅料，这句话也可以用来形容事情内容丰富、细节很多。"], ["中秋佳节吃月饼——甜在心里", "zhōng qiū jiā jié chī yuè bǐng — tián zài xīn lǐ", "trung thu giai tiết cật nguyệt bính – điềm tại tâm lý", "Trung thu ăn bánh – ngọt đến tận lòng", "D", "中秋节吃月饼象征着家庭团聚，心里充满了甜蜜的感觉。"], ["中秋夜赏月——心旷神怡", "zhōng qiū yè shǎng yuè — xīn kuàng shén yí", "trung thu dạ thưởng nguyệt – tâm khoáng thần di", "đêm Trung thu ngắm trăng – tâm hồn thư thái", "D", "中秋节的夜晚，人们喜欢赏月，明月高悬，景色宜人，让人感到心情舒畅、精神愉快。"], ["吴刚砍桂树——没完没了", "Wú Gāng kǎn guì shù — méi wán méi liǎo", "ngô cương khảm quế thụ – một hoàn một liễu", "Ngô Cương chặt quế – không bao giờ xong", "C", "根据传说，吴刚因犯错被罚在月宫砍伐一棵永不倒下的桂树，象征着一种无尽的任务或惩罚。"], ["吴刚伐桂——徒劳无功", "Wú Gāng fá guì — tú láo wú gōng", "ngô cương phạt quế – đồ lao vô công", "Ngô Cương chặt quế – công cốc", "C", "吴刚砍伐桂树的任务永远无法完成，比喻做了很多努力却没有成效。"], ["后羿射日——为民除害", "Hòuyì shè rì — wèi mín chú hài", "hậu nghệ xạ nhật – vị dân trừ hại", "Hậu Nghệ bắn mặt trời – trừ hại cho dân", "D", "后羿射下了九个太阳，拯救了人类免受酷热之苦，形容英雄行为，为了人民的利益而奋斗。"], ["玉兔捣药——长生不老", "yù tù dǎo yào — cháng shēng bù lǎo", "ngọc thỏ đảo dược – trường sinh bất lão", "thỏ ngọc giã thuốc – trường sinh bất lão", "D", "传说中玉兔在月宫为嫦娥捣制长生不老药，象征着长寿和健康。"], ["玉兔捣药——一心一意", "yù tù dǎo yào — yī xīn yī yì", "ngọc thỏ đảo dược – nhất tâm nhất ý", "thỏ ngọc giã thuốc – một lòng một dạ", "D", "传说中玉兔专心致志地为嫦娥捣制长生不老药，形容做事专注、用心。"], ["八月十五过中秋——赶上了好时候", "bā yuè shí wǔ guò zhōng qiū — gǎn shàng le hǎo shí hòu", "bát nguyệt thập ngũ quá trung thu – cản thượng liễu hảo thời hậu", "rằm tháng tám đón Trung thu – gặp lúc thuận lợi", "D", "中秋节是一个重要的传统节日，家人团聚、共度佳节，所以“赶上了好时候”表达了对美好时光的珍惜。"], ["中秋月下猜灯谜——趣味无穷", "zhōng qiū yuè xià cāi dēng mí — qù wèi wú qióng", "trung thu nguyệt hạ sai đăng mê – thú vị vô cùng", "đêm Trung thu đoán câu đố đèn – thú vị vô cùng", "D", "部分地区中秋节也有猜灯谜的活动（猜灯谜主要是元宵节习俗），这个歇后语强调了猜灯谜的乐趣。"], ["中秋赏月吃月饼——甜甜蜜蜜", "zhōng qiū shǎng yuè chī yuè bǐng — tián tián mì mì", "trung thu thưởng nguyệt cật nguyệt bính – điềm điềm mật mật", "ngắm trăng ăn bánh – ngọt ngào", "D", "中秋节时一边赏月一边品尝月饼，象征着家庭幸福美满，生活甜蜜。"], ["八月十五云遮月——扫兴", "bā yuè shí wǔ yún zhē yuè —— sǎo xìng", "bát nguyệt thập ngũ vân già nguyệt – tảo hứng", "rằm tháng tám mây che trăng – mất hứng (chơi chữ 兴/星)", "D", "中秋节赏月时如果遇到阴天或云遮住了月亮，会让人感到失望，即“扫兴”。（另有农谚“八月十五云遮月，正月十五雪打灯”，指中秋阴天则来年元宵多雪）"], ["嫦娥奔月——一去不复返", "Cháng'é bēn yuè — yī qù bù fù fǎn", "thường nga bôn nguyệt – nhất khứ bất phục phản", "Hằng Nga bay lên cung trăng – một đi không trở lại", "D", "比喻人一旦离开某个地方或环境，就不再回来。"], ["人逢喜事精神爽，月到中秋分外明", "rén féng xǐ shì jīng shén shuǎng, yuè dào zhōng qiū fèn wài míng", "nhân phùng hỷ sự tinh thần sảng, nguyệt đáo trung thu phận ngoại minh", "gặp chuyện vui tinh thần phấn chấn, trăng đến Trung thu sáng lạ thường", "D", "人遇到喜事精神格外爽快，月亮到了中秋格外明亮。（俗语）"], ["月圆人圆，事事圆满", "yuè yuán rén yuán, shì shì yuán mǎn", "nguyệt viên nhân viên, sự sự viên mãn", "trăng tròn người sum họp, mọi việc viên mãn", "C", "中秋之夜月亮圆润，寓意着家人团聚，所有事情都能顺遂如意。"], ["千里共婵娟，天涯若比邻", "qiān lǐ gòng chán juān, tiān yá ruò bǐ lín", "thiên lý cộng thuyền quyên, thiên nhai nhược tỷ lân", "nghìn dặm chung một vầng trăng; xa mặt nhưng không cách lòng", "C", "由两句诗组合而成：苏轼《水调歌头》“但愿人长久，千里共婵娟”与王勃《送杜少府之任蜀州》“海内存知己，天涯若比邻”，表达对远方亲友的思念。"], ["家和万事兴", "jiā hé wàn shì xīng", "gia hòa vạn sự hưng", "gia hòa vạn sự hưng; nhà yên thì mọi việc thành", "A", "家庭和睦，一切事情就能兴旺顺利；中秋团圆之时常用此语。（俗语）"], ["月光洒银辉，人间添祥瑞", "yuè guāng sǎ yín huī, rén jiān tiān xiáng ruì", "nguyệt quang sái ngân huy, nhân gian thiêm tường thụy", "ánh trăng rải bạc, nhân gian thêm điềm lành", "D", "中秋夜的月光如银色光辉洒落大地，给世间带来吉祥的气息。"], ["八月十五月儿圆，全家团圆乐无边", "bā yuè shí wǔ yuèr yuán, quán jiā tuán yuán lè wú biān", "bát nguyệt thập ngũ nguyệt nhi viên, toàn gia đoàn viên lạc vô biên", "rằm tháng tám trăng tròn, cả nhà sum họp vui vô bờ", "D", "中秋节时全家团聚在一起，享受天伦之乐。"], ["秋风送爽迎丰收，阖家欢乐度中秋", "qiū fēng sòng shuǎng yíng fēng shōu, hé jiā huān lè dù zhōng qiū", "thu phong tống sảng nghênh phong thu, hạp gia hoan lạc độ trung thu", "gió thu mát đón mùa màng, cả nhà vui đón Trung thu", "D", "秋天的凉爽伴随着丰收的喜悦，全家欢聚一堂庆祝中秋。"], ["月照千山静，心安即是家", "yuè zhào qiān shān jìng, xīn ān jí shì jiā", "nguyệt chiếu thiên sơn tĩnh, tâm an tức thị gia", "trăng soi nghìn núi lặng, lòng an là nhà", "D", "无论身处何方，只要内心平静安宁，就能感受到家的温暖。"], ["月满人间，福满人间", "yuè mǎn rén jiān, fú mǎn rén jiān", "nguyệt mãn nhân gian, phúc mãn nhân gian", "trăng đầy nhân gian, phúc đầy nhân gian", "D", "中秋的满月象征着幸福和好运充满人间。"], ["一轮明月挂中天，两地相思情绵绵", "yī lún míng yuè guà zhōng tiān, liǎng dì xiāng sī qíng mián mián", "nhất luân minh nguyệt quải trung thiên, lưỡng địa tương tư tình miên miên", "vầng trăng giữa trời, hai nơi thương nhớ", "C", "中秋夜的明月挂在天空，引发人们对远方亲人的深深思念。"], ["天上月圆，人间月半；月月月圆逢月半", "tiān shàng yuè yuán, rén jiān yuè bàn, yuè yuè yuè yuán féng yuè bàn", "thiên thượng nguyệt viên, nhân gian nguyệt bán, nguyệt nguyệt nguyệt viên phùng nguyệt bán", "trên trời trăng tròn, nhân gian trăng khuyết", "D", "一副流传很广的对联的上联，以“月”字反复出现形成文字游戏：农历每月十五（月半）月亮最圆。"], ["举头望明月，低头思故乡", "jǔ tóu wàng míng yuè, dī tóu sī gù xiāng", "cử đầu vọng minh nguyệt, đê đầu tư cố hương", "ngẩng đầu nhìn trăng sáng, cúi đầu nhớ cố hương (Tĩnh dạ tứ)", "C", "出自李白《静夜思》，表达了对故乡和亲人的怀念之情。"], ["明月几时有，把酒问青天", "míng yuè jǐ shí yǒu, bǎ jiǔ wèn qīng tiān", "minh nguyệt kỷ thời hữu, bả tửu vấn thanh thiên", "trăng sáng có từ bao giờ, nâng chén hỏi trời xanh (Thủy điệu ca đầu)", "C", "出自苏轼的《水调歌头》，反映了人们在中秋时节对宇宙和人生的思考。"], ["中秋佳节倍思亲，远在他乡亦念家", "zhōng qiū jiā jié bèi sī qīn, yuǎn zài tā xiāng yì niàn jiā", "trung thu giai tiết bội tư thân, viễn tại tha hương diệc niệm gia", "mỗi độ Trung thu càng nhớ người thân", "C", "中秋节期间，身在异乡的人们更加思念家乡和亲人。"], ["团圆饭吃得好，一年四季都平安", "tuán yuán fàn chī de hǎo, yī nián sì jì dōu píng ān", "đoàn viên phạn cật đắc hảo, nhất niên tứ qúy đô bình an", "cơm đoàn viên ăn ngon, bốn mùa đều bình an", "D", "中秋佳节全家人围坐一起享用团圆饭，预示着未来一年都会平安顺遂。"], ["八月十五大过年", "bā yuè shí wǔ dà guò nián", "bát nguyệt thập ngũ đại quá niên", "rằm tháng Tám còn hơn cả Tết", "D", "中秋节比过年还重要。体现了民间对中秋团圆的重视。"], ["八月十五云遮月，正月十五雪打灯", "bā yuè shí wǔ yún zhē yuè, zhēng yuè shí wǔ xuě dǎ dēng", "bát nguyệt thập ngũ vân già nguyệt, chinh nguyệt thập ngũ tuyết đả đăng", "rằm tháng Tám mây che trăng thì rằm tháng Giêng tuyết rơi", "D", "中秋夜如果云遮住了月亮，来年元宵节就会下雪。（农谚）"], ["男不拜月，女不祭灶", "nán bù bài yuè, nǚ bù jì zào", "nam bất bái nguyệt, nữ bất tế táo", "đàn ông không bái trăng, đàn bà không cúng Táo", "D", "旧俗中秋拜月由妇女主持，男子不拜；腊月二十三祭灶由男子主持，妇女不祭。（见清代富察敦崇《燕京岁时记》）"]], "obj": ["掌握中秋节习俗、神话人物与相关词语", "理解歇后语、谚语中的中秋意象", "能比较中越中秋节的不同侧重"], "cls": {"title": "神话人物名称的汉越对应", "paras": ["“嫦娥”原名“姮娥”，汉代因避汉文帝刘恒的名讳改称“常娥”，后写作“嫦娥”。越南语称 Hằng Nga，保留的正是“姮娥”的读音。", "其他中秋人物的对应情况各不相同：“玉兔”译为 thỏ ngọc，属同形同义；“吴刚”在越南没有对应人物，民间以 chú Cuội 的传说填补这一位置，属文化替换。"], "rows": [["嫦娥（姮娥）", "Hằng Nga", "保留古名读音"], ["玉兔", "thỏ ngọc", "同形同义"], ["吴刚", "chú Cuội", "文化替换"]]}, "egg": {"title": "chú Cuội 和星星灯", "teaser": "越南孩子过中秋，听的是 chú Cuội 坐在榕树下的故事，提的是五角星形状的灯。", "paras": ["传说 chú Cuội 是一个樵夫，他有一棵能救命的神奇榕树。妻子不小心用脏水浇了树，榕树连根拔起飞向天空，Cuội 抓住树根，跟着榕树一起飞到了月亮上。所以越南人说，月亮上的黑影就是 Cuội 坐在榕树下。", "越南的中秋节更像儿童节：孩子们提着星星灯（đèn ông sao）、走马灯（đèn kéo quân）游行，看舞狮（múa lân），吃月饼（bánh Trung thu）。", "比较：中国中秋强调“团圆”，越南中秋强调“儿童”。"]}, "tips": [{"w": "吴刚", "t": "越南的月亮传说主角是 chú Cuội，他坐在月中的榕树（cây đa）下；汉语的“吴刚伐桂”在越南语中常借 chú Cuội 来对应，属文化替换。"}, {"w": "嫦娥", "t": "越南语称嫦娥为 Hằng Nga，对应的汉字是“姮娥”，即嫦娥的古称；翻译汉语“嫦娥”时应用 Hằng Nga，不要按“嫦”的汉越音另造。"}]}, {"si": 14, "ch": "第三章 传统节日的词汇", "num": "第五节", "title": "其他重要节日", "words": [["元宵节", "Yuánxiāo Jié", "nguyên tiêu tiết", "Tết Nguyên tiêu, rằm tháng Giêng", "A", "中国传统节日之一，通常在农历正月十五日，是春节庆祝活动的最后一天，主要习俗包括赏花灯、吃元宵（汤圆）等。"], ["元宵/ 汤圆", "yuánxiāo-tāngyuán", "nguyên tiêu thang viên", "bánh trôi, chè trôi nước", "C", "一种用糯米粉制成的圆形食品，内含甜馅或咸馅，是元宵节的传统食品，象征团圆美满。"], ["花灯", "huādēng", "hoa đăng", "hoa đăng, đèn hoa", "A", "装饰精美的灯笼，常用于元宵节期间的灯会展示，有各种形状和图案。"], ["猜灯谜", "cāidēngmí", "sai đăng mê", "đoán câu đố đèn lồng", "D", "元宵节期间的一种传统娱乐活动，将谜语写在纸条上并贴在花灯上供人猜测。"], ["舞龙", "wǔlóng", "vũ long", "múa rồng", "C", "一种传统的民间舞蹈表演形式，舞者手持长杆操纵一条彩色布制巨龙游行，以祈求好运。"], ["舞狮", "wǔshī", "vũ sư", "múa lân", "C", "另一种传统的民间舞蹈表演形式，模拟狮子的动作进行舞蹈，象征驱邪避灾。"], ["社火", "shèhuǒ", "xã hỏa", "hội diễn xã hỏa (diễn xướng dân gian)", "D", "民间在节日（尤其是春节、元宵节期间）举行的传统集体游艺活动，如舞狮子、耍龙灯、踩高跷等。"], ["踩高跷", "cǎigāoqiāo", "thải cao khiêu", "đi cà kheo", "C", "一种传统的民俗表演形式，表演者穿着特制的高跷行走或跳舞。"], ["放烟火", "fàngyānhuǒ", "phóng yên hỏa", "bắn pháo hoa", "C", "燃放烟花，增加节日气氛，尤其在元宵节晚上举行。"], ["灯会", "dēnghuì", "đăng hội", "hội hoa đăng", "C", "元宵节期间举办的大型花灯展览活动，吸引众多游客前来观赏。"], ["天官赐福", "tiānguān-cìfú", "thiên quan tứ phúc", "thiên quan tứ phúc", "A", "源自道教信仰，认为正月十五为天官赐福的日子，人们在这一天祈求福祉。"], ["走百病", "zǒubǎibìng", "tẩu bách bệnh", "đi “tẩu bách bệnh” (tục giải trừ bệnh tật)", "D", "古代妇女在元宵节夜晚结伴出行，认为可以驱除疾病和不祥，保佑健康。"], ["打太平鼓", "dǎtài-pínggǔ", "đả thái bình cổ", "đánh trống thái bình", "D", "一种传统的打击乐器表演形式，常在元宵节期间进行，寓意平安吉祥。"], ["闹元宵", "nàoyuánxiāo", "náo nguyên tiêu", "vui Tết Nguyên tiêu", "C", "元宵节期间的各种庆祝活动，包括舞龙舞狮、放烟火、猜灯谜等，充满了欢乐和热闹的氛围。"], ["观灯", "guāndēng", "quan đăng", "xem đèn, ngắm hoa đăng", "C", "观赏花灯，是元宵节的重要习俗之一，人们常常全家出动去欣赏各式各样的花灯。"], ["彩灯", "cǎidēng", "thái đăng", "đèn màu", "C", "色彩斑斓的灯笼，元宵节期间常见的装饰品，增加了节日的喜庆气氛。"], ["迎紫姑", "yíngzǐgū", "nghênh tử cô", "rước Tử Cô", "D", "元宵夜妇女迎请厕神紫姑，以占卜蚕桑收成及来年诸事吉凶的民间习俗。"], ["张灯结彩", "zhāngdēng-jiécǎi", "trương đăng kết thái", "giăng đèn kết hoa", "C", "挂起灯笼，系上彩带，形容节日的喜庆装饰，特别适合用于描述元宵节的热闹场面。"], ["花灯如海", "huādēng-rúhǎi", "hoa đăng như hải", "biển hoa đăng", "C", "形容元宵节期间街头巷尾挂着无数美丽的花灯，如同海洋般壮观。"], ["灯火辉煌", "dēnghuǒ-huīhuáng", "đăng hỏa huy hoàng", "đèn đuốc sáng trưng", "C", "灯光灿烂明亮，常用来描绘元宵夜市或庆祝活动的景象。"], ["人山人海", "rénshān-rénhǎi", "nhân sơn nhân hải", "biển người, người đông như kiến", "C", "形容人群密集，像山和海一样多，适用于描述元宵节游园会等大型活动。"], ["观灯猜谜", "guāndēng-cāimí", "quan đăng sai mê", "ngắm đèn đoán đố", "C", "观赏花灯并猜测灯谜，是元宵节的传统娱乐方式之一。"], ["龙腾虎跃", "lóngténg-hǔyuè", "long đằng hổ dược", "rồng bay hổ nhảy", "C", "形容气势雄伟，场面热烈，可用于形容元宵节的舞龙舞狮表演。"], ["欢天喜地", "huāntiān-xǐdì", "hoan thiên hỷ địa", "vui mừng hớn hở", "C", "形容非常高兴和喜悦的心情，适用于庆祝活动。"], ["普天同庆", "pǔtiān-tóngqìng", "phổ thiên đồng khánh", "khắp nơi vui mừng", "C", "天下人都一同庆祝，强调节日的普遍性和重要性，适用于元宵节这样的全民节日。"], ["其乐融融", "qílè-róngróng", "kỳ lạc dung dung", "vui vẻ đầm ấm", "C", "形容家庭或群体间充满欢乐和谐的氛围，适用于元宵节的家庭团聚。"], ["五光十色", "wǔguāng-shísè", "ngũ quang thập sắc", "ngũ quang thập sắc; muôn màu rực rỡ", "A", "形容色彩斑斓，光芒四射，可用于描绘元宵节花灯的绚丽多彩。"], ["万紫千红", "wànzǐ-qiānhóng", "vạn tử thiên hồng", "muôn hồng nghìn tía", "C", "形容百花齐放、颜色繁多的样子，也适用于形容元宵节灯会的丰富多样。"], ["众志成城", "zhòngzhì-chéngchéng", "chúng chí thành thành", "chúng chí thành thành; đồng lòng như bức thành", "A", "大家团结一致，力量如同坚固的城墙，适用于描述节日庆典中的团结精神。"], ["举国欢庆", "jǔguó-huānqìng", "cử quốc hoan khánh", "cả nước hân hoan", "C", "全国上下共同庆祝，表达了元宵节作为国家重要传统节日的意义。"], ["百闻不如一见", "bǎi wén bù rú yī jiàn", "bách văn bất như nhất kiến", "trăm nghe không bằng một thấy", "C", "听别人说一百次，也不如自己亲眼见一次，适用于鼓励人们亲自参与元宵节的活动。"], ["迎春接福", "yíngchūn-jiēfú", "nghênh xuân tiếp phúc", "đón xuân đón phúc", "C", "迎接春天的到来，接纳幸福，表达了对新年的美好期望。"], ["瑞雪兆丰年", "ruì xuě zhào fēng nián", "thụy tuyết triệu phong niên", "tuyết lành báo hiệu năm được mùa", "D", "瑞雪预示着来年丰收，虽然是冬季成语，但也可以用在元宵节前后的祝福中。（农谚）"], ["岁月静好", "suìyuè-jìnghǎo", "tuế nguyệt tĩnh hảo", "năm tháng bình yên", "C", "时光平和美好，适用于祝愿人们在新的一年里生活平静而幸福，尤其适合元宵节这样象征团圆和希望的时刻。"], ["正月十五看花灯——热闹非凡", "zhēng yuè shí wǔ kàn huā dēng — rè nào fēi fán", "chính nguyệt thập ngũ khán hoa đăng – nhiệt náo phi phàm", "rằm tháng Giêng xem hoa đăng – náo nhiệt vô cùng", "D", "元宵节（正月十五）有观赏花灯的习俗，形容场面非常热闹。"], ["重阳节", "Chóngyáng Jié", "trùng dương tiết", "Tết Trùng cửu, Tết Trùng dương", "A", "中国传统节日之一，时间为农历九月初九，因《易经》中把“九”定为阳数，两九相重，故名重阳节。这一天有登高、插茱萸、饮菊花酒等习俗。"], ["登高", "dēnggāo", "đăng cao", "lên cao", "C", "重阳节的重要习俗之一，人们会在这一天去登山或爬高处，寓意避灾祈福、强身健体。"], ["茱萸", "zhūyú", "thù du", "cây thù du", "A", "一种植物，传统上认为具有驱邪避灾的作用，在重阳节时人们会佩戴茱萸或者将其插在家门口。"], ["菊花", "júhuā", "cúc hoa", "hoa cúc", "C", "秋季开花的花卉，因其耐寒且花期长，被视为长寿的象征，重阳节期间常用来观赏和饮用菊花茶或菊花酒。"], ["菊花酒", "júhuājiǔ", "cúc hoa tửu", "rượu hoa cúc", "C", "用菊花酿制的酒，重阳节的传统饮品，据说可以延年益寿、清热解毒。"], ["敬老", "jìnglǎo", "kính lão", "kính lão, kính trọng người già", "A", "重阳节也被视为敬老节，倡导尊敬老人、孝顺长辈的文化传统。"], ["长寿", "chángshòu", "trường thọ", "trường thọ, sống lâu", "A", "指寿命长久，重阳节期间有很多象征长寿的活动和祝福，如吃长寿面、饮菊花酒等。"], ["插茱萸", "chāzhūyú", "sáp thù du", "cài thù du", "D", "重阳节的传统习俗之一，将茱萸插在帽子上或家门口以驱邪避灾。"], ["赏菊", "shǎngjú", "thưởng cúc", "ngắm hoa cúc", "C", "重阳节期间，人们喜欢欣赏盛开的菊花，这一活动不仅是为了观赏美景，也寓意健康长寿。"], ["重九", "Chóngjiǔ", "trùng cửu", "Trùng cửu", "A", "即重阳节，因为日期是农历九月初九，“九”在中国文化中是最大的阳数，所以称为“重九”。"], ["重阳糕", "chóngyánggāo", "trùng dương cao", "bánh Trùng dương", "D", "重阳节的传统食品，一种用糯米粉和其他材料制成的糕点，形状多样，有时还会加入红枣、核桃等配料。"], ["秋游", "qiūyóu", "thu du", "dạo chơi mùa thu, đi chơi thu", "C", "秋天外出游玩，重阳节正值秋季，天气凉爽宜人，适合进行户外活动，如登山、郊游等。"], ["敬老尊贤", "jìnglǎo-zūnxián", "kính lão tôn hiền", "kính lão tôn hiền", "A", "尊敬老人和有德行的人，体现了重阳节敬老的传统美德。"], ["登高望远", "dēnggāo-wàngyuǎn", "đăng cao vọng viễn", "lên cao nhìn xa", "C", "登上高处眺望远方，不仅指实际的登山活动，也比喻追求更高的目标或展望未来。这与重阳节登高的习俗相契合。"], ["延年益寿", "yánnián-yìshòu", "diên niên ích thọ", "diên niên ích thọ; kéo dài tuổi thọ", "A", "延长寿命，增加健康，寓意长寿。在重阳节期间，人们通过各种方式祈求长寿。"], ["松鹤延年", "sōnghè-yánnián", "tùng hạc diên niên", "tùng hạc diên niên", "A", "松树和仙鹤在中国文化中象征长寿，此成语用来祝福人长寿安康，常用于重阳节的祝福语境中。"], ["福寿安康", "fúshòu-ānkāng", "phúc thọ an khang", "phúc thọ an khang", "A", "祝福他人幸福长寿且身体健康，适合在重阳节这样的节日里使用。"], ["老当益壮", "lǎodāngyìzhuàng", "lão đương ích tráng", "càng già càng dẻo càng dai", "C", "年纪虽大但精神体力更加健旺，反映了老年人依然保持活力的状态，符合重阳节倡导的积极老年生活态度。"], ["长命百岁", "chángmìng-bǎisuì", "trường mệnh bách tuế", "sống lâu trăm tuổi", "C", "祝愿人长寿至一百岁，是常见的祝福语，尤其适用于像重阳节这样强调长寿的节日。"], ["人寿年丰", "rénshòu-niánfēng", "nhân thọ niên phong", "người thọ mùa được", "C", "人们健康长寿，年成丰收，表达了对美好生活的祝愿，也适用于重阳节期间的祝福。"], ["阖家欢乐", "héjiā-huānlè", "hạp gia hoan lạc", "cả nhà vui vẻ", "C", "全家人都很开心快乐，虽然不是专门针对重阳节的成语，但在家庭团聚时非常适用，包括重阳节的家庭聚会。"], ["正月十五贴门神——晚了半月", "zhēng yuè shí wǔ tiē mén shén — wǎn le bàn yuè", "chinh nguyệt thập ngũ thiếp môn thần – vãn liễu bán nguyệt", "dán môn thần ngày rằm tháng Giêng – muộn mất nửa tháng", "D", "门神应在除夕或正月初一张贴，到正月十五才贴，已经晚了半个月。比喻做事错过时机。"], ["八月十五晴，正月十五看龙灯", "bā yuè shí wǔ qíng, zhēng yuè shí wǔ kàn lóng dēng", "bát nguyệt thập ngũ tình, chinh nguyệt thập ngũ khán long đăng", "rằm tháng Tám trời quang, rằm tháng Giêng xem đèn rồng", "D", "中秋那天天晴，来年元宵节就不会有雨雪，可以看灯。（农谚，见清代梁章钜《农候杂占》）"], ["云掩中秋月，雨打上元灯", "yún yǎn zhōng qiū yuè, yǔ dǎ shàng yuán dēng", "vân yểm trung thu nguyệt, vũ đả thượng nguyên đăng", "mây che trăng Trung thu, mưa rơi đèn Thượng nguyên", "D", "上元即元宵节。中秋夜月亮被云遮住，来年元宵节就会下雨。（农谚，见明代王象晋《群芳谱》）"], ["重阳无雨看十三，十三无雨一冬干", "chóng yáng wú yǔ kàn shí sān, shí sān wú yǔ yī dōng gān", "trùng dương vô vũ khán thập tam, thập tam vô vũ nhất đông can", "Trùng dương không mưa xem ngày mười ba", "D", "九月初九重阳节不下雨，就看九月十三；如果九月十三也不下雨，整个冬天都会干旱。（农谚）"], ["九月九，蚊虫叮石臼", "jiǔ yuè jiǔ, wén chóng dīng shí jiù", "cửu nguyệt cửu, văn trùng đinh thạch cữu", "tháng Chín mồng chín, muỗi đốt như đốt cối đá", "D", "石臼是石头做的舂米器具。到了重阳节以后，天气转凉，蚊子叮人就像叮在石臼上一样，快要活不成了。（见清代顾禄《清嘉录》）"], ["三月三，九月九，无事不向江边走", "sān yuè sān, jiǔ yuè jiǔ, wú shì bù xiàng jiāng biān zǒu", "tam nguyệt tam, cửu nguyệt cửu, vô sự bất hướng giang biên tẩu", "mồng ba tháng Ba, mồng chín tháng Chín, chớ ra bờ sông", "D", "三月三泛指春季，九月九泛指秋季。旧时春秋两季官船往来多，常拉江边行人去拉纤，所以说没事不要到江边去。"]], "obj": ["掌握元宵节、重阳节相关词语", "理解灯谜、登高等习俗的文化意义", "能说明相关词语在越南语中的对应情况"], "cls": {"title": "灯谜的结构", "paras": ["灯谜一般由谜面、谜目和谜底三部分组成。谜目提示答案的范围，如“打一字”“打一成语”。字谜利用汉字的结构拆合，如“一口咬掉牛尾巴”（打一字）——“告”。", "越南语也有 câu đố（谜语），但多为描述事物特征的韵文，很少利用字形。因为汉越词保留了汉字的语素，越南学生学习字谜时可以借助汉越音理解字的构件。"], "rows": null}, "egg": {"title": "猜一猜：汉字灯谜", "teaser": "“一口咬掉牛尾巴”（打一字）。扫码看答案，再挑战更多灯谜。", "paras": ["①一口咬掉牛尾巴（打一字）——告。“牛”去掉尾巴，下面加“口”。", "②一人一张口，口下长只手（打一字）——拿。“人”“一”“口”“手”上下组合。", "③半个月亮（打一字）——胖。“半”加“月（月字旁）”。", "④千里相逢（打一字）——重。“千”与“里”上下相逢。", "越南也有用汉字结构出谜的传统，称为 đố chữ Hán，古代文人常以此为乐。"]}, "tips": [{"w": "元宵/ 汤圆", "t": "汉语“元宵”既是节日名，也指食品；越南语 Nguyên tiêu 只指节日（俗称 Rằm tháng Giêng），汤圆类食品说 bánh trôi。"}, {"w": "重阳节", "t": "古人以九为阳数，九月初九两阳相重，故称“重阳”或“重九”。越南语 Tết Trùng cửu 是汉越词，但这一节日在越南影响很小。"}]}, {"si": 15, "ch": "第三章 传统节日的词汇", "num": "第六节", "title": "影响到越南的词汇", "words": [["春节", "", "元旦", "Tết Nguyên đán", "", "汉越词（形同义异）；越南语指农历新年；汉语“元旦”指公历新年"], ["元旦", "", "—", "Tết dương lịch", "", "混合词；公历新年"], ["清明节", "", "清明", "Tết Thanh minh", "", "汉越词；扫墓祭祖；越南不少地方也在腊月年底扫墓"], ["寒食节", "", "寒食", "Tết Hàn thực", "", "汉越词；越南在农历三月初三，吃 bánh trôi、bánh chay"], ["端午节", "", "端午", "Tết Đoan ngọ", "", "汉越词；俗称 Tết diệt sâu bọ（杀虫节）"], ["中秋节", "", "中秋", "Tết Trung thu", "", "汉越词；越南突出儿童节日色彩"], ["元宵节", "", "元宵", "Tết Nguyên tiêu", "", "汉越词；越南俗称 Rằm tháng Giêng，多去寺庙祈福"], ["重阳节", "", "重九", "Tết Trùng cửu", "", "汉越词；在越南影响较小"], ["祭灶（小年）", "", "—", "Tết ông Công ông Táo", "", "混合词；腊月二十三；越南有放鲤鱼送灶君的习俗"], ["盂兰盆节／中元节", "", "盂兰", "Vu Lan", "", "汉越词；越南发展为报恩父母的节日"], ["七夕节", "", "七夕", "Thất tịch", "", "汉越词；越南称 ngày Ngâu，有“牛郎织女”（Ngưu Lang Chức Nữ）的传说，农历七月的雨称 mưa Ngâu"], ["中元节", "", "中元", "Tết Trung nguyên", "", "汉越词；农历七月十五，越南与盂兰节同日，有“赦亡人”（xá tội vong nhân）习俗"], ["（雄王祭祖日）", "", "雄王", "Giỗ Tổ Hùng Vương", "", "混合词；农历三月初十，祭祀传说中的建国始祖雄王，越南特有，属文化空缺"], ["（方形）粽子", "", "—", "bánh chưng", "", "纯越词；越南春节必备食品，与中国端午粽子不同"], ["（圆柱形）粽子", "", "—", "bánh tét", "", "纯越词；越南南部春节食品"], ["汤圆、元宵", "", "—", "bánh trôi", "", "纯越词；越南多在寒食节吃"], ["月饼", "", "中秋", "bánh Trung thu", "", "混合词；直译为“中秋饼”"], ["红包、压岁钱", "", "利是", "lì xì", "", "越化借词（粤语）；来自粤语“利是”，另说 mừng tuổi"], ["除夕（零点）", "", "交承", "giao thừa", "", "汉越词；汉语“除夕”在越南语中说 đêm giao thừa"], ["（新年）第一位访客", "", "—", "xông đất", "", "纯越词；越南特有习俗，汉语无对应词"], ["（新年）折取嫩枝祈福", "", "禄", "hái lộc", "", "混合词；越南特有习俗，属词汇空缺"], ["提灯游行", "", "灯", "rước đèn", "", "混合词；中秋节儿童活动"], ["对联、春联", "", "对", "câu đối", "", "混合词；越南也有书写春联（chữ Nho）的传统"], ["（圆形）糯米糕", "", "—", "bánh dày", "", "纯越词；与 bánh chưng 相配，传说象征天圆地方"], ["五果盘", "", "五果", "mâm ngũ quả", "", "混合词；越南春节供桌上摆放五种水果，寓意五福"], ["拜年", "", "祝节", "chúc Tết", "", "混合词；向亲友祝贺新年"], ["扫墓", "", "扫墓", "tảo mộ", "", "汉越词；越南多在清明或腊月底扫墓"], ["（三角形）粽子", "", "—", "bánh ú", "", "纯越词；越南端午节食品，最接近中国的粽子"], ["糯米酒（酒酿）", "", "—", "rượu nếp", "", "纯越词；越南端午节早晨喝，以“杀”体内的虫"], ["舞狮", "", "舞麟", "múa lân", "", "混合词（纯越 múa＋汉越 lân 麟）；越南称“舞麒麟”，春节、中秋节都有"], ["星星灯", "", "—", "đèn ông sao", "", "纯越词；五角星形状的灯笼，越南中秋节儿童玩具"], ["节", "", "tiết／tết", "tiết 指节气，tết 指节日（古汉越读音）", "B", "节日；节气"], ["年画", "", "niên họa", "越南有 tranh Tết／tranh Đông Hồ，形式与内容不同", "C", "春节张贴的民间画"], ["粽子", "", "tống tử", "bánh chưng 是春节食品（方形），bánh ú 更接近粽子", "C", "端午节食品（多为三角形）"], ["吴刚", "", "Ngô Cương", "越南有 chú Cuội 坐在榕树（cây đa）下的传说", "C", "月宫中伐桂的人"], ["守岁", "", "thủ tuế", "说 đón giao thừa，不用汉越词", "C", "除夕熬夜迎接新年"], ["倒福", "", "đảo phúc", "越南没有这一习俗，属词汇空缺", "D", "把“福”字倒贴，谐音“福到”"]], "obj": ["掌握中越传统节日名称的对应关系", "识别节日词语中的形同义异现象", "能用越南语准确解释汉语节日词语"], "cls": {"title": "节日名称中的“形同义异”", "paras": ["节日名称虽然多以汉越词进入越南语，但意义不一定相同。最典型的是“元旦”：汉语指公历新年，越南语 Tết Nguyên đán 指农历新年。", "越南语 Tết 本身来自“节”的古汉越读音，与汉越音 tiết 并存：tiết 指节气（tiết Thanh minh），tết 指节日。同一个汉字有两种读音、两种分工，是汉越词汇对比的重要现象。"], "rows": null}, "egg": {"title": "一字两读：古汉越音与汉越音", "teaser": "Tết 和 tiết、chè 和 trà、gương 和 kính——它们分别是同一个汉字的两种读音。", "paras": ["有些汉字在越南语中有两种读音：较早借入的古汉越音，以及唐代以后形成的汉越音。两种读音往往有分工。", "例如：“节”——tết（节日）／tiết（节气、节操）；“茶”——chè（日常饮用的茶）／trà（较文雅的说法）；“镜”——gương（镜子）／kính（眼镜）；“房”——buồng（房间、一串香蕉）／phòng（房间、部门）；“味”——mùi（气味）／vị（味道）。", "一般来说，古汉越音的词更口语化、更像“纯越词”，汉越音的词更书面化。"]}, "tips": []}];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const TYN = {A:"同形同义",B:"同形异义",C:"异形同义",D:"词汇空缺"};
let cur = 1, tab = "egg";

function secBy(si){ return DATA.find(s => s.si === si) || DATA[0]; }

function buildNav(){
  let h = "", last = "", opts = "";
  for (const s of DATA){
    if (s.ch !== last){ h += `<div class="chh">${esc(s.ch)}</div>`; last = s.ch; opts += `<optgroup label="${esc(s.ch)}">`; }
    h += `<button data-si="${s.si}"><span>${esc(s.num)}</span>${esc(s.title)}</button>`;
    opts += `<option value="${s.si}">${esc(s.num)} ${esc(s.title)}</option>`;
  }
  $("#rail").innerHTML = h;
  $("#picker").innerHTML = opts;
  $("#rail").addEventListener("click", e => { const b = e.target.closest("button"); if (b) go(+b.dataset.si); });
  $("#picker").addEventListener("change", e => go(+e.target.value));
}

function go(si, t){
  cur = si; if (t) tab = t;
  try { history.replaceState(null, "", "#s" + si); } catch(e){}
  render();
  $("#sec").scrollIntoView({block:"start"});
}

function render(){
  const s = secBy(cur);
  document.querySelectorAll("#rail button").forEach(b => b.setAttribute("aria-current", +b.dataset.si === cur));
  $("#picker").value = cur;
  $("#eyebrow").textContent = `${s.ch} · ${s.num}`;
  $("#stitle").textContent = s.title;
  $("#obj").innerHTML = s.obj.map(o => `<li>${esc(o)}</li>`).join("");
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.t === tab));
  const P = $("#panel");
  if (tab === "egg") P.innerHTML = eggHTML(s);
  else if (tab === "cls") P.innerHTML = clsHTML(s);
  else if (tab === "words") { P.innerHTML = wordsHTML(s); bindWords(s); }
  else if (tab === "quiz") { P.innerHTML = `<div class="quiz" id="quiz"></div>`; quiz.start(s); }
}

function eggHTML(s){
  return `<div class="egg"><span class="tag">小越的彩蛋 ${s.si}</span><h3>${esc(s.egg.title)}</h3>
    <p class="teaser">${esc(s.egg.teaser)}</p>${s.egg.paras.map(p => `<p>${esc(p)}</p>`).join("")}</div>`;
}
function clsHTML(s){
  let h = `<h3>${esc(s.cls.title)}</h3>` + s.cls.paras.map(p => `<p>${esc(p)}</p>`).join("");
  if (s.cls.rows) h += `<div class="tblwrap cls"><table><tbody>${s.cls.rows.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  if (s.tips.length){
    h += `<h3 style="margin-top:22px">小越助力</h3>` + s.tips.map(t => `<div class="tip"><img src="${AV}" alt=""><div><b>${esc(t.w)}</b>　${esc(t.t)}</div></div>`).join("");
  }
  return h;
}
function rowHTML(w, withSec){
  return `<tr><td><div class="w">${esc(w[0])}</div><div class="py">${esc(w[1])}</div></td>
    <td class="hv hide-s">${esc(w[2])}</td>
    <td class="vi">${w[4] ? `<span class="ty ty-${w[4]}" title="${TYN[w[4]]||""}">${w[4]}</span> ` : ""}${esc(w[3])}</td>
    <td class="hide-s">${esc(w[5])}${withSec ? `<div class="note">${esc(withSec)}</div>` : ""}</td></tr>`;
}
function wordsHTML(s){
  return `<div class="filters"><span>Lọc theo loại đối ứng:</span>
    ${["A","B","C","D"].map(t => `<label><input type="checkbox" class="tyf" value="${t}" checked id="tyf${t}"> <span class="ty ty-${t}">${t}</span> ${TYN[t]}</label>`).join("")}
    <span id="wcount"></span></div>
    <div class="tblwrap words"><table><thead><tr><th>词语 · 拼音</th><th class="hide-s">汉越音</th><th>越南语 · 对应</th><th class="hide-s">释义</th></tr></thead><tbody id="wbody"></tbody></table></div>`;
}
function bindWords(s){
  const draw = () => {
    const on = [...document.querySelectorAll(".tyf")].filter(x => x.checked).map(x => x.value);
    const list = s.words.filter(w => !w[4] || on.includes(w[4]));
    $("#wbody").innerHTML = list.map(w => rowHTML(w)).join("");
    $("#wcount").textContent = `· ${list.length} mục`;
  };
  document.querySelectorAll(".tyf").forEach(x => x.addEventListener("change", draw));
  draw();
}

/* ---------- 练一练: two question kinds drawn from the section's own rows ---------- */
const quiz = {
  s:null, n:0, ok:0, pool:[],
  start(s){ this.s = s; this.n = 0; this.ok = 0; this.pool = s.words.filter(w => w[3] && w[0].length <= 30); this.next(); },
  pick(arr, k, not){ const a = arr.filter(x => x !== not); const out = []; while (out.length < k && a.length){ out.push(a.splice(Math.floor(Math.random()*a.length),1)[0]); } return out; },
  next(){
    const Q = $("#quiz"); if (!Q) return;
    if (this.pool.length < 4){ Q.innerHTML = `<p>Tiết này chưa đủ mục để luyện tập.</p>`; return; }
    const w = this.pool[Math.floor(Math.random()*this.pool.length)];
    const typed = w[4] && Math.random() < 0.3;
    let opts, ans, prompt;
    if (typed){ prompt = "Loại đối ứng Hán – Việt của từ này là gì?"; opts = ["A","B","C","D"].map(t => [t, `${t} · ${TYN[t]}`]); ans = w[4]; }
    else { prompt = "Chọn cách nói tương ứng trong tiếng Việt:"; const others = this.pick(this.pool, 3, w).map(x => x[3]);
      opts = [w[3], ...others].sort(() => Math.random() - .5).map(v => [v, v]); ans = w[3]; }
    Q.innerHTML = `<div class="score">Câu ${this.n + 1} · Đúng ${this.ok}/${this.n}</div>
      <div class="q">${esc(w[0])}</div><div class="qsub">${esc(w[1])}${w[2] ? " · " + esc(w[2]) : ""}</div>
      <div class="note" style="margin-bottom:8px">${prompt}</div>
      <div class="opts">${opts.map(o => `<button data-v="${esc(o[0])}">${esc(o[1])}</button>`).join("")}</div>
      <div class="fb" id="fb"></div>
      <div style="margin-top:12px;display:flex;gap:8px"><button class="btn" id="nx" disabled>Câu tiếp</button></div>`;
    Q.querySelectorAll(".opts button").forEach(b => b.addEventListener("click", () => {
      if (Q.dataset.done === "1") return; Q.dataset.done = "1";
      const right = b.dataset.v === ans; this.n++; if (right) this.ok++;
      Q.querySelectorAll(".opts button").forEach(x => { if (x.dataset.v === ans) x.classList.add("ok"); });
      if (!right) b.classList.add("no");
      $("#fb").innerHTML = `${right ? "Chính xác." : "Chưa đúng."} <b>${esc(w[0])}</b>：${esc(w[5])}`;
      $("#nx").disabled = false;
    }));
    Q.dataset.done = "0";
    $("#nx").addEventListener("click", () => this.next());
  }
};

/* ---------- global search ---------- */
const norm = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/đ/g, "d");
const ALL = DATA.flatMap(s => s.words.map(w => ({w, s, k: norm(w.slice(0,4).join(" "))})));
$("#q").addEventListener("input", e => {
  const q = norm(e.target.value.trim()); const R = $("#results");
  if (!q){ R.hidden = true; $("#sec").hidden = false; return; }
  const hits = ALL.filter(x => x.k.includes(q)).slice(0, 60);
  R.hidden = false; $("#sec").hidden = true;
  R.innerHTML = `<div class="note" style="margin-bottom:6px">${hits.length ? hits.length + (hits.length === 60 ? "+" : "") + " kết quả" : "Không tìm thấy mục nào."}</div>` +
    (hits.length ? `<div class="tblwrap words"><table><tbody>${hits.map(x => rowHTML(x.w, `${x.s.ch} · ${x.s.num} ${x.s.title}`)).join("")}</tbody></table></div>` : "");
});

$("#tabs").addEventListener("click", e => { const b = e.target.closest("button"); if (b){ tab = b.dataset.t; render(); } });
buildNav();
const m = /^#s(\d+)$/.exec(location.hash || ""); if (m) cur = Math.min(Math.max(+m[1], 1), DATA.length);
render();
</script>
